name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Smoke test installed package binaries
        run: node scripts/smoke-package.mjs

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exercise the package's declared minimum runtime; lint/build run on
          # Node 22 so both the floor and primary development line are covered.
          node-version: "22.12"
          cache: "npm"
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run typecheck:tests

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This job builds one local image and immediately runs it. The default
      # Docker builder is enough and avoids bootstrapping a separate BuildKit
      # container before CI even reaches this repository's Dockerfile.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: qurl-mcp:ci
      - name: Verify MCP introspection
        run: |
          # Bash command-substitution doesn't trip set -e by default, so an
          # exit-on-error from `docker run` (e.g. timeout 124, killed 137)
          # would otherwise let `out` be set to whatever made it to stdout
          # and the step would limp on until a grep finally failed with a
          # misleading "missing tool" message. Fail at the actual cause.
          set -euo pipefail
          shopt -s inherit_errexit
          # `timeout 30s` fails fast with a clear signal if the entrypoint
          # hangs (e.g. an SDK notification-ordering bug) instead of letting
          # the step run to the GitHub Actions default.
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'
          ready='{"jsonrpc":"2.0","method":"notifications/initialized"}'
          list='{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          # Match the JSON-RPC `name` field specifically. A loose grep on the
          # tool name alone would pass when the tool only appears in another
          # tool's description, so dropping a tool from registration could go
          # undetected. The MCP SDK emits minified JSON, so the literal
          # "name":"<tool>" substring appears exactly once per registered tool.
          expect_tools() {
            local out="$1"; shift
            for tool in "$@"; do
              grep -Fq "\"name\":\"$tool\"" <<<"$out" || { echo "tools/list missing $tool (no \"name\":\"$tool\" match)"; echo "$out"; exit 1; }
            done
          }

          # 1. No QURL_API_KEY: the no-account mode, backed by the local qURL
          #    CLI. The image has no qurl binary, so a tool call must return
          #    the install instruction as an isError content block (not a
          #    JSON-RPC transport error), and stderr must say which mode runs.
          out=$(printf '%s\n' "$init" "$ready" "$list" \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_crids","arguments":{}}}' \
            | timeout 30s docker run -i --rm qurl-mcp:ci 2>/tmp/mcp-stderr)
          expect_tools "$out" publish_crid share_by_crid list_crids manage_crid_requests manage_crid_access set_crid_sharing delete_crid
          if grep -Fq '"name":"create_qurl"' <<<"$out"; then echo "account-key tools must not be listed without QURL_API_KEY"; echo "$out"; exit 1; fi
          grep -q "QURL_API_KEY is not set" /tmp/mcp-stderr || { echo "missing no-account mode notice on stderr"; cat /tmp/mcp-stderr; exit 1; }
          grep -Fq '"isError":true' <<<"$out" || { echo "tools/call did not return isError content block"; echo "$out"; exit 1; }
          grep -Fq "qURL CLI (qurl) is not installed" <<<"$out" || { echo "tools/call response missing the install instruction"; echo "$out"; exit 1; }

          # 2. With an account key: the account-key tool surface. tools/list
          #    makes no API call, so a placeholder key is enough.
          out=$(printf '%s\n' "$init" "$ready" "$list" \
            | timeout 30s docker run -i --rm -e QURL_API_KEY=lv_ci_introspection_only qurl-mcp:ci 2>/dev/null)
          expect_tools "$out" create_qurl resolve_qurl list_qurls get_qurl delete_qurl extend_qurl update_qurl mint_link batch_create_qurls publish_crid manage_crid_access
          echo "MCP introspection OK; no-account tools and install instruction, and account-key tools exposed"

  ci-status:
    # `name:` is intentionally omitted: the runner-job lookup below filters
    # by `${{ github.job }}` (the YAML key), and the API's `.name` defaults
    # to the key when `name:` is unset. Keeping them auto-aligned avoids a
    # silent deep-link miss if someone renames one but forgets the other.
    needs: [lint, test, docker]
    # GitHub Actions only writes check-runs, but the legacy combined-status
    # API (read by external probes like Glama's MCP catalog) only sees commit
    # statuses. This job mirrors the aggregate result onto the legacy API so
    # `GET /commits/main/status` flips from `pending` to `success`.
    #
    # DO NOT add `ci/aggregate` to branch protection required checks: this
    # job only fires on `push` to `main`, so configuring it as a required PR
    # check would block all PRs from merging (the check would never report).
    # The legacy status exists for external probes (Glama), not for gating.
    #
    # `if: always()` is intentional: even when lint/test/docker fail, we want
    # to mirror `failure`/`error` to the legacy API instead of leaving it
    # stuck at `pending`. `continue-on-error: true` is the complementary
    # safety: a transient gh-api blip on the mirror itself shouldn't redden
    # the workflow when the upstream check-runs (the source of truth) are
    # already authoritative.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: read
      statuses: write
    steps:
      - name: Set commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_SERVER_URL: ${{ github.server_url }}
        run: |
          # All three jobs always run on push to main today; if any gain a
          # `paths:` filter later, a `skipped` result would falsely report
          # `failure` here. Revisit the skipped→failure mapping at that point.
          # Map cancellations to `error` (the legacy status enum's
          # conventional slot for "didn't run to completion") rather than
          # collapsing them into `failure`.
          if [[ "$LINT_RESULT" == "success" && "$TEST_RESULT" == "success" && "$DOCKER_RESULT" == "success" ]]; then
            STATE="success"
          elif [[ "$LINT_RESULT" == "cancelled" || "$TEST_RESULT" == "cancelled" || "$DOCKER_RESULT" == "cancelled" ]]; then
            STATE="error"
          else
            STATE="failure"
          fi
          # Resolve this job's numeric runner-job id so the legacy status
          # deep-links to the mirror step, not the run summary. The URL
          # needs the numeric id from the API. Self-heal on rename by
          # matching on `${{ github.job }}` (the YAML key) — the job's
          # `name:` is omitted, so the API's `.name` defaults to the key
          # and the two stay aligned automatically.
          # On any lookup miss, fall back to the run-level URL.
          TARGET_URL="$GH_SERVER_URL/$GH_REPO/actions/runs/$GH_RUN_ID"
          JOB_ID=$(gh api \
            "repos/$GH_REPO/actions/runs/$GH_RUN_ID/attempts/$GH_RUN_ATTEMPT/jobs" \
            --jq ".jobs[] | select(.name == \"${{ github.job }}\") | .id" 2>/dev/null \
            | head -n1)
          if [[ -n "$JOB_ID" ]]; then
            TARGET_URL="$GH_SERVER_URL/$GH_REPO/actions/runs/$GH_RUN_ID/job/$JOB_ID"
          fi
          gh api -X POST "repos/$GH_REPO/statuses/$GH_SHA" \
            -f state="$STATE" \
            -f context="ci/aggregate" \
            -f description="lint=$LINT_RESULT test=$TEST_RESULT docker=$DOCKER_RESULT" \
            -f target_url="$TARGET_URL"

  # Slack build-completion card. Thin shim over the fleet-shared reusable
  # in layervai/ops-routines-workflows (public mirror of private
  # layervai/ops-routines); the curl/jq Block Kit payload builder and the
  # gate-result aggregation live there now. Adding/removing a gate is a
  # one-line edit to `needs:` + `gates:` here — no aggregation if-chain.
  # NOTE: the separate `ci/aggregate` commit-status job above is unrelated.
  notify:
    name: Notify
    needs: [lint, test, docker]
    if: always() && github.event_name != 'pull_request'
    permissions: {}
    uses: layervai/ops-routines-workflows/.github/workflows/notify.yml@d07fa2fe3a103907ff2b1a1a71509a6dcd8e9d32 # v0.13.0
    with:
      header: "qURL MCP Build"
      gates: '{"Lint": "${{ needs.lint.result }}", "Tests": "${{ needs.test.result }}", "Docker": "${{ needs.docker.result }}"}'
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

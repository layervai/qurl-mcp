name: API Spec Drift Check

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: read

concurrency:
  group: api-spec-drift
  cancel-in-progress: true

env:
  SPEC_SNAPSHOT: api-spec/qurls.yaml
  # Override this in repo variables to point to a different spec URL
  SPEC_URL: ${{ vars.QURL_API_SPEC_URL || 'https://layerv.ai/docs/qurls.yaml' }}

jobs:
  check-drift:
    name: Check for API spec drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch current API spec
        id: fetch
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            --output /tmp/current-spec.yaml "$SPEC_URL"
          if ! grep -m1 -q '^openapi:' /tmp/current-spec.yaml; then
            echo "::error::Fetched content does not appear to be an OpenAPI spec."
            exit 1
          fi

      - name: Compare with stored snapshot
        id: diff
        run: |
          if ! diff -q "$SPEC_SNAPSHOT" /tmp/current-spec.yaml > /dev/null 2>&1; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            diff -u "$SPEC_SNAPSHOT" /tmp/current-spec.yaml > /tmp/spec-diff.txt || true
            head -n 1500 /tmp/spec-diff.txt > /tmp/spec-diff-truncated.txt
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No API spec drift detected."
          fi

      - name: Report drift
        if: steps.diff.outputs.drift == 'true'
        run: |
          echo '::error::API specification changed. Review the diff in this run summary.'
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/spec-diff-truncated.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit 1

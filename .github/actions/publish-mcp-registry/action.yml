name: Publish to MCP Registry
description: >
  Install pinned mcp-publisher, validate server.json, authenticate via
  GitHub OIDC, and publish to the MCP Registry. Single source of truth
  for the publisher version + sha256 — used by both the automatic
  release-please publish job and the manual workflow_dispatch escape
  hatch.

inputs:
  publisher-version:
    description: Publisher release tag (v1.7.6 or newer)
    required: false
    default: v1.7.9
  publisher-sha256:
    description: SHA256 of the Linux amd64 release archive
    required: false
    default: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac

# Caller must:
#   - have already run actions/checkout (this action does not check out
#     the repo on its own)
#   - declare `id-token: write` on the calling job (needed for
#     `mcp-publisher login github-oidc`)
#   - run on a Linux/amd64 runner; the tarball + sha256 below are for
#     `mcp-publisher_linux_amd64.tar.gz`. macOS or Windows runners
#     would fail at `sha256sum -c -`.
runs:
  using: composite
  steps:
    - name: Install mcp-publisher
      shell: bash
      env:
        PUBLISHER_VERSION: ${{ inputs.publisher-version }}
        PUBLISHER_SHA256: ${{ inputs.publisher-sha256 }}
      run: |
        set -euo pipefail
        # mcp-publisher >= v1.7.6 is REQUIRED: the registry binds the GitHub
        # OIDC token exchange to a per-deployment audience
        # (https://registry.modelcontextprotocol.io). Older publishers request
        # the legacy `mcp-registry` audience and fail `login github-oidc` with
        # a 401 "invalid audience". Do not downgrade below v1.7.6.
        version="$PUBLISHER_VERSION"
        expected_sha="$PUBLISHER_SHA256"
        [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid publisher release tag" >&2; exit 1; }
        [[ "$expected_sha" =~ ^[a-f0-9]{64}$ ]] || { echo "Invalid publisher SHA256" >&2; exit 1; }
        [[ "$(printf '%s\n' v1.7.6 "$version" | sort -V | head -n 1)" == v1.7.6 ]] || { echo "Publisher must be v1.7.6 or newer" >&2; exit 1; }
        tarball="mcp-publisher_linux_amd64.tar.gz"
        url="https://github.com/modelcontextprotocol/registry/releases/download/${version}/${tarball}"
        curl -fsSL --retry 3 --retry-delay 5 "$url" -o /tmp/mcp-publisher.tar.gz
        echo "${expected_sha}  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
        mkdir -p /tmp/mcp-publisher
        tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp/mcp-publisher
        echo "/tmp/mcp-publisher" >> "$GITHUB_PATH"

    - name: Validate server.json
      shell: bash
      run: mcp-publisher validate

    - name: Wait for exact npm release
      shell: bash
      run: node scripts/wait-for-npm-release.mjs

    - name: Authenticate with GitHub OIDC
      shell: bash
      run: mcp-publisher login github-oidc

    - name: Publish to MCP Registry
      shell: bash
      run: mcp-publisher publish

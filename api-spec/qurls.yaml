        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/connectors/agents/{agent_id}/recovery-token:
    post:
      tags:
        - Connectors
      summary: Authorize device credential recovery
      description: |
        Authorizes one recovery of a revoked device credential while retaining
        its identity and existing shares. Requires a user OAuth access token
        and an ID token proving a fresh sign-in after credential revocation.
        The device must belong directly to the signing-in user; selected
        device or organization owners are not supported.
        The caller generates and retains the recovery secret; only its SHA-256
        hash is registered. Exact retries return the original expiry.
        Retain the original request for retries; an already authorized attempt
        does not require another fresh sign-in. A new authorization attempt
        requires a new secret and Idempotency-Key; registered secret hashes
        cannot be reused, even after expiry. If the capability expires unused,
        confirm no native Issue is pending before starting a new authorization.
        Preserve the secret and original request while native Issue is pending.
      operationId: createDeviceRecoveryToken
      security:
        - bearerAuth: [qurl:agent]
      parameters:
        - name: agent_id
          in: path
          required: true
          description: Canonical qURL Connector device identifier.
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$'
        - name: Idempotency-Key
          in: header
          required: true
          description: Persisted UUID for this exact recovery attempt.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_device_key_id, recovery_token_sha256, reauthentication_proof]
              properties:
                expected_device_key_id:
                  type: string
                  pattern: '^key_[A-Za-z0-9]{12}$'
                recovery_token_sha256:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                reauthentication_proof:
                  type: string
                  minLength: 1
                  maxLength: 16384
                  writeOnly: true
      responses:
        '201':
          description: Recovery capability registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRecoveryTokenResponse'
        '200':
          description: Exact recovery attempt replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRecoveryTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Recovery intent conflicts with current device state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          description: Recovery authorization is temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/connectors/devices:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    get:
      tags: [Connectors]
      summary: List Connector devices
      description: Lists assigned devices, including devices with revoked access. Requires read and agent scopes; ordinary account API keys additionally require keys scope. Device credentials cannot use this operation. Counts are current observations and pagination is not a snapshot.
      operationId: listConnectorDevices

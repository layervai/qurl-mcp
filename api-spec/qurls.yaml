      summary: "Revoke a resource and all its qURLs"
      description: |
        Revokes a resource and blocks access through all its qURLs. Use the resource's CRID.
        To revoke one link, use `DELETE /v1/resources/{id}/qurls/{qurl_id}` instead.
        A qURL ID (`q_`) is not accepted by this resource-wide operation.

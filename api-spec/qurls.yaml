  /v1/qurls/batch:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    post:
      tags:
        - QURLs
      summary: Batch create qURLs
      description: |
        Creates up to 100 qURLs in one request. Each item is a `CreateQurlRequest`.

        | Status | Result |
        |---|---|
        | `201` | Every item succeeded. |
        | `207` | Some items succeeded. Read each result before retrying. |
        | `400` | Every item failed, and each result says why. Or request validation rejected the batch. |
        | `403` | The account's enforced monthly data-transfer allowance is exhausted. |
        | `500` | An error on our side stopped the batch before any item succeeded. The response has no per-item results. An item that has a problem of its own is not reported either; it is reported when the request is sent again. |
        | `503` | The plan-limit check or billing is temporarily unavailable. No item was created, and the response has no per-item results. Wait for the time in `Retry-After`, then retry the unchanged request. |

        A `400` reports failures item by item. A `500` or a `503` means that the batch
        failed as a whole: no item was created.

        **Validation:** Invalid request shapes, unknown fields, and schema limits return
        one `400` error for the request. If per-item input validation fails, no items
        are created; valid items are marked as skipped in the per-item results.

        **Quota:** Only items that create a new protected resource use the
        protected-resource allowance. Items that reuse a resource do not use that
        allowance, but can still fail for other reasons.

        **Retries:** Match results to input items with `index`. Do not recreate successful
        items. Retry failed items with `service_unavailable`, and failed items with
        `creation_failed` whose `message` is `failed to create qURL`.
        Do not retry an item whose `message` says
        `the outcome is unknown` without a check: its qURL may exist. A `quota_exceeded`
        result requires resolving the plan limit before retrying. To recover a lost batch
        response, retry the unchanged request with its original `Idempotency-Key`.
        A `500` or `503` response is not stored for replay: retry the unchanged request, and it
        runs again even with the same `Idempotency-Key`. A `207` or `400` response is
        stored: to run failed items again, send them in a new request with a new
        `Idempotency-Key`.
      operationId: batchCreateQurls
      security:
        - bearerAuth: [qurl:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
            example:
              items:
                - target_url: "https://app1.example.com"
                  expires_in: "1h"
                  access_policy:
                    ai_agent_policy:
                      allow_categories: ["claude", "perplexity"]
                - target_url: "https://app2.example.com"
                  expires_in: "24h"
                  one_time_use: true
      responses:
        '201':
          description: All qURLs created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreateResponse'
              example:
                data:
                  succeeded: 2
                  failed: 0
                  results:
                  - crid: ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a
                    index: 0
                    success: true
                    qurl_link: https://qurl.link/#at_abc123
                    qurl_site: https://r-ojpxe33vorsw63tmpeydc.qurl.site
                    expires_at: '2024-01-15T10:30:00Z'
                  - index: 1
                    success: true
                    resource_id: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEoZLdT1C_J8lCh_mpQXJMoRzKi3Q_C5TnVQFYW0Cz5L5Jo83djulhze84U_rrhnUVQQRajXmUQKn-VQ8jR-qatA
                    qurl_link: https://qurl.link/#at_def456
                    qurl_site: https://r-ojpxe33vorsw63tmpeyde.qurl.site
                    expires_at: '2024-01-09T10:30:00Z'
                meta:
                  request_id: req_abc123
        '207':
          description: |
            Some items succeeded and some failed. Match each result to its input with `index`.

            | Item error code | What to do |
            |---|---|
            | `resource_type_conflict` | Use the existing resource's CRID with `POST /v1/resources/{id}/qurls`, or choose another target URL. Revoking the existing resource also blocks its links. |
            | `privacy_mismatch` | The item states `private`, and your existing resource for its `target_url` has the other value. Privacy is fixed at creation. Omit `private` from the item to reuse that resource. |
            | `quota_exceeded` | Resolve the plan limit before retrying. |
            | `service_unavailable` | Retry only this failed item. When the resource for its `target_url` was closed during the request, the retry may create a new resource for that `target_url`. |
            | `creation_failed` | Read `message`. There are three cases. The fixed text `failed to create qURL`: the item is not wrong and nothing was created for it, so retry it unchanged. A message that says `the outcome is unknown`: the qURL may have been created, and a retry creates another one, so check your qURLs for that target before you retry. Any other message names a problem in the item: correct the item before retrying. |

            Use a new `Idempotency-Key` when retrying a changed batch of failed items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreateResponse'
              example:
                data:
                  succeeded: 1
                  failed: 2
                  results:
                  - crid: ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a
                    index: 0
                    success: true
                    qurl_link: https://qurl.link/#at_abc123
                    qurl_site: https://r-ojpxe33vorsw63tmpeydc.qurl.site
                    expires_at: '2024-01-15T10:30:00Z'
                  - index: 1
                    success: false
                    error:
                      code: resource_type_conflict
                      message: existing resource for this target_url has a different type
                  - index: 2
                    success: false
                    error:
                      code: service_unavailable
                      message: Temporary failure; retry this item
                meta:
                  request_id: req_abc123
        '400':
          description: |
            Every item failed, or request validation rejected the batch.
            A batch that failed as a whole on our side answers `500` or
            `503` instead, with no per-item results. Per-item `code` field
            on each failed item carries the same vocabulary as the 207
            response (`resource_type_conflict`, `privacy_mismatch`,
            `creation_failed`, `quota_exceeded`, or `service_unavailable`).
            SDK consumers should branch on per-item codes rather than
            the outer HTTP status. In particular, a batch in which every
            item was refused by a plan limit answers 400 with
            `quota_exceeded` on each item — not 403, because only this
            response shape carries the per-item results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        # MAINTAINERS: this request-level 403 is reachable ONCE
        # QURL_DATA_TRANSFER_ENFORCEMENT_ENABLED is on, via the monthly
        # data-transfer cap — checked in quotaForEnforcement BEFORE the
        # per-item loop, so its refusal is a whole-request 403 by construction
        # (TestBatchCreateQurls_DataTransferCap_Returns403 sets the flag). The
        # flag ships FALSE, so during the dark period the arm is genuinely dead
        # in production; that is expected, not evidence it can be deleted.
        # The protected-resource cap does NOT reach it: that one is evaluated
        # per item against a shared gate, so an at-cap owner gets a 207 whose
        # individual items carry quota_exceeded. Do not delete this arm on the
        # strength of the resource cap alone. Kept out of `description`
        # because that field is public customer copy (CLAUDE.md, "OpenAPI
        # audience").
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/delegated-qurl-batches:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    post:
      tags:
        - QURLs
      summary: Create qURLs from a delegated mint capability
      description: |
        Accepts one opaque delegated mint capability and a bounded set of
        independent recipient grants. The capability fixes the protected
        resource and destination path. The authenticated API key owns the new
        qURLs.

        The request is accepted as one durable asynchronous operation. Poll the
        URL in `Location` until the batch reaches a terminal state. Retrying an
        accepted request with the same `Idempotency-Key` and the same semantic
        body returns the original operation acceptance, including after the
        capability expires. Reusing the key with a different body returns 409.
        This route requires API key authentication because the capability is
        bound to the authenticated key ID.
      operationId: createDelegatedQurlBatch
      security:
        - bearerAuth: [qurl:write]
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDelegatedQurlBatchRequest'
      responses:
        '202':
          description: Batch accepted for asynchronous processing
          headers:
            Location:
              description: URL used to read the batch state
              required: true
              schema:
                type: string
                format: uri
            Retry-After:
              description: Seconds to wait before the first status request
              required: true
              schema:
                type: integer
                minimum: 1
            ETag:
              description: Strong validator for the returned batch state
              required: true
              schema:
                type: string
            Cache-Control:
              description: Cache policy for the response
              required: true
              schema:
                type: string
                enum: ['private, no-store']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDelegatedQurlBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The API key cannot redeem this capability, or the account quota refuses new qURLs
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/delegated-qurl-batches/{batch_id}:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    get:
      tags:
        - QURLs
      summary: Get a delegated qURL batch
      description: |
        Returns the current state and stable, input-ordered item results for a
        delegated qURL batch. This route requires an active API key for the same
        external binding that created the batch because a terminal result contains
        bearer share links. A
        non-terminal response includes `Retry-After`. Use `If-None-Match` to
        avoid receiving an unchanged non-terminal representation. Terminal
        responses always return `200` so exact retries can recover the result.
      operationId: getDelegatedQurlBatch
      security:
        - bearerAuth: [qurl:read]
      parameters:
        - $ref: '#/components/parameters/DelegatedQurlBatchId'
        - name: If-None-Match
          in: header
          required: false
          description: Strong ETag returned by an earlier batch response
          schema:
            type: string
            maxLength: 96
      responses:
        '200':
          description: Terminal batch state
          headers:
            ETag:
              description: Strong validator for this batch state
              required: true
              schema:
                type: string
            Cache-Control:
              description: Cache policy for the response
              required: true
              schema:
                type: string
                enum: ['private, no-store']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDelegatedQurlBatchResponse'
        '202':
          description: Non-terminal batch state
          headers:
            Retry-After:
              description: Seconds to wait before the next status request
              required: true
              schema:
                type: integer
                minimum: 1
            ETag:
              description: Strong validator for this batch state
              required: true
              schema:
                type: string
            Cache-Control:
              description: Cache policy for the response
              required: true
              schema:
                type: string
                enum: ['private, no-store']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDelegatedQurlBatchResponse'
        '304':
          description: Batch state has not changed
          headers:
            ETag:
              description: Strong validator for the unchanged batch state
              required: true
              schema:
                type: string
            Retry-After:
              description: Seconds to wait when the unchanged state is not terminal
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              description: Cache policy for the response
              required: true
              schema:
                type: string
                enum: ['private, no-store']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/delegated-qurls/{qurl_id}:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    get:
      tags:
        - QURLs
      summary: Get delegated qURL metadata
      description: |
        Returns metadata for one delegated qURL owned by the authenticated
        account. This metadata operation does not return the share link. Retrieve it from the completed batch result.
      operationId: getDelegatedQurl
      security:
        - bearerAuth: [qurl:read]
      parameters:
        - $ref: '#/components/parameters/DelegatedQurlId'
      responses:
        '200':
          description: Delegated qURL metadata
          headers:
            Cache-Control:
              description: Cache policy for the response
              required: true
              schema:
                type: string
                enum: ['private, no-store']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDelegatedQurlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - QURLs
      summary: Revoke a delegated qURL
      description: |
        Revokes one delegated qURL owned by the authenticated account and revokes its access grant. Active network access is closed before success is reported. Repeating the request is successful.
        A 503 `mutation_outcome_unknown` means the state can already be closed;
        retry this same DELETE until it returns 204.
      operationId: deleteDelegatedQurl
      security:
        - bearerAuth: [qurl:write]
      parameters:
        - $ref: '#/components/parameters/DelegatedQurlId'
      responses:
        '204':
          description: Delegated qURL revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/resources:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    get:
      tags:
        - Resources
      summary: List resources
      description: |
        Lists your resources. Use each resource's `crid` for later requests.
        `qurl_count` includes retained revoked and expired qURLs; it is not an active-link
        count. An omitted count is unknown. Get a resource for a preview of its links,
        or use `GET /v1/resources/{id}/qurls` for the full paginated list.

        | Filter | Result and restrictions |
        |---|---|
        | `alias` | Zero or one of your resources. Cannot combine with `slug`, `status`, or `type`. |
        | `slug` | Zero or one of your active qURL Connectors. Cannot combine with `alias`, `status`, or `type`. |
        | `type=url` | Resources that protect target URLs. |
        | `type=tunnel` | qURL Connector resources. |

        Alias and slug lookups ignore `cursor` and `limit`. Invalid or reserved aliases
        return `400 alias_invalid_format` or `400 alias_reserved`.
        Connector-owned uploads (`type=transit`) are not listed; use connector installation
        operations for their reports. Restricted `key_type=tunnel_bootstrap` credentials
        cannot list resources; use their bound `POST /v1/resources` find-or-create operation.

        Keep `type` and `status` unchanged while paging. Changing them with an existing
        cursor returns `400 invalid_request`; restart from the first page instead.
      operationId: listResources
      security:
        - bearerAuth: [qurl:read]
      parameters:
        - name: cursor
          in: query
          description: Pagination cursor from a previous response
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of items to return (1-100, default 20)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: alias
          in: query
          description: |
            Filter to a single resource by owner-scoped alias. Same format
            as `CreateResourceRequest.alias` — 3–64 chars, must start with
            a lowercase letter, end alphanumeric, hyphens allowed inside.
            Tenant-isolated: only resources owned by the authenticated
            caller are visible, so the same alias string can resolve for
            two different callers without collision. Mutually exclusive with
            `slug`, `status`, and `type`; when supplied, `cursor` / `limit`
            are ignored.
          schema:
            type: string
            minLength: 3
            maxLength: 64
            pattern: '^[a-z][a-z0-9-]{1,62}[a-z0-9]$'
        - name: slug
          in: query
          description: |
            Filter to a single active qURL Connector resource by owner-scoped
            immutable slug. Same format as `CreateResourceRequest.slug` — 3–64 chars,
            must start with a lowercase letter, end alphanumeric, hyphens
            allowed inside. Tenant-isolated: only resources owned by the
            authenticated caller are visible. Mutually exclusive with `alias`,
            `status`, and `type`; when supplied, `cursor` / `limit` are
            ignored.
          schema:
            type: string
            minLength: 3
            maxLength: 64
            pattern: '^[a-z][a-z0-9-]{1,62}[a-z0-9]$'
        - name: status
          in: query
          description: |
            Filter by resource status. Use `active`, `revoked`, or a
            comma-separated combination without spaces. Invalid values return
            `400`; check `error.code` for the validation failure.
          schema:
            type: string
            pattern: '^(active|revoked)(,(active|revoked))*$'
            example: active,revoked
        - name: type
          in: query
          description: |
            Filter resource list rows by dashboard resource type. Supported
            values are `url` and `tunnel`. Connector-owned resources are
            intentionally surfaced through `/v1/connectors/installations`
            instead of this resource list.
          schema:
            type: string
            enum: [url, tunnel]
      responses:
        '200':
          description: Resource list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Resources
      summary: "Create a resource"
      description: |
        Registers a resource before you create links for it. Save the returned `crid`.
        For a URL resource, a repeated request with the same URL and account returns the
        existing resource with `201`. A different resource type returns
        `409 resource_type_conflict`.

        For an existing URL resource, omit `alias` or send its current alias. A different
        alias, including a new alias when none is set, returns `409 resource_alias_mismatch`.
        Use `PATCH /v1/resources/{id}` with the CRID to change an existing alias.
        An alias used by another of your resources returns `409 alias_in_use`.

        A new URL or qURL Connector resource is private unless the request sends
        `private: false`. Resource privacy cannot change after creation. A request that
        returns an existing resource keeps the privacy that resource has. If it states
        `private` with a different value, it returns `400 privacy_mismatch`: omit
        `private` to reuse the resource.

        A request that returns an existing resource does not change its allowed devices
        either. If it states `allowed_device_keys` with other keys than the resource
        lists, it returns `400 device_keys_mismatch` and changes nothing: omit the
        field to reuse the resource, and change the list with `PATCH /v1/resources/{id}`
        (`allowed_device_keys_add`, `allowed_device_keys_remove`). When both differ,
        the answer is `privacy_mismatch`.

        For qURL Connectors, use `slug` and `find_or_create`; see the request fields.
        `403 connector_disabled` means Connector operations are unavailable.
        Use `error.code` to distinguish it from an authorization failure.
      operationId: createResource
      security:
        - bearerAuth: [qurl:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
      responses:
        '201':
          description: Resource created
          headers:
            Location:
              description: |
                API URL of the registered resource. Use the returned CRID for later resource
                requests. This URL is not an access link.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CreateResourceForbidden'
        '409':
          description: |
            Use `error.code` to choose the next action:

            | Code | Next action |
            |---|---|
            | `slug_in_use` | Choose another slug, or set `find_or_create: true` to reuse an active Connector. If that request still conflicts, retry once, then inspect the existing Connector. Revoking it blocks its links. |
            | `alias_in_use` | Choose another alias, or clear the alias on the resource that currently uses it. |
            | `resource_alias_mismatch` | Use PATCH to change the existing resource's alias. A create request does not rename it. |
            | `resource_type_conflict` | Reuse the existing resource with its current type, or revoke it before creating a replacement. Revocation blocks its links. |
            | `bootstrap_key_consumed` | Obtain a new enrollment credential and check the resource with an account credential. The previous action can have partly succeeded. |
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: |
            Returned by the qURL Connector `find_or_create` flow when the
            supplied `slug` resolves to a tombstoned resource. The body
            carries the standard problem-details envelope plus
            `meta.tombstone` when the tombstone metadata can be loaded.
            Delete the tombstoned resource or choose a fresh slug before
            retrying.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/connectors/installations:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    get:
      tags:

          description: Resource public key, retained for compatibility. Prefer crid for later requests.
        crid:
          type: string
          minLength: 47
          maxLength: 60
          pattern: '^([a-z2-7]{47}|[a-z2-7]{60})$'
          description: |
            Required permanent, location-independent identifier for this
            Connector resource. Stable for the life of the resource.
            A CRID-addressed request returns that CRID; a resource-key request
            returns the canonical CRID.
          example: "ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a"

  /v1/api-keys:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    post:
      tags:
        - API Keys
      summary: "Create an API key or enrollment token"
      description: |
        Creates an account API key or a one-use enrollment token. Save the returned secret;
        GET and list operations do not return it. See `kind` for enrollment and recovery rules.

        | Kind | Supply | Purpose |
        |---|---|---|
        | `api_key` | `name`, explicit `scopes` | Account API access. |
        | `enrollment_token` | `name`, optional `target`, `claims`, `expires_in`; omit `scopes` | Enroll one agent or Connector. |
        | `device` | Not accepted here | Created during enrollment. |

        **Permissions**

        | Action | Required credential and scopes |
        |---|---|
        | Create an enrollment token | JWT or account API key with `qurl:agent`. |
        | Create an account key | JWT with `qurl:write`. To grant `qurl:agent` or `qurl:keys`, the JWT must also hold that scope. |
        | Create a child account key | Account API key with `qurl:keys` and either `qurl:write` or `qurl:agent`; an unlimited plan is required. |

        Child-key scopes must be a subset of the parent's and cannot include `qurl:keys`.
        Child keys expire within 24 hours and no later than their parent. Parent revocation
        does not revoke children or enrolled devices; revoke them separately. Automation
        callers can list, get, and revoke same-owner keys, but cannot update them.

        Enrollment tokens cannot create credentials. A device credential can create only
        a Connector enrollment token within its permitted binding.

        **Retries:** Supply `Idempotency-Key`. For 24 hours, the same key and body recover
        the original response, including its secret. A different body returns `409`.
        Clients must tolerate future credential `kind` values.
      operationId: createApiKey
      security:
        - bearerAuth: [qurl:write]
        - bearerAuth: [qurl:agent]
      parameters:
        - $ref: '#/components/parameters/APIKeyMintIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
            examples:
              apiKey:
                summary: Durable API key (caller-chosen scopes)
                value:
                  kind: "api_key"
                  name: "Production integration"
                  scopes: ["qurl:read", "qurl:write"]
              connectorEnrollmentToken:
                summary: One-shot connector enrollment token bound to one connector id
                value:
                  kind: "enrollment_token"
                  name: "prod-dashboard connector enrollment"
                  target: "connector"
                  claims: [{type: "connector", id: "prod-dashboard"}]
                  expires_in: "2h"
              agentEnrollmentToken:
                summary: One-shot agent enrollment token (unbound)
                value:
                  kind: "enrollment_token"
                  name: "headless agent enrollment"
                  target: "agent"
      responses:
        '201':
          description: Credential created successfully.
          headers:
            Location:
              description: URL of the created API key resource
              schema:
                type: string
                format: uri
                example: "https://api.layerv.ai/v1/api-keys/key_abc123def456"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
              example:
                data:
                  key_id: "key_abc123def456"
                  api_key: "lv_live_a3x9Kp2mN8qR5sT7wY0zBcDfGhJkLmNp"
                  key_prefix: "lv_live_a3x9"
                  kind: "api_key"
                  name: "Production integration"
                  scopes: ["qurl:read", "qurl:write"]
                  status: "active"
                  created_at: "2024-01-08T10:30:00Z"
                meta:
                  request_id: "req_abc123"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Forbidden. Either:
            - `kind=enrollment_token` was requested without `qurl:agent`, or with a one-shot credential, or
            - API key auth without `qurl:keys` was used for `kind=api_key`, or
            - Child scopes exceed the parent or include `qurl:keys` (`scope_delegation_denied`), or
            - A JWT without `qurl:write` requested `kind=api_key`, or
            - A JWT requested a durable key whose `scopes` include
              `qurl:agent` but the JWT does not hold `qurl:agent`. Error code:
              `scope_delegation_denied`, or
            - The authenticated JWT email is not verified. Error code: `email_verification_required`, or
            - The account is frozen. Error code: `account_frozen`, or
            - Plan key limit reached (free: 3, growth: 50). Error code: `api_key_limit`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                emailVerificationRequired:
                  summary: Verify the account email before creating a key
                  value:
                    error:
                      type: "https://api.qurl.link/problems/email_verification_required"
                      title: "Email Verification Required"
                      status: 403
                      detail: "Verify your account email before creating an API key."
                      instance: "/v1/api-keys"
                      code: "email_verification_required"
                    meta:
                      request_id: "req_abc123"
                accountFrozen:
                  summary: The account is frozen
                  value:
                    error:
                      type: "https://api.qurl.link/problems/account_frozen"
                      title: "Account Frozen"
                      status: 403
                      detail: "Account is frozen"
                      instance: "/v1/api-keys"
                      code: "account_frozen"
                    meta:
                      request_id: "req_abc123"
        '409':
          description: |
            The supplied `Idempotency-Key` was previously used with a
            different request body. Send the original body or use a
            fresh key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: |
            A transient failure prevented safe idempotency recovery or account
            identity verification. Retry after the supplied delay; when an
            `Idempotency-Key` was supplied, reuse the same key and request body.
          headers:
            Retry-After:
              description: Advisory delay before retrying (seconds).
              schema:
                type: integer
                example: 5
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags:
        - API Keys
      summary: List API keys
      description: |
        Lists credentials owned by the authenticated user — durable API
        keys (`kind=api_key`), one-shot enrollment tokens
        (`kind=enrollment_token`, with `target` and any bound `claims`),
        and system-minted device credentials (`kind=device`). Unknown
        future `kind` values may appear; clients must tolerate them.
        The plaintext secret is never returned in list responses.
        Requires JWT authentication or an ordinary account API key with `qurl:keys`
        and the route scope. Only the authenticated owner's keys are accessible.
        Results are ordered by key creation time, newest first, including
        `status=revoked`; older retained revoked keys can require additional
        pages or direct lookup by `key_id`.
      operationId: listApiKeys
      security:
        - bearerAuth: [qurl:read]
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return (1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Pagination cursor from previous response
          schema:
            type: string
        - name: status
          in: query
          description: Filter by key status. Defaults to "active" to exclude revoked keys.
          schema:
            type: string
            enum: [active, revoked, all]
            default: active
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
              example:
                data:
                  - key_id: "key_abc123def456"
                    key_prefix: "lv_live_a3x9"
                    kind: "api_key"
                    name: "Production integration"
                    scopes: ["qurl:read", "qurl:write"]
                    status: "active"
                    created_at: "2024-01-08T10:30:00Z"
                    last_used_at: "2024-01-10T14:22:00Z"
                  - key_id: "key_def456abc123"
                    key_prefix: "lv_live_b7k2"
                    kind: "enrollment_token"
                    target: "connector"
                    claims: [{type: "connector", id: "prod-dashboard"}]
                    name: "prod-dashboard connector enrollment"
                    scopes: ["qurl:agent", "qurl:write"]
                    status: "active"
                    created_at: "2024-01-08T10:30:00Z"
                    expires_at: "2024-01-09T10:30:00Z"
                meta:
                  request_id: "req_abc123"
                  page_size: 2
                  has_more: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/api-keys/{key_id}:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    get:
      tags:
        - API Keys
      summary: "Get a credential"
      description: |
        Returns a credential owned by your account, including retained revoked credentials.
        The plaintext secret is never returned. Unknown keys and another account's keys return `404`.
        Requires JWT authentication, or an ordinary account API key with `qurl:keys`
        and the operation's scope.

        Check both `status` and `expires_at` before treating a key as usable.
        Unlike the list operation, this lookup does not filter expired active keys.
        A recent change can take time to appear. Retry if you are confirming a recent revocation.
      operationId: getApiKey
      security:
        - bearerAuth: [qurl:read]
      parameters:
        - name: key_id
          in: path
          required: true
          description: |
            API key identifier. An ID that does not match this pattern is rejected
            up front by request validation with 400 (validation_error); a
            well-formed but unknown ID returns 404.
          schema:
            type: string
            pattern: '^key_[A-Za-z0-9]{12}$'
      responses:
        '200':
          description: API key found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
              example:
                data:
                  key_id: "key_abc123def456"
                  key_prefix: "lv_live_a3x9"
                  kind: "api_key"
                  name: "Production integration"
                  scopes: ["qurl:read", "qurl:write"]
                  status: "revoked"
                  created_at: "2024-01-08T10:30:00Z"
                meta:
                  request_id: "req_abc123"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - API Keys
      summary: Update an API key
      description: |
        Updates the name or scopes of an existing credential.
        Requires JWT authentication (API keys cannot update API keys).
        The caller must hold `qurl:agent` when the replacement `scopes`
        add `qurl:agent` to a key that does not already hold it. Resending a
        full scope set that preserves an existing `qurl:agent`, or removing
        or narrowing scopes, requires no additional permission beyond
        `qurl:write`. `scopes` are updatable
        only on `kind=api_key` credentials: an enrollment token's scopes
        are server-assigned (400 `invalid_input`), and device credentials
        cannot be edited at all (400 `invalid_input`). The scope-delegation
        403 is evaluated before kind editability, so an under-scoped attempt
        to add `qurl:agent` to a device credential returns 403 rather than
        the 400 an authorized caller would see. A credential's
        `kind` can never change.
        If neither name nor scopes are provided, the existing key is returned unchanged (no-op).
        Any replacement scope set that includes `qurl:keys` requires the JWT to hold
        `qurl:keys`, even if the key already has it.
      operationId: updateApiKey
      security:
        - bearerAuth: [qurl:write]
      parameters:
        - name: key_id
          in: path
          required: true
          description: |
            API key identifier. An ID that does not match this pattern is rejected
            up front by request validation with 400 (validation_error); a
            well-formed but unknown ID returns 404.
          schema:
            type: string
            pattern: '^key_[A-Za-z0-9]{12}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiKeyRequest'
            example:
              name: "Updated key name"
              scopes: ["qurl:read"]
      responses:
        '200':
          description: API key updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
              example:
                data:
                  key_id: "key_abc123def456"
                  key_prefix: "lv_live_a3x9"
                  kind: "api_key"
                  name: "Updated key name"
                  scopes: ["qurl:read"]
                  status: "active"
                  created_at: "2024-01-08T10:30:00Z"
                  last_used_at: "2024-01-10T14:22:00Z"
                meta:
                  request_id: "req_abc123"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Forbidden. Either:
            - API key authentication was used (JWT required), or
            - The replacement scope set adds `qurl:agent` but the JWT does not
              hold `qurl:agent`. Error code: `scope_delegation_denied`, or
            - The account is frozen. Error code: `account_frozen`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: |
            The account identity could not be verified before the update. No
            API-key mutation was committed; retry after the supplied delay.
          headers:
            Retry-After:
              description: Advisory delay before retrying (seconds).
              schema:
                type: integer
                example: 5
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags:
        - API Keys
      summary: "Revoke a credential"
      description: |
        Revokes a credential owned by your account. Revoked records are retained for 30 days.
        Requires JWT authentication, or an ordinary account API key with `qurl:keys`
        and the operation's scope. Revoking a parent key does not revoke child keys or
        device credentials; revoke those separately.
      operationId: revokeApiKey
      security:
        - bearerAuth: [qurl:write]
      parameters:
        - name: key_id
          in: path
          required: true
          description: |
            API key identifier. An ID that does not match this pattern is rejected
            up front by request validation with 400 (validation_error); a
            well-formed but unknown ID returns 404.
          schema:
            type: string
            pattern: '^key_[A-Za-z0-9]{12}$'
      responses:
        '204':
          description: API key revoked successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/external-identity-bindings:
    post:
      tags:
        - Bindings
      summary: Create or rotate an external identity binding
      description: |
        Links an external identity to your account and returns its API key.
        Requires a JWT issued to the trusted OAuth client for the provider.
        Missing, conflicting, or untrusted `azp` or `client_id` claims return `403`.
        Discord, Slack, and Teams each require their own configured trusted client.
        An unconfigured provider returns `403`.

        The binding and key are created together or not at all. The key counts toward
        your account's API-key limit. Each provider identity can belong to one account;
        another account's binding returns `409`. Its owner must release it first.

        **Rotation:** Set `rotate_existing: true` only for an explicit install or
        reauthorization. This revokes the old key and returns a new key with the same
        `binding_id`, without using another key slot. Do not rotate during routine startup.
        Run one install or reauthorization at a time per identity: concurrent rotations
        with different idempotency keys can revoke each other's new keys. A `503` can
        mean another rotation succeeded; retrying can replace that rotation's key.

        **Scopes:** Slack and Teams keys receive `qurl:read`, `qurl:write`, and `qurl:agent`;
        for those providers the JWT must also hold `qurl:agent`.
        Discord keys receive `qurl:read` and `qurl:write`.
        Do not send `scopes`; the provider determines them.

        **Retries:** `Idempotency-Key` is required. Recover a lost response within 24 hours
        with the same key and body. A different body returns `409 idempotency_conflict`.
        On `503 service_unavailable`, wait for `Retry-After` and retry the same request.
        On `503 bindings_disabled`, use your fallback flow; retries will not enable the operation.
        See the `409` response for recovery after the replay window or concurrent rotation.
      operationId: createExternalIdentityBinding
      security:
        - bearerAuth: [qurl:write]
      parameters:
        - $ref: '#/components/parameters/BindingCreateIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExternalIdentityBindingRequest'
            example:
              provider: "discord"
              external_id: "123456789012345678"
              display_name: "Example Guild"
      responses:
        '201':
          description: |
            Binding and API key created or rotated atomically. Rotation revokes
            the API key that was previously issued for this binding.
          headers:
            Location:
              description: URL of the created binding resource
              schema:
                type: string
                format: uri
                example: "https://api.layerv.ai/v1/external-identity-bindings/eib_k8xqp9h2sj9"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExternalIdentityBindingResponse'
              example:
                binding_id: "eib_k8xqp9h2sj9"
                provider: "discord"
                external_id: "123456789012345678"
                display_name: "Example Guild"
                api_key:
                  key_id: "key_abc123def456"
                  key_prefix: "lv_live_a3x9"
                  plaintext: "lv_live_a3x9Bk7mQ2nP4rS8tU0vW1xY2zA3b4C5d6"
                scopes: ["qurl:read", "qurl:write"]
                created_at: "2026-05-14T12:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Forbidden. Either:
            - The authenticated JWT email is not verified. Error code: `email_verification_required`, or
            - The JWT was not issued to the configured OAuth client for the requested provider. Error code: `forbidden`, or
            - The provider-assigned scopes include `qurl:agent` but the JWT caller does not hold `qurl:agent`. Error code: `scope_delegation_denied`, or
            - The account is frozen. Error code: `account_frozen`, or
            - The authenticated owner has reached the API-key plan limit shared with `POST /v1/api-keys`. Error code: `api_key_limit`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            Either (a) the provider identity is already bound to another
            owner, (b) the authenticated owner already holds the binding and
            `rotate_existing` was omitted or false, or (c) the supplied
            `Idempotency-Key` was previously used with a different request
            body.

            The conditions surface two distinct error codes:
            `already_exists` for (a) and (b), and `idempotency_conflict` for
            (c), so clients can handle them separately.

            Retry note: a prior `201` whose response never reached
            the client should be retried within 24 hours with the SAME
            `Idempotency-Key` and the SAME body — the original
            response replays. A later explicit reauthorization with a NEW
            `Idempotency-Key` and `rotate_existing: true` may safely rotate an
            unseen prior commit and converge on one active binding generation.
            After the original replay window, its plaintext key cannot be
            retrieved. A successful DELETE ends that replay window; a later
            POST with the same key creates a new binding. If idempotency
            recovery is temporarily unavailable, the service returns
            `503 service_unavailable` with `Retry-After`; retry with
            the same key and body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            Semantic validation failed after request-shape validation.
            Malformed bodies and schema-level request errors return 400.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: |
            The endpoint is unavailable in this environment, or a
            transient failure prevented safe idempotent replay.
          headers:
            Retry-After:
              description: Advisory delay before retrying (seconds).
              schema:
                type: integer
                example: 5
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/external-identity-bindings/{binding_id}:
    delete:
      tags:
        - Bindings
      summary: Delete an external identity binding
      description: |
        Releases an external provider identity and revokes the API key minted
        for that binding in one atomic operation. Requires JWT authentication;
        API keys cannot manage bindings. Malformed or unknown binding IDs and
        bindings owned by another account all return the same 404.
      operationId: deleteExternalIdentityBinding
      security:
        - bearerAuth: [qurl:write]
      parameters:
        - name: binding_id
          in: path
          required: true
          description: Opaque external identity binding identifier.
          schema:
            type: string
      responses:
        '204':
          description: Binding released and bound API key revoked successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: The binding service is switched off, or a required backing store is temporarily unavailable.
          headers:
            Retry-After:
              description: Advisory delay before retrying (seconds).
              schema:
                type: integer
                example: 5
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/access-codes/redeem:
    post:
      tags:
        - Access Codes
      summary: Redeem an access code
      description: |
        Redeems an access code to obtain a time-limited access link to a protected resource.
        This endpoint is public and does not require authentication.

        The response contains a redirect URL. The client should redirect the user to this URL
        to complete resource access.

        Bot protection is applied: submissions with a non-empty honeypot field or elapsed time
        under 3 seconds receive a fake success response.

        A code that cannot be redeemed returns `400 invalid_request`, and `detail` says why in
        words for the person who holds the code: the code is unknown, expired, revoked or used
        up, or it is not available. "No longer available" is about the resource that the code
        leads to: it is closed, and only its owner can change that. "Not currently available"
        means that no link can be made for the code now: the same code can work at a later time.
      operationId: redeemAccessCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemAccessCodeRequest'
            example:
              code: "ac_k8xqp9h2sj9lx7r4abcdef"
              honeypot: ""
              elapsed_ms: 5200
      responses:
        '200':
          description: Access code redeemed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemAccessCodeResponse'
              example:
                data:
                  redirect_url: "https://qurl.link/#at_k8xqp9h2sj9lx7r4abcdef"
                meta:
                  request_id: "req_abc123"
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/access-codes:
    post:
      tags:
        - Access Codes
      summary: Create an access code
      description: |
        Creates a new access code for a protected resource identified by its CRID.
        The plaintext code is returned only
        once in the response - store it securely.

        Requires system-tier account. The resource must exist and be owned by the authenticated user.
      operationId: createAccessCode
      security:
        - bearerAuth: [qurl:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessCodeRequest'
            example:
              resource_id: ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a
              name: Investor Stats Q1
              max_uses: 10
      responses:
        '201':
          description: Access code created successfully
          headers:
            Location:
              description: URL of the created access code resource
              schema:
                type: string
                format: uri
                example: "https://api.layerv.ai/v1/access-codes/acd_k8xqp9h2sj9"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccessCodeResponse'
              example:
                data:
                  access_code_id: "acd_k8xqp9h2sj9"
                  code: "ac_k8xqp9h2sj9lx7r4abcdef"
                  resource_id: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA"
                  name: "Investor Stats Q1"
                  status: "active"
                  max_uses: 10
                  use_count: 0
                  created_at: "2026-03-14T12:00:00Z"
                meta:
                  request_id: "req_abc123"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Access Codes
      summary: List access codes
      description: |
        Lists access codes owned by the authenticated user, sorted by creation date (newest first).
        Requires system-tier account.
      operationId: listAccessCodes
      security:
        - bearerAuth: [qurl:read]
      responses:
        '200':
          description: List of access codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCodeListResponse'
              example:
                data:
                  - access_code_id: "acd_k8xqp9h2sj9"
                    resource_id: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA"
                    name: "Investor Stats Q1"
                    status: "active"
                    max_uses: 10
                    use_count: 3
                    created_at: "2026-03-14T12:00:00Z"
                meta:
                  request_id: "req_abc123"
                  page_size: 1
                  has_more: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/access-codes/{id}:
    delete:
      tags:
        - Access Codes
      summary: Revoke an access code
      description: |
        Revokes an access code, preventing further redemptions.
        Requires system-tier account. The code must be owned by the authenticated user.
      operationId: revokeAccessCode
      security:
        - bearerAuth: [qurl:write]
      parameters:
        - name: id
          in: path
          required: true
          description: "Access code ID (format: acd_ + 11 chars)"
          schema:
            type: string
            pattern: '^acd_[a-z0-9_-]{11}$'
      responses:
        '204':
          description: Access code revoked successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: |
        Send an Auth0 access token or an API key as `Authorization: Bearer <credential>`.
        API keys are accepted only where the operation permits them. JWT-only operations
        require an Auth0 access token. Tokens are not accepted in query parameters or bodies.
        For interactive OAuth authentication, use Authorization Code flow with PKCE.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.layerv.ai/authorize
          tokenUrl: https://auth.layerv.ai/oauth/token
          scopes:
            qurl:read: Read access to qURLs and quota
            qurl:write: Create, update, and delete qURLs
            qurl:resolve: Redeem access tokens without a browser and share resources by CRID
            qurl:agent: Manage agent and qURL Connector enrollment and assignments
  parameters:
    AccountResourceOwner:
      name: X-QURL-Owner
      in: header
      required: false
      description: Select a linked device owner with an account JWT. Both membership directions must match. API keys cannot select another owner.
      schema:
        type: string
        maxLength: 256
    AccessRequestCode:
      name: request_code
      in: path
      required: true
      description: The 6-digit code of the pending access request, which the requester gave you. No response of this API returns it.
      schema:
        type: string
        maxLength: 32
    AccessRequestDeviceId:
      name: device_id
      in: path
      required: true
      description: The `device_id` of the pending access request, from the list of pending requests. The request's 6-digit code is accepted in its place.
      schema:
        type: string
        maxLength: 32
    ResourceId:
      name: id
      in: path
      required: true
      description: |
        The resource's CRID, from the `crid` response field. Use it as `id` in the path.
        For older resources without a CRID, the `resource_id` public key is also accepted.
      # YAML anchor is the single source for the public-identifier string
      # shape (public key + CRID union). Response/request properties merge it
      # below without making oapi-codegen introduce a distinct Go string type
      # at every existing call site.
      schema: &publicResourceIDSchema
        type: string
        # Public-key arms: DER length 80..160 bytes encodes to 107..214
        # base64url chars; the 0/2/3 suffix alternatives reject invalid
        # unpadded length mod 4 = 1. CRID arms: the two registered lengths
        # (47 truncated-reserved / 60 full), lowercase base32 — deliberately
        # a coarse shape gate only. Checksum/version enforcement is
        # server-side so a mistyped CRID 404s like any unknown resource
        # instead of earning a distinguishable 400 (enumeration hygiene).
        # The shapes are provably disjoint: both CRID lengths sit below the
        # public-key window, so no identifier matches two arms.
        pattern: '^(([A-Za-z0-9_-]{4}){27,53}|([A-Za-z0-9_-]{4}){27,53}[A-Za-z0-9_-]{2}|([A-Za-z0-9_-]{4}){26,52}[A-Za-z0-9_-]{3}|[a-z2-7]{47}|[a-z2-7]{60})$'
        # Bounds follow the union: 47 (shortest CRID shape) .. 214 (longest
        # public-key shape).
        minLength: 47
        maxLength: 214
        example: "ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a"

    QurlId:
      name: id
      in: path
      required: true
      description: |
        Use the resource's CRID. The `resource_id` public key is also accepted for compatibility.
        Where the operation accepts a qURL ID (`q_`), it returns or acts on the parent resource;
        read the operation description before changing or revoking it.

        Malformed identifiers return `400 validation_error`. Unknown identifiers and
        resources owned by another account return `404`. An access token (`at_`) is not
        valid here; use `POST /v1/resolve` to redeem it.
      schema:
        type: string
        # DER length 80..160 bytes encodes to 107..214 base64url chars;
        # the 0/2/3 suffix alternatives reject invalid unpadded length mod 4 = 1,
        # [a-z2-7]{47}|[a-z2-7]{60} are the CRID shapes (coarse gate — see the
        # &publicResourceIDSchema comment), and q_[0-9a-f]{11} is the separate
        # display-ID alternative. Keep the public-key and CRID arms
        # synchronized with &publicResourceIDSchema above; this union cannot
        # merge that mapping without changing the generated path parameter
        # from its existing string type, and it cannot carry the anchor's
        # minLength (the q_ arm is 13 chars).
        pattern: '^((([A-Za-z0-9_-]{4}){27,53}|([A-Za-z0-9_-]{4}){27,53}[A-Za-z0-9_-]{2}|([A-Za-z0-9_-]{4}){26,52}[A-Za-z0-9_-]{3})|[a-z2-7]{47}|[a-z2-7]{60}|q_[0-9a-f]{11})$'
        example: "ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a"

    WebhookId:
      name: id
      in: path
      required: true
      description: |
        Webhook ID. An ID that does not match this pattern is rejected up front by
        request validation with 400 (validation_error); a well-formed but unknown
        ID returns 404.
      schema:
        type: string
        pattern: '^wh_[A-Za-z0-9_-]{16}$'
        example: "wh_abc123def456ghij"

    DomainName:
      name: domain
      in: path
      required: true
      schema:
        type: string
      description: Custom domain name

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional retry key. First check the operation's retry rules: resource sharing
        does not guarantee replay. For operations with replay support, send the same key,
        method, path, and body to recover the response within the standard 24-hour
        replay window. Replayed responses include `X-Idempotency-Replayed: true`.
        Maximum: 256 characters. Use a new key for a new operation; changing the body
        with an existing key can still return the old response.
      schema:
        type: string
        maxLength: 256
        example: "req_abc123_create_dashboard"

    BillingCheckoutIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Caller-generated key for one checkout attempt. Reuse it when retrying the same attempt.
      schema:
        type: string
        minLength: 32
        maxLength: 256
        example: "0192f7c4-3b8a-7e2f-9d01-4cf8a1b6e3d2"


    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Caller-supplied opaque key. A retry with the same semantic request body
        returns the original operation acceptance. Reusing the key with a
        different body returns 409.
      schema:
        type: string
        minLength: 32
        maxLength: 256
        pattern: '^[!-~]+$'
        example: "0192f7c4-3b8a-7e2f-9d01-4cf8a1b6e3d2"

    DelegatedQurlBatchId:
      name: batch_id
      in: path
      required: true
      description: Delegated qURL batch identifier
      schema:
        type: string
        pattern: '^dqb_[A-Za-z0-9_-]{22}$'
        example: "dqb_AAECAwQFBgcICQoLDA0ODw"

    DelegatedQurlId:
      name: qurl_id
      in: path
      required: true
      description: qURL display identifier returned by a delegated batch
      schema:
        type: string
        pattern: '^q_[0-9a-f]{11}$'
        example: "q_0123456789a"

    APIKeyMintIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional key for retrying credential creation. Use a UUID, 32–256 characters.
        For 24 hours, identical retries with the same key and body return the original
        response, including the secret. A different body returns `409 idempotency_conflict`.
        After the replay window, the same key can create a new credential.
        On a temporary failure, wait for `Retry-After` when present, then retry with the same key and body.
      schema:
        type: string
        minLength: 32
        maxLength: 256
        example: "0192f7c4-3b8a-7e2f-9d01-4cf8a1b6e3d2"

    BindingCreateIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required key for retrying binding creation or rotation. Use a UUID, 32–256 characters.
        For 24 hours, identical retries with the same key and body return the original
        response, including the secret. A different body returns `409 idempotency_conflict`.
        A successful DELETE ends that replay window. See the `409` and `503` responses
        for recovery after a lost response or a concurrent rotation.
      schema:
        type: string
        minLength: 32
        maxLength: 256
        example: "0192f7c4-3b8a-7e2f-9d01-4cf8a1b6e3d2"

  schemas:
    DeviceRecoveryTokenResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [recovery_token_id, expires_at]
          properties:
            recovery_token_id:
              type: string
              description: Identifier of the recovery authorization, not the recovery secret.
            expires_at:
              type: string
              format: date-time
              description: Deadline for starting recovery with the retained secret.

    CreateQurlRequest:
      type: object
      # Every property here is optional with a plan default, so an unknown
      # field is indistinguishable from an omitted one: the mint succeeds and
      # returns 201 with defaults the caller did not ask for. Failing closed
      # is the only way the caller learns. This also gates POST
      # /v1/qurls/batch, which uses this schema as its item type.
      additionalProperties: false
      properties:
        # `type` is a plain `type: string` (no inline enum, no $ref to
        # ResourceType) so the OpenAPI middleware doesn't reject unknown
        # values before reaching the handler. The handler runs the
        # narrower runtime check and rejects without echoing the offered
        # value (PublicResourceTypeAllowedSuffix — `must be "url"`).
        # Pushing the rejection to middleware-level enum validation
        # would leak the full ResourceType set through the middleware's
        # default error shape — see TestResourceTypeEnumParity for the
        # tripwire.
        #
        # "Accepted on input" and "named in the rejection message" are
        # deliberately decoupled: this surface accepts more values than
        # the message advertises. The message is the customer-facing
        # contract; the accepted-input set widens for internal use
        # (connectors mint transit qURLs here) without re-publishing
        # that nomenclature.
        type:
          type: string
          default: url
          description: Type of resource the qURL grants access to. Defaults to `url`; other values are restricted to specific integrations. See `ResourceType`.
          example: "url"
        # No `default:` keyword on purpose, here and on
        # CreateResourceRequest.private. The request validator writes a
        # schema default into a body that omits the member, so the handler
        # could no longer tell "omitted" from "stated", and a request that
        # reuses a public resource without stating `private` would be
        # refused. The default is applied by the service, for a new
        # resource only. TestOpenAPISpec_RequestPrivacyHasNoSchemaDefault
        # holds this.
        private:
          type: boolean
          description: |
            Privacy of the resource, used only when this request creates it. When omitted,
            a new resource is private. Send `false` to create a public resource.
            Privacy cannot change after creation.

            When the request reuses your existing resource for the same `target_url`, omit
            this field: the resource keeps the privacy it has. A value that differs from
            the existing resource returns `400 privacy_mismatch`.
        target_url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            The URL to protect with qURL (max 2048 characters). Required for
            standard reverse-proxy qURLs.
          example: "https://dashboard.example.com"
        expires_in:
          type: string
          description: |
            How long the new link remains valid. Examples: `5m`, `1h`, `7d`, `1w`.
            Minimum: 1 minute. Maximum: 30 days on all plans.
            The resource's expiration can shorten the link's lifetime; read `expires_at` in the response.

            When omitted or empty, qURL Connector links use 5 minutes. URL and integration-owned
            upload links use the service default. Set this field explicitly for a predictable lifetime.
          example: "1h"
        one_time_use:
          type: boolean
          description: |
            Whether the link is consumed by its first successful use.
            Explicit `true` or `false` takes precedence over the resource defaults.

            When omitted, URL and integration-owned upload links use `false`.
            qURL Connector links use `true` unless `max_sessions` is greater than 1.
            For a reusable Connector link, explicitly send `one_time_use: false`, including
            when `max_sessions` is `0` (unlimited).
        max_sessions:
          type: integer
          minimum: 0
          maximum: 1000
          description: |
            Maximum concurrent sessions for this qURL, not the whole resource.
            Use `0` for no limit or `1`–`1000` for a limit. Set `one_time_use: false`
            explicitly when you need multiple visitors: some resource types otherwise
            create a single-visitor link even when `max_sessions` is `0`.
            Visitors that share a source IP count as one session and share its IP policy checks.
        session_duration:
          type: string
          description: |
            How long a session permits new requests after the recipient first reaches the content.
            This is separate from `expires_in`, which controls the link's expiration.

            **Default and limits:** Supports seconds (`30s`), minutes (`5m`), hours (`1h`),
            and days (`1d`). Minimum: 1 second. Maximum: 24 hours. If omitted, uses the
            resource cap when set. Without a cap, qURL Connectors use 1 hour; other resource
            types use the service default. Set this field explicitly when timing matters.

            **Resource cap:** On the first create for a target URL, an explicit value also
            sets the resource's fixed `session_duration_cap`. Later creates, mints, and updates
            cannot exceed it (`400 invalid_session_duration`). See `ResourceData.session_duration_cap`
            for how to create a resource with a different cap.

            **Timing precision:** For signed browser qURLs with a configured duration, the first
            content request must be authorized within 10 seconds of the start of admission,
            including time spent completing admission.
            The session timer then runs for `session_duration` from that
            first authorization. Initial network admission lasts `session_duration + 10 seconds`;
            it does not double for long sessions. A 24-hour session gets 24 hours plus 10 seconds
            of initial network admission. Opening the original invitation again is not required
            during a live session, including after a TCP connection becomes idle.

            When duration is omitted on an uncapped URL resource, the existing default
            authorization deadline is 24 hours plus 10 seconds from admission; the
            configured-duration first-arrival rule does not apply.

            New requests are denied at session expiry. Active requests,
            streams, and WebSockets are canceled at that deadline. The network allowance does not extend
            application authorization. A single-use invitation remains consumed if the first
            content request misses the 10-second arrival deadline.

            Cancellation cannot retract data already delivered or buffered by the client.
          example: "1h"
        access_policy:
          $ref: '#/components/schemas/AccessPolicy'
        label:
          type: string
          description: Human-readable label identifying who this qURL is for
          maxLength: 500
          example: "Alice from Acme"
        custom_domain:
          type: string
          maxLength: 253
          description: |
            Optional custom domain to assign to the auto-created resource.
            The domain must be registered, active, and owned by the caller.
            Only allowed when the target URL creates a new resource — rejected
            if a resource already exists for this target URL.
          example: "app.example.com"

    QurlMintTargetPath:
      type: string
      description: |
        Destination path and optional query for a qURL Connector link. For example,
        `/view/abc?download=1` redirects to that path on the resource's `qurl.site` host.
        Omit this field to use the host's root. Only qURL Connector resources (`type=tunnel`)
        accept it. Maximum: 2048 UTF-8 bytes.

        **Access scope:** The path permits itself and descendants at a segment boundary.
        `/view/abc` permits `/view/abc/thumbnail`, but not `/view/abcd`.
        The query does not restrict access. A scoped link works only through the resource
        host; access through a custom domain is denied. The Connector must also authorize
        the path before using it to look up an object.

        **Path rules:** Start with one `/`. Use canonical, unescaped ASCII. A single trailing
        slash is allowed. Do not use `//`, percent escapes, semicolons, empty interior
        segments, `.` or `..` segments, exclamation marks, parentheses, asterisks, apostrophes,
        a scheme, host, backslash, fragment, whitespace, or control characters.
        Use opaque route keys for objects; keep user filenames in metadata.
        Clients must preserve the accepted path bytes. Percent-encoded alternatives are denied.

        **Query rules:** Use ASCII letters, digits, `._~!$&()*+,;=:@/?-`, and well-formed
        percent escapes. Percent-encode other characters. Literal apostrophes are not
        accepted. Query bytes are preserved, including semicolons and percent escapes.

        **Errors:** JSON null and non-string values return `400 validation_error`.
        Empty strings, oversized or malformed paths, and use on other resource types
        return `400 invalid_target_path`.
      example: "/view/9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"

    CreateQurlForResourceRequest:
      type: object
      description: |
        Request body for `POST /v1/resources/{id}/qurls`. The target
        resource is identified by the URL path.

        All fields are optional. An empty JSON object mints a qURL with the
        owner's plan defaults. An unrecognized field is rejected with 400
        rather than ignored — see `CreateQurlRequest`.
      additionalProperties: false
      properties:
        expires_in:
          type: string
          description: |
            How long the new link remains valid. Examples: `5m`, `1h`, `7d`, `1w`.
            Minimum: 1 minute. Maximum: 30 days on all plans.
            The resource's expiration can shorten the link's lifetime; read `expires_at` in the response.

            When omitted or empty, qURL Connector links use 5 minutes. URL and integration-owned
            upload links use the service default. Set this field explicitly for a predictable lifetime.
          example: "1h"
        one_time_use:
          type: boolean
          description: |
            Whether the link is consumed by its first successful use.
            Explicit `true` or `false` takes precedence over the resource defaults.

            When omitted, URL and integration-owned upload links use `false`.
            qURL Connector links use `true` unless `max_sessions` is greater than 1.
            For a reusable Connector link, explicitly send `one_time_use: false`, including
            when `max_sessions` is `0` (unlimited).
        max_sessions:
          type: integer
          minimum: 0
          maximum: 1000
          description: |
            Maximum concurrent sessions for this qURL, not the whole resource.
            Use `0` for no limit or `1`–`1000` for a limit. Set `one_time_use: false`
            explicitly when you need multiple visitors: some resource types otherwise
            create a single-visitor link even when `max_sessions` is `0`.
            Visitors that share a source IP count as one session and share its IP policy checks.
        session_duration:
          type: string
          description: |
            How long a session permits new requests after the recipient first reaches the content.
            Controls the session/cookie lifetime, separate from the qURL link expiration (expires_in).
            Supports: seconds (30s), minutes (5m), hours (1h), days (1d). Minimum: 1 second. Maximum: 24 hours.
            Default: inherit the resource cap when set. Otherwise qURL Connectors use
            1 hour and other resource types use the service default.

            New requests are denied at session expiry. Active requests,
            streams, and WebSockets are canceled at that deadline.
            See `CreateQurlRequest.session_duration`
            → **Timing precision** for the full semantics.
          example: "1h"
        access_policy:
          $ref: '#/components/schemas/AccessPolicy'
        label:
          type: string
          maxLength: 500
          description: Human-readable label identifying who this qURL is for.
          example: "Alice from Acme"
        target_path:
          $ref: '#/components/schemas/QurlMintTargetPath'

    # Enum-value definitions only. The read-side redaction documentation
    # for transit rows lives on `ResourceData.type` (the read-response
    # property), not here — so SDK consumers reading the write-side
    # `CreateResourceRequest.type` autocompletion (which $ref's this
    # schema) don't see read-side strip semantics that don't apply on
    # the write path.
    ResourceType:
      type: string
      enum: [url, tunnel, transit]
      x-enum-varnames: [ResourceTypeUrl, ResourceTypeTunnel, ResourceTypeTransit]
      default: url
      description: |
        The kind of protected resource:

        | Value | Resource |
        |---|---|
        | `url` | A target URL. Default. |
        | `tunnel` | A qURL Connector, available to permitted Connector clients. |
        | `transit` | Content uploaded through an integration. |

        See `ResourceData.type` for fields omitted from integration-owned upload responses.
    # `knock_resource_id` is consumed by LayerV-managed reverse-connection
    # clients to choose the public NHP resource they knock before opening their
    # control connection. Internal upstream routing URLs (`upstream_addr`,
    # `frps-*`, Cloud Map names, etc.) must stay out of public response schemas;
    # the client learns the public FRP TCP target from the NHP ACK's
    # ResourceHost entry after it knocks this logical NHP resource.
    #
    # The public docs posture is intentionally terse: no internal host examples,
    # no URL format, and cross-repo naming details stay in source comments rather
    # than generated Scalar output.
    #
    # Cross-repo contract: qurl-service returns placement-neutral
    # `qurl-tunnel-server`. NHP owns AZ placement and returns the selected
    # public FRP host:port in the ACK's ResourceHost entry under that same key.
    # Clients must not derive placement from internal routing URLs.
    #
    # This property intentionally lives on ResourceData only. Bootstrap clients
    # use GET/POST /v1/resources; qURL mint responses are shareable-link
    # surfaces and must not grow tunnel-placement metadata.
    #
    # Keep this as a bare `type: string` component (no enum, pattern, or object)
    # so oapi-codegen continues to emit a Go type alias. Call sites take string
    # pointers directly; changing this into a defined string type is a generated
    # API break even if the wire shape stays identical.
    KnockResourceID:
      type: string
      readOnly: true
      description: Internal use.

    ConnectorRoutingID:
      type: string
      readOnly: true
      minLength: 54
      maxLength: 54
      pattern: '^c-[a-z2-7]{52}$'
      description: Opaque routing label the qURL Connector must use verbatim; do not derive it client-side.

    # The additive public resource identity. Response side: `crid` on
    # ResourceData and QurlData $refs this component so the customer copy
    # lives in one place. Request side: path-parameter dual-accept lives in
    # the &publicResourceIDSchema / QurlId pattern unions above (and any
    # request property that merges the anchor, e.g.
    # CreateAccessCodeRequest.resource_id).
    #
    # The pattern is deliberately the same coarse shape gate as the parameter
    # unions (both registered lengths, lowercase base32 — no checksum, no
    # version registry): validity enforcement stays server-side so a
    # well-formed-but-invalid CRID 404s exactly like an unknown resource
    # rather than earning a distinguishable 400. 47 is the reserved
    # truncated shape; today's deployments emit 60-character CRIDs only.
    #
    # Serializers emit the stored attribute verbatim (never derive-on-read);
    # keyless legacy rows have no CRID and omit the field. Bare-string
    # component with scalar facets only, so oapi-codegen keeps emitting a Go
    # type alias — see the KnockResourceID note above.
    CRID:
      type: string
      readOnly: true
      minLength: 47
      maxLength: 60
      pattern: '^([a-z2-7]{47}|[a-z2-7]{60})$'
      description: |
        The preferred identifier for a resource. Use the `crid` value in resource paths
        and wherever a request asks for a resource identifier. It remains valid for the
        resource's lifetime, does not depend on its location, and is never reused after deletion.
        A resource can retain compatible CRID aliases when its canonical identifier is corrected.
        A resource path addressed by CRID returns that CRID. Paths addressed by resource
        public key and resource lists return the canonical CRID.
        A CRID alone grants no access. This API creates an access link for the
        resource's owner or, for a private resource, for a device the publisher allowed.
        Older resources can omit this field. Use their `resource_id` public key as a fallback.
      example: "ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a"

    ConsumerAccessPolicy:
      type: object
      additionalProperties: false
      required: [mode, version]
      properties:
        mode:
          type: string
          enum: [keys, invite_only, email_capture, review, contract]
          x-enum-varnames: [ConsumerAccessKeys, ConsumerAccessInviteOnly, ConsumerAccessEmailCapture, ConsumerAccessReview, ConsumerAccessContract]
        version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        contract_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Required only for contract mode. Names the resource-specific contract.
    ConsumerVersionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
    ConsumerInvitationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    ConsumerGrantApprovalRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      description: Review approval uses only expected_version. Key opt-in uses the literal grant_id new and a credential. Use expected_version zero for a first grant, or the current version for an explicit replacement. Contract fulfillment requires a verified entitlement and expiry from the publisher backend.
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        credential_kind:
          type: string
          enum: [passkey, device]
          x-enum-varnames: [ConsumerApprovalPasskey, ConsumerApprovalDevice]
        credential_id:
          type: string
          minLength: 1
          maxLength: 1024
        credential_public_key_b64:
          type: string
          minLength: 1
          maxLength: 1024
        entitlement_id:
          type: string
          minLength: 1
          maxLength: 128
        expires_at:
          type: string
          format: date-time
    ConsumerSessionCleanup:
      type: string
      enum: [pending, complete]
      x-enum-varnames: [ConsumerCleanupPending, ConsumerCleanupComplete]
      description: Complete is reported only when no active sessions can remain. Revoked access can still require stream cleanup.
    ConsumerInvitation:
      type: object
      required: [id, email, status, delivery, version, expires_at]
      properties:
        session_cleanup:
          $ref: '#/components/schemas/ConsumerSessionCleanup'
        id:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [open, enrolled, revoked]
          x-enum-varnames: [ConsumerInvitationOpen, ConsumerInvitationEnrolled, ConsumerInvitationRevoked]
        delivery:
          type: string
          enum: [queued, accepted, failed]
          x-enum-varnames: [ConsumerDeliveryQueued, ConsumerDeliveryAccepted, ConsumerDeliveryFailed]
        version:
          type: integer
          format: int64
        expires_at:
          type: string
          format: date-time
    ConsumerGrant:
      type: object
      required: [id, status, version]
      description: Contract mode omits credential and contact identity. Email is returned only after mailbox proof and disclosure consent.
      properties:
        session_cleanup:
          $ref: '#/components/schemas/ConsumerSessionCleanup'
        id:
          type: string
          pattern: '^[a-f0-9]{64}$'
        status:
          type: string
          enum: [pending, active, revoked]
          x-enum-varnames: [ConsumerGrantPending, ConsumerGrantActive, ConsumerGrantRevoked]
        version:
          type: integer
          format: int64
        credential_kind:
          type: string
          enum: [passkey, device]
          x-enum-varnames: [ConsumerCredentialPasskey, ConsumerCredentialDevice]
        credential_id:
          type: string
        credential_public_key_b64:
          type: string
        email:
          type: string
        email_verified_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        entitlement_id:
          type: string
    ConsumerInvitationResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ConsumerInvitation'
        meta:
          $ref: '#/components/schemas/Meta'
    ConsumerInvitationListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConsumerInvitation'
        meta:
          $ref: '#/components/schemas/ListMeta'
    ConsumerGrantResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ConsumerGrant'
        meta:
          $ref: '#/components/schemas/Meta'
    ConsumerGrantListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConsumerGrant'
        meta:
          $ref: '#/components/schemas/ListMeta'

    CreateResourceRequest:
      type: object
      description: |
        Registers a resource. URL resources are matched by your account and `target_url`.
        If one already exists with the same type, the response returns it with `201`.

        | Existing URL resource | Requested alias | Result |
        |---|---|---|
        | None | Omitted or available | Create the resource. |
        | Present | Omitted or unchanged | Return it unchanged. |
        | Present | Different, including adding an alias | `409 resource_alias_mismatch`; use PATCH to change the alias. |

        An alias used by another of your resources returns `409 alias_in_use`.
        The same URL registered with a different type returns `409 resource_type_conflict`.
        For example, `url` cannot reuse a `transit` resource, or vice versa.
        Use the existing resource with its current type, or revoke it and create a new one.
        Revoking the resource also blocks its existing links.

        qURL Connectors (`type=tunnel`) are matched by `slug` when `find_or_create` is true.
        They do not reuse resources by target URL. See those fields for retry behavior.
      additionalProperties: false
      properties:
        consumer_access:
          $ref: '#/components/schemas/ConsumerAccessPolicy'
        # No `default:` keyword on purpose: see CreateQurlRequest.private.
        private:
          type: boolean
          description: |
            When true, only the owner and the devices listed in `allowed_device_keys` can
            create links for this resource. A resource that is not private is public.

            When omitted, a new URL or qURL Connector resource is private. Send `false` to
            create a public one. Privacy cannot change after creation.

            When the request returns an existing resource, omit this field: the resource
            keeps the privacy it has. A value that differs from the existing resource
            returns `400 privacy_mismatch`.
        # No `default:` keyword, as for `private`: the request validator would
        # write it into the body.
        access_requests:
          type: boolean
          description: |
            When true, someone who opens this private resource's link without access can
            ask you for it. You approve or deny each request. When omitted, a new resource
            accepts no access requests.

            Only a private resource can accept access requests: `true` together with a
            public resource returns `400 invalid_input`.

            When the request returns an existing resource, this field changes nothing: the
            response carries the value the resource has. Change it with
            `PATCH /v1/resources/{id}`.
        allowed_device_keys:
          type: array
          maxItems: 256
          uniqueItems: true
          description: Public X25519 keys of the devices that can create links for this private resource, in canonical padded standard base64. Only the publisher can change this list; with an empty list only the owner can create links. The list has no effect unless the resource is private. When the request returns an existing resource, omit the list or send the keys that resource lists, in any order. Other keys return `400 device_keys_mismatch` and change nothing, because a create request does not change the allowed devices of a resource that exists. Change the list with `PATCH /v1/resources/{id}` (`allowed_device_keys_add`, `allowed_device_keys_remove`).
          items:
            type: string
            minLength: 44
            maxLength: 44
        type:
          $ref: '#/components/schemas/ResourceType'
        target_url:
          type: string
          format: uri
          maxLength: 2048
          description: The URL to protect.
        description:
          type: string
          maxLength: 500
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 10
        custom_domain:
          type: string
          maxLength: 253
          description: |
            Optional custom domain to bind to this resource. Must be a
            domain previously verified via the domains API.
        alias:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-z][a-z0-9-]{1,62}[a-z0-9]$'
          description: |
            Optional human-readable handle for the resource, unique per
            owner. Format: 3–64 lowercase alphanumeric chars and
            hyphens, must start with a letter and end alphanumeric.
            Reserved words (e.g. `admin`, `qurl`, `tunnel`) are
            rejected with 400 `alias_reserved`. Collisions with another
            of your resources return 409 `alias_in_use`. Disagreeing
            with the alias of an existing resource for the same
            target URL returns 409 `resource_alias_mismatch`.
          example: "dev-dashboard"
        slug:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-z][a-z0-9-]{1,62}[a-z0-9]$'
          # Customer-facing description kept terse per
          # docs/claude/api-codegen.md sparse-description guidance.
          # Internal wire-error matrix for maintainers (Scalar
          # strips YAML comments; repo is private; comment stays
          # internal):
          #
          #   Auth        Serialization     Status  Code             Where
          #   ─────────────────────────────────────────────────────────────────────────
          #   owner       slug omitted      400     invalid_input    handler (slug-required)
          #   owner       slug ""           400     validation_error openapi (minLength:3)
          #   bootstrap   slug omitted      403     forbidden        handler (bound-slug)
          #   bootstrap   slug ""           400     validation_error openapi (minLength:3, upstream of handler)
          #   any         non-tunnel + slug 400     invalid_input    handler
          #
          # Bootstrap+empty is the subtle row: openapi runs AFTER
          # auth in prod (router.go ~413/~428), so even bootstrap-
          # authed requests get intercepted by minLength:3 before
          # the bound-slug 403 fires. In-process bootstrap callers
          # (Go unit tests, future HTTP-skipping APIs) reach the
          # handler directly and DO see the 403; the matrix above
          # documents the HTTP wire shape, not the in-process one.
          # Both surfaces are fenced — HTTP by
          # TestTunnelResourceSlugRequired_HTTPPipeline, in-process
          # by TestResourceCreate_TunnelBootstrapRestriction_
          # RejectsUnboundShapes/empty_slug.
          description: |
            Stable name for a qURL Connector within your account. Required for `type=tunnel`;
            forbidden for other resource types. Use 3–64 lowercase letters, digits, or hyphens,
            starting with a letter and ending with a letter or digit. There are no reserved names.

            A slug cannot change after creation. An `alias` can change and is intended for display.
            Use `GET /v1/resources?slug={slug}` to find the Connector after a process restart.

            Without `find_or_create: true`, an existing slug returns `409 slug_in_use`.
            See `find_or_create` for reuse and retry behavior. A missing slug returns `400`
            for account credentials, or `403` for a restricted Connector enrollment credential
            whose permission requires a bound slug. Use `error.code` to handle errors.
          example: "prod-dashboard"
        find_or_create:
          type: boolean
          description: |
            Reuse an active qURL Connector with the same slug in your account.
            Default: `false`. Requires `type=tunnel` and `slug`; otherwise returns `400`.

            | Existing Connector | Result when true |
            |---|---|
            | Active | Return it with `201` and `meta.found_existing: true`. |
            | None | Create one with `201` and `meta.found_existing: false`. |
            | Revoked | Create a new resource with `201` and `meta.found_existing: false`. The old CRID and links remain revoked. |
            | Closed | Return `410`; choose a new slug or delete the retained resource before retrying. |

            Reusing a Connector ignores `alias`, `description`, and `tags`; use PATCH to change them.
            Concurrent requests resolve to one resource. On `409 slug_in_use`, retry once, then
            inspect the existing Connector before deciding to revoke it.

            Success consumes a restricted Connector enrollment credential, including reuse.
            For recovery after `500`, `401`, or `409 bootstrap_key_consumed`, see `CreateApiKeyRequest.kind`.
          default: false
          example: true

    UpdateResourceRequest:
      type: object
      # All-optional PATCH body — see UpdateQurlRequest. `clear_alias` is the
      # specific field to watch: callers borrow it from other APIs, but this
      # one clears an alias with an explicit `alias: null` (RFC 7396), so
      # `clear_alias: true` silently leaves the alias in place.
      additionalProperties: false
      properties:
        consumer_access:
          $ref: '#/components/schemas/ConsumerAccessPolicy'
        expected_consumer_access_version:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Required when consumer_access is changed. Zero means no prior consumer policy.
        access_requests:
          type: boolean
          description: |
            Turn access requests on or off. When on, someone who opens this private
            resource's link without access can ask you for it, and you approve or deny each
            request. Only a private resource can turn it on: `true` for a public resource
            returns `400 invalid_input`.

            Turning it off stops new requests, and people without access are no longer told
            that the resource exists. It removes nothing: requests that are already pending
            stay in the list until you decide them or they expire, you can still approve
            them, and passkeys you approved keep their access.

            Update separately from `custom_domain`; combining them returns
            `400 invalid_input`.
        allowed_device_keys:
          type: array
          maxItems: 256
          uniqueItems: true
          description: Replace the complete list of public X25519 keys of the devices that can create links for this private resource. Use canonical padded standard base64. Only the publisher can change this list; with an empty list only the owner can create links. The list has no effect unless the resource is private. Update separately from custom_domain; combining them returns 400 invalid_input. Cannot be combined with `allowed_device_keys_add` or `allowed_device_keys_remove`. To change single keys without sending the whole list, use those two fields instead.
          items:
            type: string
            minLength: 44
            maxLength: 44
        allowed_device_keys_add:
          type: array
          maxItems: 256
          uniqueItems: true
          description: |
            Public X25519 keys to add to the devices that can create links for this private
            resource, in canonical padded standard base64. The other listed keys stay as
            they are. A key that is already listed changes nothing. The resulting list can
            hold at most 256 keys, counted after the removals of the same request; a
            request that would exceed that returns `400 invalid_input` and changes nothing.

            Can be sent together with `allowed_device_keys_remove`; a key in both returns
            `400 invalid_input`. Cannot be combined with `allowed_device_keys` or
            `custom_domain` (`400 invalid_input`).
          items:
            type: string
            minLength: 44
            maxLength: 44
        allowed_device_keys_remove:
          type: array
          maxItems: 256
          uniqueItems: true
          description: |
            Public X25519 keys to remove from the devices that can create links for this
            private resource, in canonical padded standard base64. The other listed keys
            stay as they are. A key that is not listed changes nothing. Removing a key
            blocks new link requests from that device; links it already created keep working
            until they expire or are revoked.

            Can be sent together with `allowed_device_keys_add`; a key in both returns
            `400 invalid_input`. Cannot be combined with `allowed_device_keys` or
            `custom_domain` (`400 invalid_input`).
          items:
            type: string
            minLength: 44
            maxLength: 44
        description:
          type: string
          maxLength: 500
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 10
        custom_domain:
          type: string
          maxLength: 253
        preserve_host:
          type: boolean
          description: |
            Whether to preserve the original Host header when proxying to the origin
            via a custom domain. When true, the custom domain is sent as the Host header.
            When false (default), the target server's hostname is used.
            Only meaningful when custom_domain is set.
        alias:
          type: string
          nullable: true
          minLength: 3
          maxLength: 64
          pattern: '^[a-z][a-z0-9-]{1,62}[a-z0-9]$'
          description: |
            Set, rebind, or clear the resource's alias under RFC 7396
            JSON Merge Patch semantics:

              - omitted → no change.
              - `null` → clear the alias and make the alias available again. Equivalent to deleting the alias.
              - string value → set or rebind. Pattern, length, and
                reserved-word rules match `CreateResourceRequest.alias`.

            Sending an empty string (`""`) is rejected with `400
            alias_invalid_format` to avoid the silent-no-op trap on
            callers building this body from user input — use `null`
            for the clear directive.
    ResourceData:
      type: object
      properties:
        consumer_access_version:
          type: integer
          format: int64
          description: Monotonic consumer policy revision. Zero means no consumer policy has been set.
        consumer_access:
          $ref: '#/components/schemas/ConsumerAccessPolicy'
        private:
          type: boolean
          default: false
          description: When true, only the owner and the devices listed in `allowed_device_keys` can create links for this resource. A resource that is not private is public. Privacy is chosen when the resource is created (a new resource is private unless its creator asked for a public one) and cannot change afterward. Older resources can omit this field; they are public.
        allowed_device_keys:
          type: array
          maxItems: 256
          uniqueItems: true
          description: Public X25519 keys of the devices that can create links for this private resource, in canonical padded standard base64. Omitted when no devices are listed; only the owner can then create links for a private resource. The list has no effect unless the resource is private.
          items:
            type: string
            minLength: 44
            maxLength: 44
        access_requests:
          type: boolean
          description: Whether someone who opens this private resource's link without access can ask you for it. Always present. Change it with `PATCH /v1/resources/{id}`.
        allowed_passkeys:
          type: array
          maxItems: 256
          description: The passkeys you approved for this private resource, oldest approval first. Always present; empty when you approved none. A passkey is added by approving an access request and removed with `DELETE /v1/resources/{id}/allowed-passkeys/{device_id}`.
          items:
            $ref: '#/components/schemas/AllowedPasskey'
        resource_id:
          <<: *publicResourceIDSchema
          example: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA"
          description: Resource public key, retained for compatibility. Prefer crid for later requests.
        # `crid` is the second public resource identity (dual-accepted on
        # every resource-ID path parameter). Emitted from the stored
        # attribute — never derived at read time. Deliberately NOT in the
        # transit redaction strip below: it is identity-class data with zero
        # viewer/content signal, same posture as resource_id.
        crid:
          $ref: '#/components/schemas/CRID'
        # `type` is a plain `type: string` (no $ref to ResourceType)
        # so the response schema doesn't pin the wire shape to the full
        # ResourceType enum — that decoupling lets the response carry
        # internal-only values (e.g. transit on connector reads, tunnel
        # on internal callers) without OpenAPI middleware rejecting
        # them at the response-validation boundary.
        # TestResourceTypeEnumParity pins the contract.
        #
        # Runtime source of truth for the transit-row redaction list
        # in the description below is internal/api/handlers/{resource,
        # server}.go (toResourceData / toQurlData, under the
        # shouldStripDashboardFields branch). If you add a field to the
        # strip there, update the description's field list in the same
        # PR. TestOpenAPISpec_ResourceDataTypeRedactionList fences the
        # spec side; docs/claude/connector-redaction.md pins the
        # operator-facing-docs side.
        #
        # target_path is valid only for type=tunnel mints, while the strip
        # predicate currently selects type=transit. Keeping target_path in
        # the nested strip set is defensive for legacy or malformed rows; it
        # does not make target_path valid on transit resources.
        type:
          type: string
          description: |
            Resource type (see `ResourceType` for the full enum).
            Management-API read responses on connector-owned upload rows redact
            user-content resource fields (`target_url`, `description`,
            `tags`, `custom_domain`, `alias`, `preserve_host`, `qurl_count`,
            `slug`) and nested qURL summary fields (`label`, `target_path`).
            List/detail responses include the row but omit those fields.
        target_url:
          type: string
          description: |
            The URL to protect. Optional — omitted (field absent from
            the JSON object, NOT serialized as null) when not applicable
            to this resource, or when the resource is owned by a
            connector.
        knock_resource_id:
          $ref: '#/components/schemas/KnockResourceID'
        # qURL Connector consumes this value verbatim as its reverse-connection
        # routing label. It is derived server-side from the complete public-key
        # digest, is distinct from resource_id and knock_resource_id, and is
        # intentionally absent on non-Connector resources. Keep the rendered
        # description limited to the caller action: the derivation and routing
        # implementation are not customer-actionable.
        connector_routing_id:
          $ref: '#/components/schemas/ConnectorRoutingID'
        status:
          type: string
          enum: [active, revoked]
        desired_state:
          $ref: '#/components/schemas/ResourceSharingDesiredState'
        serving_epoch:
          type: integer
          format: int64
          minimum: 0
          description: |
            Monotonic qURL Connector serving lifecycle. Zero means sharing has
            never been started.
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        custom_domain:
          type: string
          nullable: true
        alias:
          type: string
          nullable: true
          description: |
            Per-owner human-readable handle for the resource (e.g.
            `dev-dashboard`). `null` when no alias is set. Lookup via
            `GET /v1/resources?alias={alias}` (returns a 0- or 1-item
            list).
        slug:
          type: string
          readOnly: true
          description: |
            Per-owner immutable identity supplied at create time.
            Echo of the `slug` field on `POST /v1/resources`; omitted
            on resources that were not created with a slug. Distinct
            from `alias`: slugs are immutable post-create, aliases are
            mutable. Lookup via `GET /v1/resources?slug={slug}` returns
            a 0- or 1-item active-resource list. See
            `CreateResourceRequest.slug` for format, uniqueness, and
            `find_or_create` semantics.
        preserve_host:
          type: boolean
          description: Whether to preserve the original Host header when proxying via custom domain
          default: false
        session_duration_cap:
          type: integer
          description: |
            Maximum session duration, in seconds, for qURLs on this resource.
            It is fixed when `POST /v1/qurls` first creates the resource. Later link creation
            and updates cannot exceed it (`400 invalid_session_duration`). Omitted session
            durations inherit the cap.

            Absent means there is no resource cap; the 1-second to 24-hour field limits still
            apply. `POST /v1/resources` creates a resource without a cap, and later link
            creation does not add one.

            To change a cap, register a different target URL, or revoke this resource and
            recreate it through `POST /v1/qurls` with the required `session_duration`.
            Revocation blocks all existing links. A new resource receives a new CRID.
          minimum: 1
          maximum: 86400
          example: 30
        qurl_count:
          type: integer
          description: |
            Total number of retained qURLs for this resource, including revoked and expired
            qURLs that have not yet been removed. This is not an active-link count.
            If omitted, the count is unknown; do not treat it as zero.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        # Redaction note: publisher is intentionally surfaced on connector-owned
        # rows too. It describes the owner, not uploaded content or viewers, so
        # it is NOT in the redaction strip set — same posture as created_at.
        publisher:
          $ref: '#/components/schemas/Publisher'
        # Redaction note: tombstoned_at is intentionally surfaced
        # on connector-owned rows too. The field is a server-internal
        # lifecycle timestamp with zero viewer identity, so it is
        # NOT in the redaction strip set — see the connector-redaction
        # internal docs for the threat-model reasoning.
        #
        # Implementation note (intentionally not in the public
        # description): the dashboard `GET /v1/resources` list
        # excludes connector-owned rows, so the field's current
        # 200-response surface is alias lookup. As scanner
        # coverage extends to other resource types, the surface
        # broadens automatically.
        tombstoned_at:
          type: string
          format: date-time
          description: |
            When the resource's lifecycle closed. Present only on
            tombstoned resources; absent on active ones.
            Consumers fetching a single resource by ID handle the
            tombstoned-row case via the 410 response on
            `GET /v1/resources/{id}` — the same timestamp surfaces
            in `meta.tombstone.tombstoned_at`. List / alias-lookup
            (`GET /v1/resources?alias=...`) responses include this
            field on the resource itself so callers can distinguish
            tombstoned from active without a per-row probe.
    ResourceDetailData:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ResourceData'
        qurls:
          type: array
          maxItems: 100
          readOnly: true
          description: |
            Unordered bounded preview of per-qURL summaries for this resource
            (maximum 100). This preview does not imply newest first or any
            stable ordering and is not active-first; an active qURL can be
            absent from the preview when earlier qURLs fill the cap.
            When present, `resource.qurl_count` is the exact total; if omitted,
            callers must treat truncation as unknown. For the complete
            per-resource qURL list, use `GET /v1/resources/{id}/qurls`,
            which pages through every qURL with cursor-based pagination.
            For large resources, the preview and count are separate reads, so
            concurrent qURL changes can make the preview length and
            `resource.qurl_count` briefly differ.
          items:
            $ref: '#/components/schemas/QurlSummary'

    QurlSummary:
      type: object
      properties:
        qurl_id:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [active, consumed, expired, revoked]
        one_time_use:
          type: boolean
        max_sessions:
          type: integer
        session_duration:
          type: integer
          description: Session lifetime in seconds (0 = server default)
        use_count:
          type: integer
        qurl_site:
          type: string
          description: |
            Routing URL for this qURL. Use it as returned. Do not extract an identifier from its hostname.
        target_path:
          type: string
          minLength: 1
          maxLength: 2048
          readOnly: true
          description: |
            Redirect destination and authorization scope for this qURL on a
            qURL Connector resource. The query is returned when one was
            minted, but authorization checks only the path and its descendants
            at a segment boundary. Omitted when this qURL uses the bare origin.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        access_policy:
          $ref: '#/components/schemas/AccessPolicy'

    UpdateQurlTokenRequest:
      type: object
      minProperties: 1
      description: |
        Update a specific qURL token. Can change expiration, label,
        access policy, or max_sessions. At least one field must be provided.
        For expiry: provide exactly one of extend_by (relative) or expires_at (absolute).
        Active signed qURL links can be extended without changing the URL.
        They accept only an unchanged or empty access policy;
        see `PATCH /v1/resources/{id}/qurls/{qurl_id}`.
      # Same silent-no-op exposure as UpdateQurlRequest: all-optional body,
      # 200 on success, so a misspelled field is indistinguishable from an
      # omitted one.
      additionalProperties: false
      properties:
        extend_by:
          type: string
          description: |
            Duration to extend by (e.g., "24h", "7d").
            Minimum: 1 minute. Maximum: 30 days.
            Mutually exclusive with expires_at.
          example: "1h"
        expires_at:
          type: string
          format: date-time
          description: |
            Absolute expiration timestamp (RFC 3339).
            Must be in the future and within 30 days.
            Mutually exclusive with extend_by.
        label:
          type: string
          maxLength: 500
          description: Human-readable label for this qURL.
        access_policy:
          $ref: '#/components/schemas/AccessPolicy'
        max_sessions:
          type: integer
          minimum: 0
          maximum: 1000
          description: |
            Session limit for this qURL token (0 = unlimited). On signed qURL links it counts
            every session the link has admitted over its lifetime, not concurrent sessions:
            ending or terminating a session does not free a slot, and lowering the limit to
            the number of times the link has already been opened or fewer permanently
            prevents new sessions. Sessions that are already open are not affected.
        session_duration:
          type: string
          description: |
            How long a session permits new requests after the recipient first reaches the content. Minimum: 1 second.
            Maximum: 24 hours.

            If the parent resource was created with a `session_duration`
            (see `ResourceData.session_duration_cap`), values exceeding
            that cap are rejected with HTTP 400 `invalid_session_duration`.
            On a capped resource, sending an empty string for this field
            applies the cap rather than the server default — the
            uploader's intent supersedes the global default whenever a
            cap is in force. On an uncapped resource, an empty string
            resets to the default a new link would get: 1 hour for tunnel
            resources, and for URL resources the 24-hour-plus-10-second
            deadline described under `CreateQurlRequest.session_duration`.

            New requests are denied at session expiry. Active requests,
            streams, and WebSockets are canceled at that deadline.
            See `CreateQurlRequest.session_duration`
            → **Timing precision** for the full semantics.
          example: "1h"

    QurlSummaryResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/QurlSummary'
        meta:
          $ref: '#/components/schemas/Meta'

    QurlSummaryListResponse:
      type: object
      description: |
        A cursor-paginated page of per-qURL summaries for a single
        resource, returned by `GET /v1/resources/{id}/qurls`.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/QurlSummary'
        meta:
          $ref: '#/components/schemas/ListMeta'

    ResourceSharingDesiredState:
      type: string
      enum: [on, off]

    ResourceConnectionState:
      type: string
      enum: [stopped, connecting, serving]
      description: |
        GET derives this from authenticated Connector connections for the
        current lifecycle. A lifecycle mutation that rotates `serving_epoch`
        reports `connecting` conservatively until a later GET observes a ready
        connection.

    UpdateResourceSharingRequest:
      type: object
      additionalProperties: false

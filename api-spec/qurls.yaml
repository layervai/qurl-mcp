# oapi-codegen v2.x does not fully support OpenAPI 3.1 features.
#
# This spec drives the customer-facing API reference (Scalar). Before
# adding or editing any rendered string (description, summary, example,
# enum labels, tag/server/info fields), read the "Audience: openapi.yaml
# is customer-facing" section in docs/claude/api-codegen.md. Do not
# leak internal implementation (AWS primitives, DynamoDB internals,
# internal hostnames, middleware names, internal repo refs, deployment
# codenames).
openapi: 3.0.3
info:
  title: qURL™ Service API
  description: |
    Use the qURL API to create temporary access links to protected resources.

    ## Start here

    A **CRID** (`crid`) is the permanent identity of a protected **resource**.
    A **qURL** is an access link to that resource, with its own expiration and access rules.
    You can create multiple qURLs for the same CRID and revoke each link separately.

    | Value | Use it to |
    |---|---|
    | `crid` | Identify and manage the resource. It stays the same throughout the resource's life and is never reused after deletion. It does not grant access. |
    | `qurl_id` | Update or revoke one qURL without changing the other links. |
    | `qurl_link` in create or mint responses; `qurl` in `/share` responses | The secret access link to share with a recipient. |

    Treat access links as secrets. Use them as returned. Do not construct them or
    extract resource IDs from them.

    ## Quickstart: register, share, and revoke

    Use **Resources** for new integrations. The steps below register a URL, create a
    one-hour qURL, and revoke that link. They use Bash, curl 7.76 or later, jq, and uuidgen.
    Set `QURL_API_KEY` to an account API key with `qurl:read` and `qurl:write`.
    Set `TARGET_URL` to the HTTPS URL you want to protect. Run the steps in the same shell.

    **1. Register the resource and save its CRID.**

    ```bash
    set -euo pipefail
    : "${QURL_API_KEY:?Set QURL_API_KEY to your account API key}"
    : "${TARGET_URL:?Set TARGET_URL to your HTTPS target URL}"
    QURL_API_URL="${QURL_API_URL:-https://api.layerv.ai}"
    RESOURCE_URL="$QURL_API_URL/v1/resources"

    resource=$(curl --fail-with-body --silent --show-error \
      "$RESOURCE_URL" \
      -H "Authorization: Bearer $QURL_API_KEY" \
      -H 'Content-Type: application/json' \
      --data "$(jq -n --arg url "$TARGET_URL" '{type: "url", target_url: $url}')")
    CRID=$(jq -er '.data.crid' <<< "$resource")
    ```

    Expect `201`. Repeating this request for the same URL and account returns the
    existing active resource. Registration alone does not create a qURL access link.

    **2. Create a link for a recipient.**

    ```bash
    MINT_KEY=$(uuidgen)
    link=$(curl --fail-with-body --silent --show-error \
      "$RESOURCE_URL/$CRID/qurls" \
      -H "Authorization: Bearer $QURL_API_KEY" \
      -H "Idempotency-Key: $MINT_KEY" \
      -H 'Content-Type: application/json' \
      --data '{"expires_in":"1h","one_time_use":false,"max_sessions":1,"session_duration":"15m","label":"Quickstart recipient"}')
    QURL_ID=$(jq -er '.data.qurl_id' <<< "$link")
    ACCESS_LINK=$(jq -er '.data.qurl_link' <<< "$link")
    printf '%s\n' "$ACCESS_LINK"
    ```

    Expect `201`. Open the printed link in a browser, or share it with the intended
    recipient. The link permits one concurrent session, with a 15-minute session
    lifetime. The same link can start another session while it is still valid.
    Keep the printed value out of logs and source control.
    If the request times out, retry the `link=$(curl ...)` command with the same
    `MINT_KEY`; do not run `uuidgen` again for that retry.

    **3. Revoke this link when access is no longer needed.**

    ```bash
    curl --fail-with-body --silent --show-error \
      -X DELETE "$RESOURCE_URL/$CRID/qurls/$QURL_ID" \
      -H "Authorization: Bearer $QURL_API_KEY"
    ```

    Expect `204` with no body. The resource remains available for new qURLs.
    If revocation returns `503`, wait for `Retry-After` and repeat the same DELETE.
    Session timing and already-open connections are described in
    `CreateQurlRequest.session_duration` under **Timing precision**.

    ## Choose an operation

    | Task | Recommended operation |
    |---|---|
    | Register a resource without a link | `POST /v1/resources` |
    | Create a link with chosen access rules | `POST /v1/resources/{id}/qurls` |
    | List or get resources | `GET /v1/resources` or `GET /v1/resources/{id}` |
    | List all links for one resource | `GET /v1/resources/{id}/qurls` |
    | Update or revoke one link | `PATCH` or `DELETE /v1/resources/{id}/qurls/{qurl_id}` |
    | Revoke a resource and all its links | `DELETE /v1/resources/{id}` |

    Put the CRID in `{id}`. Use these alternatives only when they fit your task:

    | Alternative | When to use it |
    |---|---|
    | `POST /v1/qurls` | Create a resource and its first link from a target URL in one request. |
    | `POST /v1/resources/{id}/share` | Create a link with resource defaults using `qurl:resolve`. It accepts a lifetime, not custom access rules, and does not guarantee replay. |
    | `POST /v1/qurls/{id}/mint_link` | Maintain an existing integration that uses this route. |

    The `/v1/qurls` list, get, update, and delete operations act on resources despite
    their names. Use the Resources operations above to keep resource and link actions clear.
    Older resources can omit `crid`; use their returned `resource_id` public key as a fallback.

    ## Authentication

    Send your API key or Auth0 access token in the header:

    ```http
    Authorization: Bearer YOUR_API_KEY_OR_ACCESS_TOKEN
    ```

    Use an API key for scripts and services. Use an Auth0 access token for operations
    that require JWT authentication. Do not send credentials in URLs or request bodies.
    Each operation lists its required permissions and any credential restrictions.

    | Credential | Where to use it |
    |---|---|
    | API key | Operations that accept API keys, within the key's scopes |
    | Auth0 access token (JWT) | Interactive account management and operations that accept JWTs |
    | Enrollment token | Enroll one agent or Connector; not a general API credential |
    | Device credential | The enrolled device's permitted Connector operations |

    Scopes:
    - `qurl:read`: Read resources, qURLs, and quota.
    - `qurl:write`: Create, update, and revoke resources and qURLs; manage webhooks.
    - `qurl:resolve`: Redeem access tokens without a browser and share resources by CRID.
    - `qurl:agent`: Manage agent and qURL Connector enrollment and assignments.
    - `qurl:keys`: Manage credentials with explicit automation authority. See the API Keys operations for restrictions.

    ## Retries and idempotency

    Check the operation’s retry rules before retrying a write. Where replay is
    supported, choose a new `Idempotency-Key` for each new operation. After a timeout,
    retry with the same key, method, path, and body.
    Do not reuse a key for a different request. The standard replay window is
    24 hours; operations with different rules describe them separately.
    A replay can return a previously issued secret. Store successful responses securely.
    Resource sharing does not guarantee replay, even if you send `Idempotency-Key`.
    API-key creation, external identity bindings, billing checkout, and delegated
    batches have their own replay rules. Read their header and response descriptions.

    ## Responses and errors

    Most successful JSON responses contain `data` and `meta`:

    ```json
    {
      "data": [],
      "meta": {
        "request_id": "req_abc123",
        "page_size": 0,
        "has_more": false,
        "next_cursor": ""
      }
    }
    ```

    List responses include pagination fields. Send `meta.next_cursor` as `cursor`
    to get the next page. Continue while `meta.has_more` is `true`, even if a page
    contains fewer items than requested. Responses with status `204` or `304` have no body.
    Examples focus on the fields needed for the task. Schemas list all available fields.
    Some operations use a different JSON shape; follow the operation's response schema.

    Errors contain an `error` object with Problem Details fields and a stable `code`:

    ```json
    {
      "error": {
        "type": "https://api.qurl.link/problems/invalid_request",
        "title": "Invalid Request",
        "status": 400,
        "detail": "The target_url field must be a valid HTTPS URL",
        "instance": "/v1/qurls",
        "code": "invalid_request"
      },
      "meta": { "request_id": "req_abc123" }
    }
    ```

    Use `error.code` for program decisions and `error.detail` to explain the failure.
    Validation errors can include `error.invalid_fields`, a map of field names to errors.
    Include `meta.request_id` when you contact support.

    A `4xx` response can carry the fixed `error.detail`
    `The request was refused. The reason cannot be shown.` in place of a specific
    reason. The API sends it when the specific reason contains text that it does
    not disclose. The request was still refused for the reason that the status and
    `error.code` name. A failed item of a batch response can carry the same text as
    its `error.message`; the item's `error.code` still applies. If the status and
    the code are not enough to correct the request, send `meta.request_id` to
    support.

    ## Rate limits and caching

    Request limits apply per account and vary by plan. On `429`, wait for the
    number of seconds in `Retry-After` before retrying.
    For GET operations that return an `ETag`, send it in `If-None-Match` on the next
    request. A `304` means you can reuse the previous response.

    ## Webhooks

    Use the Webhooks operations to subscribe to events. Verify the `QURL-Signature`
    header with your webhook secret before processing a payload. See `WebhookPayload`
    for event availability, payload fields, and privacy rules.
  version: 1.0.0
  contact:
    name: LayerV
    url: https://layerv.ai

servers:
  - url: https://api.layerv.ai
    description: Production
  - url: https://api.layerv.xyz
    description: Sandbox

security:
  - bearerAuth: []

tags:
  - name: Account
    description: Optional account access for device-owned resources.
  - name: Resources
    description: Register and manage protected resources by CRID; create and manage their qURL access links
  - name: QURLs
    description: Create qURL access links and use compatibility resource operations
  - name: Quota
    description: Usage quota information
  - name: Identity
    description: Caller identity introspection — validate a credential and see who it belongs to
  - name: Publisher
    description: The publisher profile shown to people who request links to your resources
  - name: Webhooks
    description: Webhook endpoint management
  - name: API Keys
    description: API key management with JWT or explicit automation authority
  - name: Usage
    description: Usage and billing period information (JWT-only)
  - name: Customer
    description: Customer profile and billing settings (JWT-only)
  - name: Billing
    description: Stripe checkout, portal, and invoices (JWT-only)
  - name: Resolution
    description: Headless qURL resolution for AI agents and programmatic clients
  - name: Domains
    description: Custom domain management (enterprise plan)
  - name: Access Codes
    description: Access code management for protected resource sharing
  - name: Connectors
    description: Plugin connections that let qURL mint and report on resources owned by external workspaces, guilds, and systems.
  - name: Sessions
    description: Active access-session inspection and termination for a resource
  - name: Bindings
    description: |
      External identity bindings — mint an API key for a linked external
      identity, such as a Slack workspace, Discord guild, or Microsoft
      Teams tenant.

paths:
  /v1/account/auth:
    get:
      operationId: getAccountAuth
      summary: Get browser sign-in settings
      description: Returns public sign-in settings for optional account setup.
      tags: [Account]
      security: []
      responses:
        '200':
          description: Browser sign-in settings
          content:
            application/json:
              schema:
                type: object
                required: [domain, client_id, audience]
                properties:
                  domain: {type: string}
                  client_id: {type: string}
                  audience: {type: string}
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalServerError'
  /v1/account/link:
    post:
      operationId: linkDeviceAccount
      summary: Link this device to an account
      description: Requires this device's credential and a verified account access token. Existing resource IDs and links stay unchanged. A device can be linked to only one account.
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account_token]
              properties:
                account_token:
                  type: string
                  minLength: 1
                  maxLength: 16384
                  writeOnly: true
      responses:
        '200':
          description: Device linked
          content:
            application/json:
              schema:
                type: object
                required: [owner_id, account_id]
                properties:
                  owner_id: {type: string}
                  account_id: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalServerError'
  /v1/account/owners:
    get:
      operationId: listAccountOwners
      summary: List account resource owners
      description: Lists the account and its linked devices. Account access tokens can select a linked owner with the X-QURL-Owner header on management requests.
      tags: [Account]
      responses:
        '200':
          description: Account resource owners
          content:
            application/json:
              schema:
                type: object
                required: [owners]
                properties:
                  owners:
                    type: array
                    maxItems: 65
                    items: {type: string}
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalServerError'
  /v1/resolve:
    post:
      tags:
        - Resolution
      summary: "Redeem an access token without a browser"
      description: |
        Redeems an access token and grants network access to the IP address that makes
        this request. Use this operation for scripts and agents that do not use a browser.
        Access the returned `target_url` from the same IP before the grant expires.
        The response's `src_ip` shows which IP received access.

        If access setup fails after a one-time token is consumed, no access is granted
        and the token cannot be used again. Obtain a new link. Multi-use tokens can be retried.
      operationId: resolveQurl
      security:
        - bearerAuth: [qurl:resolve]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveQurlRequest'
            example:
              access_token: "at_k8xqp9h2sj9lx7r4abcdef"
      responses:
        '200':
          description: Token resolved and network access granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveQurlResponse'
              example:
                data:
                  target_url: "https://api.example.com/data"
                  resource_id: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA"
                  access_grant:
                    expires_in: 305
                    granted_at: "2026-03-09T15:30:00Z"
                    src_ip: "203.0.113.42"
                meta:
                  request_id: "req_abc123"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'


  /v1/qurls:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    post:
      tags:
        - QURLs
      summary: "Create an access link from a URL"
      description: |
        Creates an access link for a target URL. Creates the resource if you do not
        already have one for that URL. Save `crid` to manage the resource and `qurl_id`
        to manage this link. Share `qurl_link` with the recipient.

        If your resource for that URL has passed its expiration, the request returns
        `400 invalid_input`. Set a later expiration with `PATCH /v1/qurls/{id}`, or revoke
        that resource and send the request again.

        A `503` means that no link was created and that the request can be sent again
        after the time in `Retry-After`. One cause is that your resource for that URL
        was closed while the request was running: the retry creates a new resource.
        A `503` response is not stored for replay, so the retry runs again even with
        the same `Idempotency-Key`.

        A resource that this request creates is private unless the request sends
        `private: false`. Resource privacy cannot change after creation. If you already
        have a resource for that URL, the request reuses it with the privacy it has.
        A request that states `private` with a different value than that resource
        returns `400 privacy_mismatch`: omit `private` to reuse the resource. To list
        the devices that may create links for a private resource, use
        `PATCH /v1/resources/{id}`.

        Start with `target_url` and `expires_in`. Add an access policy only when needed.
        For a qURL Connector, `403 connector_disabled` means Connector operations are
        unavailable. Use `error.code` to distinguish this from a permission error.
      operationId: createQurl
      security:
        - bearerAuth: [qurl:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQurlRequest'
            examples:
              minimal:
                summary: Create a link that expires in one hour
                value:
                  target_url: "https://dashboard.example.com"
                  expires_in: "1h"
              restricted:
                summary: Restrict access by country and AI agent category
                value:
                  target_url: "https://dashboard.example.com"
                  expires_in: "1h"
                  one_time_use: false
                  max_sessions: 5
                  label: "Contractor dashboard access"
                  access_policy:
                    geo_allowlist: ["US", "CA"]
                    ai_agent_policy:
                      deny_categories: ["gptbot", "commoncrawl", "bytedance"]
      responses:
        '201':
          description: qURL created successfully
          headers:
            Location:
              description: API URL of the protected resource; share the response body's `qurl_link` with recipients
              schema:
                type: string
                format: uri
            Idempotency-Replayed:
              description: Legacy header. Check X-Idempotency-Replayed for the value "true" to identify a replay.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateQurlResponse'
              example:
                data:
                  crid: ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a
                  qurl_link: https://qurl.link/#at_abc123def456ghi789
                  qurl_site: https://r-ojpxe33vorsw63tmpeydc.qurl.site
                  expires_at: '2024-01-15T10:30:00Z'
                  qurl_id: q_3a7f2c8e91b
                meta:
                  request_id: req_abc123
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CreateQurlForbidden'
        '409':
          description: |
            An active resource already protects this URL with a different type
            (`resource_type_conflict`). Use its CRID with `POST /v1/resources/{id}/qurls`,
            or use another target URL. If you revoke and replace the existing resource,
            its old links stop working.

            After resolving the conflict, use a new `Idempotency-Key`. The original key
            can replay this `409` response for 24 hours.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags:
        - QURLs
      summary: "List resources"
      description: |
        Lists your resources, each of which can have multiple qURLs.
        Use `GET /v1/resources/{id}/qurls` with a resource's CRID to list its individual links.
        Supports status and date filters and cursor-based pagination.
      operationId: listQurls
      security:
        - bearerAuth: [qurl:read]
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return (1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: |
            Pagination cursor from previous response.
            Changing the sort parameter resets pagination to the first page.
          schema:
            type: string
        - name: status
          in: query
          description: |
            Filter by status. Valid values are `active` and `revoked`;
            multiple values may be supplied as a comma-separated list.
            Invalid values return `400 invalid_filter`.
          schema:
            type: string
            example: active,revoked
        - name: created_after
          in: query
          description: Filter by creation date (RFC3339)
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          description: Filter by creation date (RFC3339)
          schema:
            type: string
            format: date-time
        - name: expires_before
          in: query
          description: Filter by expiration date (RFC3339)
          schema:
            type: string
            format: date-time
        - name: expires_after
          in: query
          description: Filter by expiration date (RFC3339)
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          description: |
            Sort field and direction (field:direction).
            Valid fields: created_at, expires_at.
            Direction: asc or desc (default: desc).
            Sort order is consistent across pages.
          schema:
            type: string
            example: "created_at:desc"
        - name: q
          in: query
          description: |
            Search query string (case-insensitive).
            Searches across description and target_url fields.
          schema:
            type: string
            maxLength: 200
            example: "dashboard"
      responses:
        '200':
          description: |
            List of resources
          headers:
            ETag:
              description: Entity tag for caching
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QurlListResponse'
              example:
                data:
                - crid: ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a
                  target_url: https://dashboard.example.com
                  status: active
                  created_at: '2024-01-08T10:30:00Z'
                  expires_at: '2024-01-15T10:30:00Z'
                  description: Admin dashboard access
                  qurl_site: https://r-ojpxe33vorsw63tmpeydc.qurl.site
                - resource_id: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEoZLdT1C_J8lCh_mpQXJMoRzKi3Q_C5TnVQFYW0Cz5L5Jo83djulhze84U_rrhnUVQQRajXmUQKn-VQ8jR-qatA
                  target_url: https://api.example.com/reports
                  status: active
                  created_at: '2024-01-07T14:00:00Z'
                  expires_at: '2024-01-14T14:00:00Z'
                  qurl_site: https://r-ojpxe33vorsw63tmpeyde.qurl.site
                meta:
                  request_id: req_abc123
                  page_size: 2
                  has_more: true
                  next_cursor: eyJyIjoicl9MbTJOcDRROHJUNyJ9
        '304':
          description: Not Modified (ETag match)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/qurls/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    get:
      tags:
        - QURLs
      summary: "Get a resource"
      description: |
        Returns a resource and a preview of up to 100 qURLs. Use its CRID as `id`.
        A qURL ID is also accepted and returns its parent resource.
        For every link, use `GET /v1/resources/{id}/qurls` and follow pagination.
      operationId: getQurl
      security:
        - bearerAuth: [qurl:read]
      parameters:
        - $ref: '#/components/parameters/QurlId'
      responses:
        '200':
          description: |
            Resource details
          headers:
            ETag:
              description: Entity tag for caching
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QurlResponse'
              example:
                data:
                  crid: ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a
                  target_url: https://dashboard.example.com
                  status: active
                  created_at: '2024-01-08T10:30:00Z'

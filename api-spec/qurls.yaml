          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Pagination cursor from previous response
          schema:
            type: string
      responses:
        '200':
          description: List of webhooks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookListResponse'
              example:
                data:
                  - webhook_id: "wh_abc123def456ghij"
                    owner_id: "auth0|user123"
                    url: "https://example.com/webhooks/qurl"
                    events: ["qurl.created", "qurl.accessed"]
                    status: "active"
                    created_at: "2024-01-01T10:00:00Z"
                    updated_at: "2024-01-01T10:00:00Z"
                    failure_count: 0
                    last_delivery_success: true
                meta:
                  request_id: "req_abc123"
                  page_size: 1
                  has_more: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Webhooks
      summary: Create a webhook
      description: |
        Creates a new webhook endpoint. The secret is returned only once in the response.
        Store it securely - it cannot be retrieved later (only regenerated).
      operationId: createWebhook
      security:
        - bearerAuth: [qurl:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
            example:
              url: "https://example.com/webhooks/qurl"
              events: ["qurl.created", "qurl.accessed", "qurl.revoked"]
              description: "Production webhook for qURL events"
      responses:
        '201':
          description: Webhook created successfully
          headers:
            Location:
              description: URL of the created webhook resource
              schema:
                type: string
                format: uri
                example: "https://api.layerv.ai/v1/webhooks/wh_abc123def456ghij"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponseWithSecret'
              example:
                data:
                  webhook_id: "wh_abc123def456ghij"
                  owner_id: "auth0|user123"
                  url: "https://example.com/webhooks/qurl"
                  secret: "whsec_K8xQp9H2sJ9Lx7R4AaBbCcDdEeFf..."
                  events: ["qurl.created", "qurl.accessed", "qurl.revoked"]
                  status: "active"
                  description: "Production webhook for qURL events"
                  created_at: "2024-01-08T10:30:00Z"
                  updated_at: "2024-01-08T10:30:00Z"
                  failure_count: 0
                  last_delivery_success: false
                meta:
                  request_id: "req_abc123"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
      callbacks:
        onEvent:
          '{$request.body#/url}':
            post:
              summary: Webhook event delivery
              description: |
                Event payload delivered to your webhook URL. Delivery is at least once.
                A replay can use a new delivery ID; deduplicate events using the event type
                and the relevant business identifiers in the payload, not only `QURL-Delivery`.

                Header names MUST be treated as case-insensitive per RFC 9110 §5.1. Every delivery carries:

                - `QURL-Signature` — HMAC-SHA256 of the raw request body, computed with your webhook secret. Verify on every request.
                - `QURL-Event` — the event type (e.g., `qurl.created`).
                - `QURL-Delivery` — a unique delivery ID for log correlation and retries of that delivery.
                - `User-Agent` — fixed `QURL-Webhook/1.0`. Receivers with UA-based allowlists may match on this value.
              parameters:
                - name: QURL-Signature
                  in: header
                  required: true
                  description: HMAC-SHA256 of the raw request body, hex-encoded.
                  schema:
                    type: string
                    example: 'a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90'
                - name: QURL-Event
                  in: header
                  required: true
                  description: Event type that triggered this delivery.
                  schema:
                    type: string
                    example: 'qurl.created'
                - name: QURL-Delivery
                  in: header
                  required: true
                  description: Unique delivery ID for log correlation and retries of that delivery; a replay can use a new ID.
                  schema:
                    type: string
                    example: 'wd_abc123def456ghij'
                # `required: true` here means the producer (qurl-service) commits
                # to always sending this header, NOT that receivers must validate it.
                # The description below explicitly tells receivers not to reject on
                # UA mismatch.
                - name: User-Agent
                  in: header
                  required: true
                  description: |
                    Fixed identifier for outbound qURL webhook deliveries. We always send this value, so receivers MAY use it for UA-based allowlisting or log filtering — but receivers SHOULD NOT reject deliveries solely on a User-Agent mismatch (future minor versions may bump the suffix; match-on-prefix `QURL-Webhook/` is recommended).
                  schema:
                    type: string
                    enum: ['QURL-Webhook/1.0']
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/WebhookPayload'
              responses:
                '200':
                  description: Event received successfully


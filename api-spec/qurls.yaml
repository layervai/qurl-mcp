        For new integrations, prefer `POST /v1/resources/{id}/qurls`, which keeps resource
        and link operations together. This route remains available for existing clients.

        Send a JSON body; `{}` uses the defaults described in `MintLinkRequest`.
        Save `qurl_id` to manage the link and share `qurl_link` with the recipient.
        Use `Idempotency-Key` to recover a lost response.

        For qURL Connectors, `target_path` can restrict access to a path. Null or non-string

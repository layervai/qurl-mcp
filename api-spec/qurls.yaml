      description: |
        Creates a Stripe Checkout session for plan upgrade.
        Returns a URL to redirect the user to Stripe's hosted checkout page.
        Requires an Auth0 access token (JWT). API key authentication is not supported.

        The `plan` field selects which paid plan to check out into.
        Only purchasable plans are permitted (currently: `growth`); any
        other value is rejected with 400.

        Customers with an existing Stripe subscription or another pending
        checkout are rejected with 409. Existing subscriptions must be managed
        through the billing portal; pending attempts must reuse their original
        Idempotency-Key.
      operationId: createBillingCheckout
      security:
        - bearerAuth: [qurl:write]

      summary: Retire a Connector assignment
      description: |
        Completes removal of one qURL Connector device after its device
        credential has been revoked. The operation is idempotent and requires
        JWT authentication or an ordinary account API key with both `qurl:keys` and `qurl:agent`.
      operationId: retireConnectorAssignment
      security:
        - bearerAuth: [qurl:agent]
      parameters:
        - name: agent_id
          in: path
          required: true
          description: Canonical qURL Connector device identifier.
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$'
      responses:
        '204':
          description: Connector assignment is retired or was already absent
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':

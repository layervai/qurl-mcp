    UpdateQurlRequest:
      type: object
      description: |
        Updates resource metadata or expiration. Provide at least one field.
        To change expiration, use `extend_by` or `expires_at`, not both.
      # Every property is optional, so an unknown field makes the PATCH a
      # silent no-op: the caller believes it changed max_sessions (a field
      # that lives on UpdateQurlTokenRequest, not here) and gets a 200 with
      # nothing changed. Failing closed is the only way the caller finds out.
      additionalProperties: false
      properties:
        extend_by:
          type: string
          description: |
            Duration to extend by (e.g., "24h", "7d", "1w").
            Minimum: 1 minute. Maximum: 30 days.
            Mutually exclusive with expires_at.
          example: "1h"
        expires_at:
          type: string
          format: date-time
          description: |
            Absolute expiration time. Mutually exclusive with extend_by.
            Must be in the future and within 30 days from now.
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
            pattern: '^[a-zA-Z0-9][a-zA-Z0-9 _-]*$'
          maxItems: 10
          uniqueItems: true
          description: |
            Replace all tags on this resource. Tags are lowercased and trimmed
            server-side. Duplicates are silently removed. Pass an empty array
            to clear all tags.
        description:
          type: string
          maxLength: 500
          description: Replace the resource description. Pass an empty string to clear.

    MintLinkRequest:
      type: object
      description: |
        Creates another link for an existing resource. Send `expires_in` or `expires_at`,
        not both. If neither is set, the service chooses the default lifetime, including
        for qURL Connectors. The resource's expiration can shorten the result.
        Unlinked anonymous devices are also capped at 24 hours; use the returned
        `expires_at` as the effective expiry.
        For new integrations, prefer `POST /v1/resources/{id}/qurls`.
      additionalProperties: false
      properties:
        expires_in:
          type: string
          description: |
            Duration until expiration. Supports: minutes (5m), hours (24h), days (7d), weeks (1w).
            Minimum: 1 minute. Maximum: 30 days.
          example: "5m"
        expires_at:
          type: string
          format: date-time
          description: |
            Absolute expiration timestamp. Must be in the future and within 30 days from now.
            Mutually exclusive with expires_in.
        label:
          type: string
          description: Human-readable label identifying who this qURL is for
          maxLength: 500
          example: "Alice from Acme"
        one_time_use:
          type: boolean
          description: |
            Whether the link is consumed by its first successful use.
            Explicit `true` or `false` takes precedence over the resource defaults.

            When omitted, URL and integration-owned upload links use `false`.
            qURL Connector links use `true` unless `max_sessions` is greater than 1.
            For a reusable Connector link, explicitly send `one_time_use: false`, including
            when `max_sessions` is `0` (unlimited).
        max_sessions:
          type: integer
          description: Maximum concurrent sessions for this qURL token (0 = unlimited)
          minimum: 0
          maximum: 1000
          default: 0
        session_duration:
          type: string
          description: |
            How long a session permits new requests after the recipient first reaches the content. Minimum: 1 second.
            Maximum: 24 hours.

            If the parent resource was created with a `session_duration`
            (see `ResourceData.session_duration_cap`), values exceeding
            that cap are rejected with HTTP 400 `invalid_session_duration`.
            Omitting this field on a capped resource inherits the cap;
            without a cap, qURL Connectors use 1 hour and other resource types use the service default.

            New requests are denied at session expiry. Active requests,
            streams, and WebSockets are canceled at that deadline.
            See `CreateQurlRequest.session_duration`
            → **Timing precision** for the full semantics.
          example: "1h"
        access_policy:
          $ref: '#/components/schemas/AccessPolicy'
        # Percent-decoding parity is tracked internally in #1250. Keep that
        # implementation detail out of the published customer description.
        target_path:
          $ref: '#/components/schemas/QurlMintTargetPath'

    AccessPolicy:
      type: object
      description: |
        Access control policy for the qURL. Signed qURL links do not evaluate
        this policy; a policy stored on one has no effect on who can open it.
      x-go-type: domain.AccessPolicy
      x-go-type-import:
        path: github.com/layervai/qurl-service/internal/domain
      properties:
        ip_allowlist:
          type: array
          maxItems: 100
          items:
            type: string
          description: List of allowed IP addresses or CIDR ranges (max 100 entries)
          example: ["192.168.1.0/24", "10.0.0.1"]
        ip_denylist:
          type: array
          maxItems: 100
          items:
            type: string
          description: List of denied IP addresses or CIDR ranges (max 100 entries)
        geo_allowlist:
          type: array
          maxItems: 50
          items:
            type: string
            pattern: '^[A-Z]{2}$'
          description: List of allowed country codes (ISO 3166-1 alpha-2, max 50 entries)
          example: ["US", "CA", "GB"]
        geo_denylist:
          type: array
          maxItems: 50
          items:
            type: string
            pattern: '^[A-Z]{2}$'
          description: List of denied country codes (ISO 3166-1 alpha-2, max 50 entries)
          example: ["CN", "RU"]
        user_agent_allow_regex:
          type: string
          maxLength: 256
          description: Regular expression to allow matching user agents (max 256 characters)
          example: "^Mozilla.*"
        user_agent_deny_regex:
          type: string
          maxLength: 256
          description: Regular expression to deny matching user agents (max 256 characters)
          example: ".*bot.*"
        ai_agent_policy:
          $ref: '#/components/schemas/AIAgentPolicy'

    AIAgentCategory:
      type: string
      description: A well-known AI agent category identifier
      enum:
        - chatgpt
        - gptbot
        - claude
        - gemini
        - perplexity
        - cohere
        - meta
        - bytedance
        - amazon
        - apple
        - commoncrawl
        - mistral
        - generic_ai

    AIAgentPolicy:
      type: object
      x-go-type: domain.AIAgentPolicy
      x-go-type-import:
        path: github.com/layervai/qurl-service/internal/domain
      description: |
        Control access by recognized AI agent category instead of writing User-Agent patterns.
        This checks the User-Agent header; agents that hide or change their identity can bypass it.

        IP and country rules are checked first. This policy is checked next, followed by
        `user_agent_deny_regex` and `user_agent_allow_regex`. Deny rules take priority:
        an agent allowed here can still be blocked by a User-Agent deny rule.
        A User-Agent allow rule cannot override a denial here.

        Block all recognized AI agents:

        ```json
        {"block_all": true}
        ```

        Block specific crawlers:

        ```json
        {"deny_categories": ["gptbot", "commoncrawl"]}
        ```

        Allow only Claude and Perplexity among recognized AI agents:

        ```json
        {"allow_categories": ["claude", "perplexity"]}
        ```

        If a category appears in both lists, access is denied. These category rules do
        not identify or authenticate the person using an agent.
      properties:
        block_all:
          type: boolean
          description: Block all recognized AI agents regardless of category lists
          default: false
        deny_categories:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AIAgentCategory'
          description: |
            AI agent categories to block. Ignored if block_all is true.
            Deny takes precedence over allow.
          example: ["gptbot", "commoncrawl", "bytedance"]
        allow_categories:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AIAgentCategory'
          description: |
            AI agent categories to permit. When set, all other AI agents are blocked.
            Deny takes precedence. Ignored if block_all is true.
          example: ["claude", "chatgpt", "perplexity"]

    QurlData:
      type: object
      description: |
        Resource details returned by the `/v1/qurls` compatibility operations.
        Use `crid` to identify the resource and `qurl_id` to identify an individual link.
        The `qurls` array (present on
        single-get responses) is an unordered bounded preview (maximum 100) of
        per-qURL details including access policy and session limits. On list
        responses, only `qurl_count` is populated.
      properties:
        resource_id:
          <<: *publicResourceIDSchema
          example: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA"
          readOnly: true
          description: |
            Resource public key, retained for compatibility. Prefer `crid` when addressing this resource.
        # Same identity posture as ResourceData.crid: verified request CRID or canonical value,
        # exempt from the transit redaction strip.
        crid:
          $ref: '#/components/schemas/CRID'
        target_url:
          type: string
          format: uri
          description: |
            The protected backend URL. Optional — omitted (field absent
            from the JSON object, NOT serialized as null) when the
            resource is owned by a connector.
        status:
          type: string
          enum: [active, revoked]
          readOnly: true
          description: |
            Current lifecycle status. Computed at response time — resources past
            their expires_at are reported as "expired" even if not explicitly revoked.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: |
            When the resource was created.
        expires_at:
          type: string
          format: date-time
          description: |
            When the resource expires. Each qURL can have its own earlier expiration.
        description:
          type: string
          description: Human-readable description
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          description: Tags for categorization and filtering
        qurl_site:
          type: string
          format: uri
          readOnly: true
          description: |
            Routing URL for the resource. It does not grant access by itself.
            Share a qURL access link with the recipient. Do not extract an identifier from this hostname.
        custom_domain:
          type: string
          nullable: true
          readOnly: true
          description: Custom domain associated with this resource
        slug:
          type: string
          readOnly: true
          description: |
            Per-owner immutable identity supplied at create time.
            Echo of the `slug` field on `POST /v1/resources`; omitted
            on resources that were not created with a slug. See
            `ResourceData.slug` for the full description — the field
            carries identical semantics on both response schemas.
        qurl_count:
          type: integer
          readOnly: true
          description: |
            Total number of retained qURLs for this resource, including revoked and expired
            qURLs that have not yet been removed. This is not an active-link count.
            If omitted, the count is unknown; do not treat it as zero.
        qurls:
          type: array
          maxItems: 100
          readOnly: true
          description: |
            Unordered bounded preview of per-qURL details (maximum 100).
            Best-effort on single-get and omitted on list, preview lookup failure,
            or redacted resource types. This preview does not imply newest first
            or any stable ordering and is not active-first; an active qURL can
            be absent from the preview when earlier qURLs fill the cap.
            When present, `qurl_count` is the exact total; if omitted, callers
            must treat truncation as unknown. For the complete per-resource
            qURL list, use `GET /v1/resources/{id}/qurls`, which pages through
            every qURL with cursor-based pagination. For large resources, the
            preview and count are separate reads, so concurrent qURL changes
            can make the preview length and `qurl_count` briefly differ.
          items:
            $ref: '#/components/schemas/QurlSummary'

    CreateQurlData:
      type: object
      description: Response data for qURL creation
      properties:
        qurl_id:
          type: string
          pattern: '^q_[a-f0-9]{11}$'
          readOnly: true
          description: |
            Identifier for this qURL. Save it to revoke or update this link, or match its webhook events.
          example: "q_3a7f2c8e91b"
        resource_id:
          <<: *publicResourceIDSchema
          example: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA"
          readOnly: true
          description: |
            Resource public key, retained for compatibility. Prefer `crid` when addressing this resource.
        crid:
          $ref: '#/components/schemas/CRID'
        qurl_link:
          type: string
          format: uri
          readOnly: true
          description: |
            Access link to share with the recipient. Store it securely; later GET requests do not return it. Exact request retries can replay the creation response within the replay window.
        branded_domain:
          type: string
          readOnly: true
          description: |
            Custom hostname to display as link text. Keep `qurl_link` as the destination.
            See `MintLinkData.branded_domain` for domain status requirements.
            An idempotent retry returns the original value. Check the resource and domain
            again if you need the current domain status.
        qurl_site:
          type: string
          format: uri
          readOnly: true
          description: |
            Routing URL for this qURL. Use it as returned. Do not extract an identifier from its hostname.
        expires_at:
          type: string
          format: date-time
          readOnly: true
        target_path:
          type: string
          minLength: 1
          maxLength: 2048
          readOnly: true
          description: |
            Redirect destination and authorization scope for this new qURL on
            a qURL Connector resource. Omitted when the new qURL uses the bare
            origin. Each create call makes an independent qURL; omission affects
            only that qURL.
        label:
          type: string
          readOnly: true
          description: Human-readable label for this qURL
        # See CreateQurlRequest.type — plain `type: string` (no inline
        # enum, no $ref) so response-validation doesn't reject internal
        # values at the OpenAPI middleware boundary.
        # TestResourceTypeEnumParity guards this surface.
        type:
          type: string
          readOnly: true
          description: Resource type — echoes the type from the create request.
    QurlResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/QurlData'
        meta:
          $ref: '#/components/schemas/Meta'

    CreateQurlResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CreateQurlData'
        meta:
          $ref: '#/components/schemas/Meta'

    ResolveQurlRequest:
      type: object
      additionalProperties: false
      required:
        - access_token
      properties:
        access_token:
          type: string
          description: qURL access token (e.g., "at_k8xqp9h2sj9lx7r4abcdef")
          pattern: '^at_[a-z0-9_-]{22}$'
          example: "at_k8xqp9h2sj9lx7r4abcdef"

    ResolveQurlResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ResolveQurlData'
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'

    ResolveQurlData:
      type: object
      properties:
        target_url:
          type: string
          format: uri
          description: The URL that is now accessible from the caller's IP
          example: "https://api.example.com/data"
        resource_id:
          <<: *publicResourceIDSchema
          description: |
            Resource public key. This response does not include a CRID.
          example: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA"
        access_grant:
          $ref: '#/components/schemas/AccessGrant'

    AccessGrant:
      type: object
      description: Details of the network access that was granted
      required:
        - expires_in
        - granted_at
        - src_ip
      properties:
        expires_in:
          type: integer
          description: Seconds until network access expires
          example: 305
        granted_at:
          type: string
          format: date-time
          description: When the access was granted
          example: "2026-03-09T15:30:00Z"
        src_ip:
          type: string
          description: The IP address that was granted access
          example: "203.0.113.42"

    QurlListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/QurlData'
        meta:
          $ref: '#/components/schemas/ListMeta'

    MintLinkData:
      type: object
      properties:
        qurl_id:
          type: string
          pattern: '^q_[a-f0-9]{11}$'
          readOnly: true
          example: "q_a1b2c3d4e5f"
          description: |
            Identifier for this qURL. Save it to manage this link and match `qurl.accessed` webhook events.
        qurl_link:
          type: string
          format: uri
          readOnly: true
          description: |
            Access link to share with the recipient. Its use limit is set by the request and resource defaults.
        branded_domain:
          type: string
          readOnly: true
          description: |
            Custom hostname to display as the link text, for example `customer.com`.
            Use `<a href="{qurl_link}">{branded_domain}</a>`; keep `qurl_link` as the destination.
            Returned only when the domain belongs to your account and has status `verified`,
            `provisioning_tls`, or `active`. Otherwise omitted. During `provisioning_tls`, the
            hostname might not serve HTTPS yet; use it only as display text until `active`.
        expires_at:
          type: string
          format: date-time
          readOnly: true
        target_path:
          type: string
          minLength: 1
          maxLength: 2048
          readOnly: true
          description: |
            Redirect destination and authorization scope for this new qURL on
            a qURL Connector resource. Omitted when the new qURL uses the bare
            origin. Each mint call makes an independent qURL; omission affects
            only that qURL.
        # See CreateQurlRequest.type — plain `type: string` (no inline
        # enum, no $ref) so response-validation doesn't reject internal
        # values at the OpenAPI middleware boundary.
        # TestResourceTypeEnumParity guards this surface.
        type:
          type: string
          readOnly: true
          description: Resource type — echoes the type of the underlying resource.
    MintLinkResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/MintLinkData'
        meta:
          $ref: '#/components/schemas/Meta'

    ShareResourceRequest:
      type: object
      description: |
        Request body for `POST /v1/resources/{id}/share`. Every field
        is optional — send `{}` to accept the default share-link
        lifetime.
      additionalProperties: false
      properties:
        ttl_seconds:
          type: integer
          minimum: 1
          example: 300
          description: |
            Requested link lifetime in whole seconds. Omit it to use the service default.
            Values from 1 to 59 are raised to 60 seconds; values above 2,592,000 are lowered
            to 30 days. Zero, negative values, and non-integers fail request validation.
            The resource's expiration can shorten the result further. Read `expires_at` and
            `expires_in_seconds` in the response for the effective lifetime.
        session_duration:
          type: string
          example: "5m"
          description: |
            Lifetime of each admitted session, independent of the link lifetime.
            Uses the same duration syntax and 1-second to 24-hour bounds as mint_link.
            The resource's session-duration cap still applies; exceeding it returns
            `400 invalid_session_duration`. Omit this field to preserve the resource
            or service default. The session starts on first authorized content access;
            initial network admission includes the existing 10-second arrival allowance.
    ShareResourceData:
      type: object
      properties:
        qurl_id:
          type: string
          pattern: '^q_[a-f0-9]{11}$'
          readOnly: true
          example: "q_a1b2c3d4e5f"
          description: |
            Identifier for the new qURL. Save it to revoke this link with `DELETE /v1/resources/{id}/qurls/{qurl_id}` using the resource CRID, and to match access events.
        qurl:
          type: string
          format: uri
          readOnly: true
          example: "https://qurl.link/#qv2t1.1.1.1.Y2xhaW1zLWV4YW1wbGU.c2VjcmV0LWV4YW1wbGU.c2lnbmF0dXJlLWV4YW1wbGU"
          description: |
            The freshly minted share link — a short-lived qURL access
            link. Returned once and never retrievable again; whoever
            holds the link can use it, so treat it as a secret and hand
            it only to the intended recipient.
        crid:
          $ref: '#/components/schemas/CRID'
        # Plain `type: string` (no $ref to ResourceType) — same
        # decoupling posture as ResourceData.type / MintLinkData.type;
        # see TestResourceTypeEnumParity.
        type:
          type: string
          readOnly: true
          example: "url"
          description: |
            The shared resource's type (see `ResourceType` for the
            full enum).
        expires_at:
          type: string
          format: date-time
          readOnly: true
          example: "2026-03-09T15:35:00Z"
          description: |
            When the share link stops working — the effective,
            post-clamp expiry.
        expires_in_seconds:
          type: integer
          readOnly: true
          example: 300
          description: |
            Seconds until `expires_at`, measured when the response was
            produced. This is the effective lifetime after clamping, so
            it may be lower than the requested `ttl_seconds`.
        single_use:
          type: boolean
          readOnly: true
          example: false
          description: |
            Whether the share link is consumed by its first use. Set
            from the resource type's minting defaults (qURL Connector
            links default to single-visitor use).
        # resource_created_at and publisher deliberately omit `readOnly`: with
        # it the code generator emits optional pointer fields, and both must be
        # present on every 200. They describe the resource and its owner, never
        # the uploaded content, so connector-owned resources carry them too.
        #
        # Named resource_created_at, not created_at: every neighboring field
        # here describes the minted link, so a bare created_at beside expires_at
        # would read as the link's creation time. ResourceData and
        # ResourceSharingData describe the resource itself and keep created_at.
        resource_created_at:
          type: string
          format: date-time
          example: "2026-03-01T09:00:00Z"
          description: |
            When the shared resource was created. This is not when this link
            was minted: the link is new, and `expires_at` is the link's expiry.
        publisher:
          $ref: '#/components/schemas/Publisher'
      required:
        - qurl_id
        - qurl
        - type
        - expires_at
        - expires_in_seconds
        - single_use
        - resource_created_at
        - publisher

    ShareResourceResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ShareResourceData'
        meta:
          $ref: '#/components/schemas/Meta'

    CreateDelegatedQurlBatchRequest:
      type: object
      additionalProperties: false
      required:
        - mint_capability
        - grants
      properties:
        mint_capability:
          type: string
          minLength: 1
          maxLength: 8192
          description: Opaque delegated mint capability returned by the upload service
        grants:
          type: array
          minItems: 1
          maxItems: 100
          description: Independent recipient grants, processed in input order
          items:
            $ref: '#/components/schemas/DelegatedQurlGrant'

    DelegatedQurlGrant:
      type: object
      additionalProperties: false
      properties:
        expires_in:
          type: string
          description: |
            qURL lifetime. The delegated capability sets the maximum. If
            omitted, the service uses the capability maximum.
          example: "1h"
        label:
          type: string
          maxLength: 500
          description: Human-readable recipient label, at most 500 UTF-8 bytes
        one_time_use:
          type: boolean
          default: false
          description: Whether the qURL is consumed by its first admission
        max_sessions:
          type: integer
          minimum: 0
          maximum: 1000
          description: Maximum sessions for this qURL; zero means unlimited
        session_duration:
          type: string
          description: Access lifetime after a successful admission
          example: "1h"

    DelegatedQurlBatchStatus:
      type: string
      enum: [queued, running, succeeded, partially_failed, failed]

    DelegatedQurlBatchAcceptedData:
      type: object
      additionalProperties: false
      required:
        - batch_id
        - status
        - item_count
        - submitted_at
      properties:
        batch_id:
          type: string
          pattern: '^dqb_[A-Za-z0-9_-]{22}$'
          readOnly: true
        status:
          type: string
          enum: [queued]
          readOnly: true
        item_count:
          type: integer
          minimum: 1
          maximum: 100
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true

    CreateDelegatedQurlBatchResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/DelegatedQurlBatchAcceptedData'
        meta:
          $ref: '#/components/schemas/Meta'

    DelegatedQurlBatchData:
      type: object
      additionalProperties: false
      required:
        - batch_id
        - status
        - item_count
        - submitted_at
      properties:
        batch_id:
          type: string
          pattern: '^dqb_[A-Za-z0-9_-]{22}$'
          readOnly: true
        status:
          $ref: '#/components/schemas/DelegatedQurlBatchStatus'
        item_count:
          type: integer
          minimum: 1
          maximum: 100
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
        results:
          type: array
          maxItems: 100
          readOnly: true
          description: Results in the same order as the submitted grants
          items:
            $ref: '#/components/schemas/DelegatedQurlBatchItemResult'

    GetDelegatedQurlBatchResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/DelegatedQurlBatchData'
        meta:
          $ref: '#/components/schemas/Meta'

    DelegatedQurlBatchItemResult:
      type: object
      additionalProperties: false
      required:
        - index
        - status
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 99
          readOnly: true
        status:
          type: string
          enum: [succeeded, failed]
          readOnly: true
        qurl:
          $ref: '#/components/schemas/DelegatedQurlCreatedData'
        error:
          $ref: '#/components/schemas/DelegatedQurlItemError'

    DelegatedQurlCreatedData:
      type: object
      additionalProperties: false
      required:
        - qurl_id
        - qurl_link
        - expires_at
      properties:
        qurl_id:
          type: string
          pattern: '^q_[0-9a-f]{11}$'
          readOnly: true
        qurl_link:
          type: string
          format: uri
          readOnly: true
          description: Fresh share link returned only in the terminal batch result
        expires_at:
          type: string
          format: date-time
          readOnly: true

    DelegatedQurlItemError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum: [creation_failed]
          readOnly: true
        message:
          type: string
          maxLength: 500
          readOnly: true

    DelegatedQurlData:
      type: object
      additionalProperties: false
      required:
        - qurl_id
        - status
        - expires_at
        - one_time_use
        - max_sessions
        - session_duration
      properties:
        qurl_id:
          type: string
          pattern: '^q_[0-9a-f]{11}$'
          readOnly: true
        status:
          type: string
          enum: [active, consumed, expired, revoked]
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        label:
          type: string
          maxLength: 500
          readOnly: true
        one_time_use:
          type: boolean
          readOnly: true
        max_sessions:
          type: integer
          minimum: 0
          maximum: 1000
          readOnly: true
        session_duration:
          type: integer
          minimum: 0
          readOnly: true
          description: Session lifetime in seconds

    GetDelegatedQurlResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/DelegatedQurlData'
        meta:
          $ref: '#/components/schemas/Meta'

    BatchCreateRequest:
      type: object
      # The per-item gate lives on CreateQurlRequest, which is this schema's
      # item type; this line closes the envelope itself.
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          description: Array of qURL creation requests (1-100 items)
          items:
            $ref: '#/components/schemas/CreateQurlRequest'

    BatchCreateResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            succeeded:
              type: integer
              readOnly: true
              description: Number of successfully created qURLs
            failed:
              type: integer
              readOnly: true
              description: Number of failed creations
            results:
              type: array
              items:
                $ref: '#/components/schemas/BatchItemResult'
        meta:
          $ref: '#/components/schemas/Meta'

    BatchItemResult:
      type: object
      properties:
        index:
          type: integer
          readOnly: true
          description: Original index in the request array
        success:
          type: boolean
          readOnly: true
        resource_id:
          <<: *publicResourceIDSchema
          example: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA"
          readOnly: true
          description: |
            Resource public key, retained for compatibility. Prefer `crid` when addressing this resource.
        crid:
          $ref: '#/components/schemas/CRID'
        qurl_link:
          type: string
          format: uri
          readOnly: true
          description: Access link (if success)
        branded_domain:
          type: string
          readOnly: true
          description: |
            Customer's bare branded hostname (if success). See
            `MintLinkData.branded_domain` for the canonical description,
            including the `<a href="{qurl_link}">{branded_domain}</a>`
            rendering pattern, the `provisioning_tls` HTTPS-not-yet-live
            caveat, and the live-status + tenant-ownership gating.
        qurl_site:
          type: string
          format: uri
          readOnly: true
          description: |
            Routing URL for this qURL. Use it as returned. Do not extract an identifier from its hostname.
        expires_at:
          type: string
          format: date-time
          readOnly: true
          description: Expiration time (if success)
        error:
          type: object
          readOnly: true
          properties:
            code:
              type: string
            message:
              type: string
          description: Error details (if failed)

    QuotaData:
      type: object
      properties:
        plan:
          type: string
          enum: [free, growth, enterprise]
          readOnly: true
        period_start:
          type: string
          format: date-time
          readOnly: true
        period_end:
          type: string
          format: date-time
          readOnly: true
        rate_limits:
          type: object
          readOnly: true
          properties:
            create_per_minute:
              type: integer
            create_per_hour:
              type: integer
            list_per_minute:
              type: integer
            resolve_per_minute:
              type: integer
              description: >-
                Sustained token resolution refill rate per minute (-1 = unlimited).
                The instantaneous burst allowance can be smaller; X-RateLimit-Limit
                reports that burst allowance.
            max_qurls:
              type: integer
              description: >-
                Maximum qURLs you may hold across all your protected
                resources (-1 = unlimited). Currently unlimited on every
                plan — read the live value rather than assuming it.

                `max_active_resources` bounds how many things you may
                protect. It does not limit how many qURLs you may issue for
                one protected resource.
            max_active_resources:
              type: integer
              description: >-
                Maximum active protected resources — the target URLs and
                qURL Connectors you protect (-1 = unlimited). Reached only
                when protecting something new; creating more qURLs for an existing
                resource does not use this allowance. Other limits, access rules,
                and resource status still apply.
            max_active_qurls:
              type: integer
              deprecated: true
              description: >-
                Deprecated — use `max_active_resources`, whose value this
                mirrors. Despite the name it has always reported the
                protected-resource cap, never a qURL cap. For the qURL cap,
                read `max_qurls`.
            max_tokens_per_qurl:
              type: integer
              deprecated: true
              description: Deprecated compatibility field. Always -1 (unlimited); there is no per-resource qURL cap.
            max_data_transfer_bytes:
              type: integer
              format: int64
              description: >-
                Maximum data proxied through your protected resources per
                calendar month, in bytes (-1 = unlimited).
            max_expiry_seconds:
              type: integer
              description: Maximum expiry duration in seconds (2592000, or 30 days, on all customer plans)
        usage:
          type: object
          readOnly: true
          properties:
            qurls_created:
              type: integer
              description: Total recorded qURL creations and link mints this UTC calendar month, including share links. Counts update asynchronously.
            active_resources:
              type: integer
              description: Currently active protected resources
            active_resources_percent:
              type: number
              format: float
              minimum: 0
              nullable: true
              description: >-
                Percentage of max_active_resources used. Null in TWO cases,
                which a client must not conflate: your plan is unlimited, or
                your plan could not be determined right now — in the second
                case the limits reported alongside it are placeholders, so
                do not render "unlimited" on a null alone.
                Can exceed 100: the cap is applied when you protect something
                new, so an account already above it keeps everything it has
                and reports over 100 until it drops back under.
            active_qurls:
              type: integer
              deprecated: true
              description: >-
                Deprecated — use `active_resources`, whose value this
                mirrors. Despite the name it has always reported the count
                of active protected resources.
            active_qurls_percent:
              type: number
              format: float
              minimum: 0
              nullable: true
              deprecated: true
              description: >-
                Deprecated — use `active_resources_percent`, whose value
                this mirrors, including the fact that it can exceed 100 and
                that null means either "unlimited" or "plan could not be
                determined".
            data_transfer_bytes:
              type: integer
              format: int64
              description: >-
                Request and response bytes proxied in the current UTC calendar
                month. Recent traffic can take a short time to appear. Use only
                when data_transfer_available is true.
            data_transfer_available:
              type: boolean
              description: Whether traffic measurement is enabled and the account usage was resolved.
            total_accesses:
              type: integer
              description: Total access attempts this period

    QuotaResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/QuotaData'
        meta:
          $ref: '#/components/schemas/Meta'

    # Identity schemas
    MeData:
      type: object
      required:
        - owner_id
        - auth_type
      properties:
        owner_id:
          type: string
          description: Identifier of the account the credential belongs to.
          example: "auth0|user123"
        # auth_type / MeApiKey.kind deliberately stay plain `type: string`
        # (documented values in the description, no inline enum). An enum
        # here would re-declare values that already exist on other enums
        # (`api_key`, `enrollment_token`), and oapi-codegen resolves those
        # cross-enum constant collisions by renaming — including renaming
        # the PRE-EXISTING constants other packages already reference (see
        # "Enum Constant Names" in docs/claude/api-codegen.md). The
        # authoritative vocabulary lives with the producers (the auth
        # layer for auth_type; the credential-kind presentation for kind),
        # and the public contract already tells clients to tolerate
        # unknown kind values — which a closed enum cannot represent.
        auth_type:
          type: string
          description: >-
            How this request authenticated: a qURL API key (`api_key`) or
            an OAuth 2.1 JWT (`jwt`).
          example: "api_key"
        api_key:
          $ref: '#/components/schemas/MeApiKey'

    MeApiKey:
      type: object
      description: >-
        Identity of the API key that authenticated this request. Present
        only when `auth_type` is `api_key`; JWT-authenticated requests
        omit it.
      required:
        - key_id
        - kind
        - scopes
      properties:
        key_id:
          type: string
          pattern: '^key_[A-Za-z0-9]{12}$'
        key_prefix:
          type: string
          description: >-
            First 12 characters of the key for identification.
            Includes the environment prefix (e.g., "lv_live_a3x9").
        # Plain string on purpose — see the auth_type comment on MeData.
        kind:
          type: string
          description: >-
            The credential kind: a durable `api_key`, a one-shot
            `enrollment_token`, or a system-minted per-device `device`
            credential. Unknown future kind values may appear as the
            credential model grows; clients must tolerate values beyond
            these.
          example: "api_key"
        scopes:
          type: array
          items:
            type: string
          description: >-
            Permissions granted to this credential.
            Returned in alphabetical order for deterministic responses.
        expires_at:
          type: string
          format: date-time
          description: >-
            Expiration timestamp. Omitted for non-expiring credentials.

    MeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/MeData'
        meta:
          $ref: '#/components/schemas/Meta'

    # Usage schemas
    UsageCostEstimate:
      type: object
      required:
        - currency
        - amount_cents
        - description
      properties:
        currency:
          type: string
          description: Currency code (e.g. "usd")
          example: "usd"
        amount_cents:
          type: integer
          format: int64
          description: Cost in cents
          example: 1500
        description:
          type: string
          description: Human-readable breakdown
          example: "150 qURLs x $0.10/qURL"

    UsageCurrentPeriodData:
      type: object
      required:
        - tier
        - period_start
        - period_end
        - qurls_created
        - unit_price_cents
        - active_resources
        - active_qurls
        - data_transfer_bytes
      properties:
        tier:
          type: string
          enum: [free, growth, enterprise]
          description: Current billing tier
        period_start:
          type: string
          format: date-time
          description: Start of the stored Stripe billing period, or the current UTC calendar month when no Stripe period is stored
        period_end:
          type: string
          format: date-time
          description: Exclusive end of the stored Stripe billing period, or exclusive end of the current UTC calendar month when no Stripe period is stored
        qurls_created:
          type: integer
          description: Committed metered usage in the stored Stripe billing period, or recorded qURL creations and link mints in the current UTC calendar month when no Stripe period is stored
        unit_price_cents:
          type: integer
          format: int64
          minimum: 0
          description: Stored Stripe unit price in cents; zero when no metered price is stored
        active_resources:
          type: integer
          description: >-
            Number of currently active protected resources — the target URLs
            and qURL Connectors you protect.
        data_transfer_bytes:
          type: integer
          format: int64
          description: >-
            Data proxied through your protected resources in the current UTC
            calendar month, in bytes. This is independent of the stored Stripe
            billing period. Reflects traffic measured by the metering pipeline;
            reads `0` where measurement is not yet enabled, and can lag the
            most recent traffic by a short interval.
        active_qurls:
          type: integer
          deprecated: true
          description: >-
            Deprecated — use `active_resources`, whose value this mirrors.
            Despite the name it has always reported the count of active
            protected resources.
        cost_estimate:
          $ref: '#/components/schemas/UsageCostEstimate'

    UsageCurrentPeriodResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UsageCurrentPeriodData'
        meta:
          $ref: '#/components/schemas/Meta'

    UsageDailyEntry:
      type: object
      required:
        - date
        - qurls_created
      properties:
        date:
          type: string
          format: date
          description: Calendar date (YYYY-MM-DD)
        qurls_created:
          type: integer
          description: Recorded qURL creations and link mints on this UTC date, including share links. Counts update asynchronously.

    UsageDailyData:
      type: object
      required:
        - tier
        - period_start
        - period_end
        - daily
      properties:
        tier:
          type: string
          enum: [free, growth, enterprise]
          description: Current billing tier
        period_start:
          type: string
          format: date-time
          description: Start of the stored Stripe billing period, or the current UTC calendar month when no Stripe period is stored
        period_end:
          type: string
          format: date-time
          description: Exclusive end of the stored Stripe billing period, or exclusive end of the current UTC calendar month when no Stripe period is stored
        daily:
          type: array
          items:
            $ref: '#/components/schemas/UsageDailyEntry'
          description: One entry per UTC date that overlaps the elapsed portion of the half-open billing period

    UsageDailyResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UsageDailyData'
        meta:
          $ref: '#/components/schemas/Meta'

    # API Key schemas
    CredentialClaim:
      type: object
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum: [connector]
          description: >-
            The claimed resource type. `connector` is the only claim type
            today; future claim types may be added.
        id:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,62}[a-z0-9]$'
          description: >-
            The claimed resource id. For `type=connector` this is the
            connector id (3-64 chars, lowercase a-z0-9 with hyphens,
            starting with a letter and ending alphanumeric). An id that
            does not match returns 400 `invalid_input`.

    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required:
        - kind
        - name
      properties:
        kind:
          type: string
          enum: [api_key, enrollment_token]
          description: |
            Choose `api_key` for account API access or `enrollment_token` to enroll one device.
            `device` credentials are created by enrollment and cannot be created here.

            An enrollment token lasts at most 24 hours. Its scopes come from `target`.
            Connector enrollment requires one Connector claim; agent enrollment can omit claims
            or use one Connector claim. See `target` and `claims` for the accepted fields.
            Account setup without a browser requires an emailed verification code before
            account-key creation; using an enrollment token does not require another emailed code.

            Use a token for one enrollment at a time. Success consumes it, including finding an
            existing bound Connector. Validation, conflict, and temporary failures before the
            action do not consume it. After `500`, retry the same enrollment. If the retry returns
            `401`, obtain a new token and check the resource with an account credential.
            On `409 bootstrap_key_consumed`, the action can have partly succeeded; use the same recovery.
        name:
          type: string
          maxLength: 100
          description: Human-readable name for the credential
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [qurl:read, qurl:write, qurl:resolve, qurl:agent, qurl:keys]
          description: >-
            Permissions granted to a `kind=api_key` credential. Required
            for `kind=api_key`. Requesting `qurl:agent` requires the JWT
            caller to hold `qurl:agent`. Must be OMITTED for
            `kind=enrollment_token`: token scopes are server-assigned from
            `target` (agent -> `qurl:agent`; connector -> `qurl:agent` +
            `qurl:write`) and sending this field returns 400
            `invalid_input`.
        target:
          type: string
          enum: [agent, connector]
          description: >-
            What a `kind=enrollment_token` credential enrolls. When
            omitted it is derived from `claims`: a connector claim implies
            `connector`, otherwise `agent`. `target=connector` requires
            exactly one claim of type `connector` (the connector id the
            token is bound to); `target=agent` accepts zero claims
            (unbound) or one connector claim (a bound agent token). Not
            accepted for `kind=api_key` (400 `invalid_input`).
        claims:
          type: array
          items:
            $ref: '#/components/schemas/CredentialClaim'
          description: >-
            Resource claims binding a `kind=enrollment_token` credential.
            At most ONE claim entry is supported today; more return 400
            `invalid_input`. A bound token may only enroll against the
            claimed resource. Not accepted for `kind=api_key` (400
            `invalid_input`).
        expires_in:
          type: string
          pattern: '^[0-9]+[smhdw]$'
          description: >-
            Optional lifetime for `kind=enrollment_token` credentials.
            Defaults to 24h and cannot exceed 24h. Invalid format or
            bounds return 400 `invalid_duration`. Not accepted for
            `kind=api_key` (400 `invalid_input`): API keys are durable.

    UpdateApiKeyRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
          description: Updated name for the credential
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [qurl:read, qurl:write, qurl:resolve, qurl:agent, qurl:keys]
          description: |
            Updated permissions for the credential. Only `kind=api_key`
            credentials accept scope updates: enrollment-token scopes are
            server-assigned and device credentials cannot be edited (both
            return 400 `invalid_input`).
            Adding `qurl:agent` to a key that does not already hold it requires
            the JWT caller to hold `qurl:agent`. Keeping or removing an existing
            `qurl:agent` scope requires no additional permission beyond `qurl:write`.
            Any replacement set that includes `qurl:keys` requires the JWT to hold
            `qurl:keys`, even when that scope is already on the key.
            Omit this field to leave scopes unchanged.
            When provided, replaces all existing scopes (not a merge).

    ApiKeyData:
      type: object
      properties:
        key_id:
          type: string
          pattern: '^key_[A-Za-z0-9]{12}$'
          readOnly: true
        key_prefix:
          type: string
          readOnly: true
          description: >-
            First 12 characters of the key for identification.
            Includes the environment prefix (e.g., "lv_live_a3x9").
        kind:
          type: string
          enum: [api_key, enrollment_token, device]
          readOnly: true
          description: >-
            The credential kind: a durable `api_key`, a one-shot
            `enrollment_token` (see `target` and `claims`), or a
            system-minted per-device `device` credential. Unknown future
            kind values may appear as the credential model grows; clients
            must tolerate values outside this enum.
        target:
          type: string
          enum: [agent, connector]
          readOnly: true
          description: >-
            What a `kind=enrollment_token` credential enrolls. Present
            only on enrollment tokens.
        claims:
          type: array
          items:
            $ref: '#/components/schemas/CredentialClaim'
          readOnly: true
          description: >-
            Resource claims bound to a `kind=enrollment_token` credential.
            Present only on bound enrollment tokens (always exactly one
            entry today).
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
          description: >-
            Permissions granted to this credential (server-assigned for
            enrollment tokens and device credentials).
            Returned in alphabetical order for deterministic responses.
        status:
          type: string
          enum: [active, revoked]
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: >-
            Timestamp of the last update to name or scopes.
            Omitted if the key has never been updated.
        last_used_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          description: >-
            Expiration timestamp for enrollment tokens and other expiring
            credentials. Omitted for non-expiring credentials.

    CreateApiKeyData:
      allOf:
        - $ref: '#/components/schemas/ApiKeyData'
        - type: object
          properties:
            api_key:
              type: string
              readOnly: true
              description: |
                The plaintext API key. Store it securely. GET and list operations
                do not return it. An identical creation retry can recover it within
                the documented idempotency replay window.

    CreateApiKeyResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CreateApiKeyData'
        meta:
          $ref: '#/components/schemas/Meta'

    ApiKeyResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ApiKeyData'
        meta:
          $ref: '#/components/schemas/Meta'

    ApiKeyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyData'
        meta:
          $ref: '#/components/schemas/ListMeta'

    CreateExternalIdentityBindingRequest:
      type: object
      additionalProperties: false
      required:
        - provider
        - external_id
      properties:
        provider:
          type: string
          enum: [slack, discord, teams]
          description: |
            Provider that owns the external identity: Slack, Discord,
            or Microsoft Teams. Unknown values fail request validation.
            Every provider requires its own configured confidential OAuth
            client; a request whose verified token presents a different
            client, or whose provider is not configured, fails with 403.
        external_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[\x21-\x22\x24-\x7E]+$'
          description: |
            Provider-specific stable identifier (Slack `team_id`,
            Discord `guild_id`, or the canonical Microsoft Entra tenant
            ID for Teams). qURL treats the value as opaque; canonicalization
            is the trusted provider flow's responsibility. Only visible ASCII is
            allowed, and `#` is not allowed.
        display_name:
          type: string
          maxLength: 100
          description: |
            Optional human-readable label for audit/display. An explicit
            rotation that omits this field preserves the current label.
        rotate_existing:
          type: boolean
          default: false
          description: |
            Explicitly allow this request to revoke and replace a same-owner
            binding credential. Omit or set false for first-install-only
            behavior.

    ExternalIdentityBindingApiKey:
      type: object
      properties:
        key_id:
          type: string
          pattern: '^key_[A-Za-z0-9]{12}$'
          readOnly: true
        key_prefix:
          type: string
          readOnly: true
          description: First 12 characters of the key for identification.
        plaintext:
          type: string
          readOnly: true
          description: |
            The plaintext API key. Returned only once at creation
            time — store it securely.

    CreateExternalIdentityBindingResponse:
      type: object
      properties:
        binding_id:
          type: string
          pattern: '^eib_[A-Za-z0-9]{11}$'
          readOnly: true
          description: Unique binding identifier.
        provider:
          type: string
          readOnly: true
          description: Provider that owns the external identity.
        external_id:
          type: string
          readOnly: true
          description: Opaque provider-specific stable identifier.
        display_name:
          type: string
          readOnly: true
        api_key:
          $ref: '#/components/schemas/ExternalIdentityBindingApiKey'
        scopes:
          type: array
          items:
            type: string
          description: Scopes the minted API key was issued with.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    # --- Access Codes ---

    RedeemAccessCodeRequest:
      type: object
      # Declared for contract hygiene and for the spec-wide invariant, but note
      # this is the one write route mounted on the root engine rather than the
      # /v1 group (router.go), so the OpenAPI validator does not run on it and
      # this line has no runtime effect today. Moving the route under /v1 is
      # what would arm it.
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          description: The plaintext access code to redeem
          pattern: '^ac_[a-z0-9_-]{22}$'
          example: "ac_k8xqp9h2sj9lx7r4abcdef"
        honeypot:
          type: string
          description: Honeypot field for bot detection (must be empty)
          default: ""
        elapsed_ms:
          type: integer
          description: Milliseconds elapsed since page load (for bot detection)
          example: 5200

    RedeemAccessCodeData:
      type: object
      properties:
        redirect_url:
          type: string
          format: uri
          readOnly: true
          description: URL to redirect the user to for resource access
          example: "https://qurl.link/#at_k8xqp9h2sj9lx7r4abcdef"

    RedeemAccessCodeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/RedeemAccessCodeData'
        meta:
          $ref: '#/components/schemas/Meta'

    CreateAccessCodeRequest:
      type: object
      additionalProperties: false
      required:
        - resource_id
      properties:
        resource_id:
          <<: *publicResourceIDSchema
          example: "ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a"
          description: |
            CRID of the resource to share. The field name remains `resource_id`; a public key is also accepted.
        name:
          type: string
          description: Human-readable label for the access code
          maxLength: 100
          example: "Investor Stats Q1"
        max_uses:
          type: integer
          description: Maximum number of times this code can be redeemed (0 = unlimited)
          minimum: 0
          default: 0
          example: 10
        expires_at:
          type: string
          format: date-time
          description: Optional expiration time for the access code

    AccessCodeData:
      type: object
      properties:
        access_code_id:
          type: string
          readOnly: true
          description: Unique identifier for the access code
          pattern: '^acd_[a-z0-9_-]{11}$'
          example: "acd_k8xqp9h2sj9"
        resource_id:
          <<: *publicResourceIDSchema
          description: |
            Public key of the resource this code grants access to.
          example: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA"
        name:
          type: string
          description: Human-readable label
          example: "Investor Stats Q1"
        status:
          type: string
          enum: [active, revoked]
          readOnly: true
          description: Current status of the access code
        max_uses:
          type: integer
          description: Maximum redemptions allowed (0 = unlimited)
          example: 10
        use_count:
          type: integer
          readOnly: true
          description: Number of times this code has been redeemed
          example: 3
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true

    CreateAccessCodeData:
      allOf:
        - $ref: '#/components/schemas/AccessCodeData'
        - type: object
          properties:
            code:
              type: string
              readOnly: true
              description: |
                The plaintext access code. This is returned only once at creation time
                and cannot be retrieved later (it is stored as a SHA-256 hash).
              pattern: '^ac_[a-z0-9_-]{22}$'
              example: "ac_k8xqp9h2sj9lx7r4abcdef"

    CreateAccessCodeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CreateAccessCodeData'
        meta:
          $ref: '#/components/schemas/Meta'

    AccessCodeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccessCodeData'
        meta:
          $ref: '#/components/schemas/Meta'

    # Webhook schemas
    WebhookEventType:
      type: string
      enum:
        - qurl.created
        - qurl.expired
        - qurl.revoked
        - qurl.updated
        - resource.closed
        - qurl.accessed
        - consumer.subscribed
        - qurl.access_denied
        - qurl.token_exhausted
        - quota.warning
        - quota.exceeded
        - token.minted
        - token.expired
        - domain.verified
        - domain.failed
        - domain.deleted
      description: |
        Event names are stable API values. Resource events can use a `qurl.*` name for
        compatibility. Use `crid` to identify the resource and the event's link identifier
        when present. See `WebhookPayload` for fields and delivery rules.

        **Not yet delivered:** `qurl.expired` and `resource.closed`. Subscribing to these
        events does not enable delivery.

        - **qurl.created** - A qURL was created.
        - **qurl.expired** - Not yet delivered. Planned to report expiration at most once per link lifetime, including revoked or consumed links. Extending a link after this event has fired does not cause another event.
        - **qurl.revoked** - A resource or qURL was manually revoked. Individual link events include `qurl_id`. Revoking a `type=transit` resource sends at most 100 individual link events and can be partial. Revoking a URL or tunnel resource sends one resource event. Check resource state to confirm access status. See `WebhookPayload` for `type=transit` privacy rules.
        - **qurl.updated** - Resource metadata or an individual qURL was updated. Individual link updates include `qurl_display_id`.
        - **resource.closed** - Not yet delivered. Planned to report that all links have ended and no active sessions remain.
        - **qurl.accessed** - Access through a qURL succeeded. Resources with `type=transit` omit viewer IP and user agent. See `WebhookPayload`.
        - **consumer.subscribed** - A publisher backend confirmed a contract entitlement. Contains a resource-scoped consumer reference, policy and grant versions, contract and expiry; omits consumer email and credential identity. Deduplicate by resource, consumer_reference and grant_version.
        - **qurl.access_denied** - Access to a qURL was denied by policy
        - **qurl.token_exhausted** - A one-time-use token was fully consumed
        - **quota.warning** - Approaching quota limit (80%)
        - **quota.exceeded** - Quota limit reached, action blocked
        - **token.minted** - A new access token was created
        - **token.expired** - An access token has expired
        - **domain.verified** - A custom domain was successfully verified
        - **domain.failed** - Custom domain verification or cert provisioning failed
        - **domain.deleted** - A custom domain was deleted
    CreateWebhookRequest:
      type: object
      additionalProperties: false
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS endpoint URL to receive webhook events (max 2048 characters)
          example: "https://example.com/webhooks/qurl"
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventType'
          description: Event types to subscribe to
        description:
          type: string
          maxLength: 500
          description: Human-readable description

    UpdateWebhookRequest:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventType'
        description:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [active, disabled]

    WebhookData:
      type: object
      properties:
        webhook_id:
          type: string
          pattern: '^wh_[A-Za-z0-9_-]{16}$'
          readOnly: true
        owner_id:
          type: string
          readOnly: true
          description: |
            Identifier of the account that owns this subscription.
            Bound at create time from the authenticating API key and
            immutable thereafter.
          example: "auth0|user123"
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        status:
          type: string
          enum: [active, disabled]
          readOnly: true
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        failure_count:
          type: integer
          readOnly: true
          description: Consecutive delivery failures
        last_delivery_success:
          type: boolean
          readOnly: true
        last_delivery_time:
          type: integer
          readOnly: true
          description: Unix timestamp of last delivery attempt

    WebhookDataWithSecret:
      allOf:
        - $ref: '#/components/schemas/WebhookData'
        - type: object
          properties:
            secret:
              type: string
              readOnly: true
              description: |
                HMAC signing secret (only returned on create or regenerate).
                Use this to verify the QURL-Signature header on incoming webhooks.
              example: "whsec_K8xQp9H2sJ9Lx7R4AaBbCcDdEeFf..."

    WebhookResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/WebhookData'
        meta:
          $ref: '#/components/schemas/Meta'

    WebhookResponseWithSecret:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/WebhookDataWithSecret'
        meta:
          $ref: '#/components/schemas/Meta'

    WebhookListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookData'
        meta:
          $ref: '#/components/schemas/ListMeta'

    WebhookDeliveryData:
      type: object
      properties:
        delivery_id:
          type: string
          pattern: '^wd_[A-Za-z0-9_-]{16}$'
          readOnly: true
        webhook_id:
          type: string
          readOnly: true
        event_type:
          $ref: '#/components/schemas/WebhookEventType'
        status:
          type: string
          enum: [pending, success, failed, retrying, abandoned]
          description: Retrying includes durable deliveries waiting for their first attempt or held by an active attempt lease.
          readOnly: true
        response_code:
          type: integer
          readOnly: true
        response_body:
          type: string
          readOnly: true
          description: Response body limited to 4096 bytes plus a truncation marker.
        error_message:
          type: string
          readOnly: true
        duration_ms:
          type: integer
          readOnly: true
        retry_count:
          type: integer
          description: Persisted attempt claims, including the first attempt. Older delivery rows counted failed attempts.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          description: Time the most recent delivery attempt completed, including an attempt that will be retried.
          type: string
          format: date-time
          readOnly: true

    WebhookDeliveryListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryData'
        meta:
          $ref: '#/components/schemas/ListMeta'

    WebhookEventTypeInfo:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/WebhookEventType'
        category:
          type: string
          enum: [resource, access, quota, token]
        description:
          type: string

    WebhookEventTypesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventTypeInfo'
        meta:
          $ref: '#/components/schemas/Meta'

    WebhookPayload:
      type: object
      description: |
        Event sent to your webhook endpoint. Verify `QURL-Signature` before processing it.
        See `WebhookEventType` for availability; subscribing to a future event does not enable delivery.

        For `type=transit` resources, the installer and viewer can be
        different people. The following rules protect viewer and uploaded-content data:

        | Event | Delivery for `type=transit` |
        |---|---|
        | `qurl.accessed` | Delivered without `src_ip` and `user_agent`. |
        | `qurl.revoked` | Delivered with `qurl_id` and `resource_id`; omits target URL, description, tags, and filename. |
        | `qurl.expired` | Payload contract includes `qurl_id`, `resource_id`, and `expires_at`; delivery begins in a future release. |
        | `resource.closed` | Payload contract includes `resource_id`; delivery begins in a future release. |
        | All other events | Not delivered, including `qurl.created`, `qurl.updated`, and `token.minted`. |

        Events with `resource_id` also include `crid` when available. Prefer `crid` to
        identify the resource; retain `qurl_id` to identify one link.

        Revoking a URL or tunnel resource sends one resource-scoped `qurl.revoked` event.
        Revoking a `type=transit` resource sends at most 100 individual events for
        active links. No active links means no individual revoke events. Delivery can
        be partial due to the cap, degraded operation, or publish failures. Concurrent
        changes can duplicate or omit events. A revoked parent
        can leave child link records with `status: active`; the links still cannot grant
        access. Check the current resource state when you need to confirm access status.
        See `data` for fields and payload examples.
      properties:
        id:
          type: string
          description: Unique event ID
        type:
          $ref: '#/components/schemas/WebhookEventType'
        owner_id:
          type: string
          description: Owner who triggered the event
        timestamp:
          type: string
          format: date-time
        api_version:
          type: string
          description: API version (e.g., "2024-01-01")
        data:
          type: object
          additionalProperties: true
          description: |
            Fields depend on the event and resource type. Events with `resource_id` also
            include `crid` when available. Use the CRID for later resource requests; the
            `resource_id` value is a compatibility public key.

            ### `qurl.accessed`

            | Field | Meaning |
            |---|---|
            | `qurl_id` | The link used for access. |
            | `resource_id` | The protected resource's public key. |
            | `access_count` | Count after this access. Concurrent events can show the same count; use the resource's current link summaries to check later state. |
            | `consumed` | Whether this access consumed a one-time link. |
            | `src_ip`, `user_agent` | Viewer information. Omitted for integration-owned uploads (`type=transit`). |

            #### `data` shape examples

            URL / qURL Connector resource (full payload):

            ```json
            {
              "qurl_id": "q_3a7f2c8e91b",
              "resource_id": "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA",
              "crid": "ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a",
              "access_count": 3,
              "consumed": false,
              "src_ip": "192.168.1.100",
              "user_agent": "Mozilla/5.0..."
            }
            ```

            Transit (connector-owned) resource — `src_ip` and
            `user_agent` omitted:

            ```json
            {
              "qurl_id": "q_4b8e3d9f02c",
              "resource_id": "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA",
              "crid": "ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a",
              "access_count": 7,
              "consumed": false
            }
            ```

            ### `qurl.updated`

            Resource updates identify the resource with `resource_id` and, when available,
            `crid`. Individual link updates also include `qurl_display_id`, the link's
            qURL ID. Do not require a `qurl_id` field for this event.

            ### `qurl.revoked`

            | Field | When present |
            |---|---|
            | `resource_id` | Always. |
            | `qurl_id` | Individual link revokes and all delivered integration-owned upload revokes. |
            | `qurl_display_id` | Compatibility alias for `qurl_id` on individual URL and qURL Connector link revokes. |
            | `target_url` | Resource-wide URL and qURL Connector revokes. Omitted for integration-owned uploads. |

            Integration-owned upload events also omit description, tags, and filename.
            Revoking a `type=transit` resource can produce a partial set of individual events.
            See `WebhookPayload` for the 100-event limit, concurrent changes, and how to
            check access status after revocation.
      example:
        id: "evt_abc123def456"
        type: "qurl.accessed"
        owner_id: "auth0|user123"
        timestamp: "2024-01-08T10:35:00Z"
        api_version: "2024-01-01"
        data:
          qurl_id: "q_3a7f2c8e91b"
          crid: "ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a"
          access_count: 3
          consumed: false
          src_ip: "192.168.1.100"
          user_agent: "Mozilla/5.0..."

    # Publisher schemas
    #
    # `verified` is computed by the service on every response. It is never
    # stored and no request can set it: keep it out of every request schema.
    # It is true only for an owner on the list of verified owners in the
    # configuration of the service. Do not name that list in a description.
    # The name limits on the response describe what the service emits; the
    # request rules are enforced by the handler so that every rule failure
    # answers with the same `invalid_input` code.
    Publisher:
      type: object
      description: |
        Who published a resource: the owner of the account or device that
        registered it.

        `verified` is `true` only when qURL has confirmed who the publisher is.
        Customers cannot apply for verification yet, so most publishers are not
        verified. `verified: false` means the publisher's `name` is
        self-declared: the publisher chose it, and nobody has confirmed that it
        is accurate. Label it as unverified wherever you show it, and do not
        treat it as proof of who published a resource. If `verified` is ever
        missing, treat it as `false`.
      required:
        - verified
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: "Acme Docs"
          description: |
            The name the publisher chose for itself. Omitted when the
            publisher has not set one; never an empty string. It is
            self-declared unless `verified` is `true`. Display it as untrusted
            text: quote it and escape it rather than printing it raw.
        verified:
          type: boolean
          example: false
          description: |
            Whether qURL has confirmed who this publisher is. qURL decides
            it; a publisher cannot set it. `false` means the name is
            self-declared and has not been confirmed.
      example:
        name: "Acme Docs"
        verified: false

    PublisherResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Publisher'
        meta:
          $ref: '#/components/schemas/Meta'

    UpdatePublisherRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          example: "Acme Docs"
          description: |
            The publisher name to show, or an empty string to remove it. See the
            operation description for the rules a name must follow.


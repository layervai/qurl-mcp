  /v1/resources/{id}/access-requests:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Resources]
      summary: List pending access requests for a resource
      description: |
        Lists the people who asked for access to this private resource and are waiting for
        your decision, oldest first. A resource holds at most 20 pending requests, so the
        list is never paged. A request waits for 7 days and is then dropped.

        Someone who opens the resource's link without access can ask for it when the
        resource has `access_requests` on. They see a 6-digit code and give it to you.
        You approve with that code
        (`POST /v1/resources/{id}/access-requests/{request_code}/approve`).

        This list does not return the codes, and no other response of this API returns
        a pending code. The code is what ties a request to a person: you learn it only
        from the person who asked. The `name` is what the requester typed and proves
        nothing, so a list that showed the codes would let anyone approve by name.

        To refuse a request from this list, deny it by its `device_id`
        (`DELETE /v1/resources/{id}/access-requests/{device_id}`).
      operationId: listResourceAccessRequests
      security:
        - bearerAuth: [qurl:read]
      responses:
        '200':
          description: Pending access requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestListResponse'
              example:
                data:
                  - name: "Ada Lovelace"
                    device_id: "k3wp-x2aq-7mzn-4tby"
                    requested_at: "2026-10-06T15:20:00Z"
                    expires_at: "2026-10-13T15:20:00Z"
                meta:
                  request_id: "req_abc123"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/resources/{id}/access-requests/{device_id}:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/AccessRequestDeviceId'
    delete:
      tags: [Resources]
      summary: Deny an access request
      description: |
        Removes a pending access request. The requester is not told and can ask again.

        Name the request by its `device_id`, as the list shows it. Every pending request
        of this resource from that device is removed. A request of the same device for
        another resource is not touched.

        If the requester gave you their 6-digit code and you refuse them, you can send
        the code in place of the `device_id`. The two cannot be confused: a `device_id`
        has the form `xxxx-xxxx-xxxx-xxxx`, and a code is six digits.

        A `device_id` or a code that names no pending request of this resource returns
        `404`: it was never issued, the request expired, or it was already approved or
        denied. A value that is neither a `device_id` nor a code returns the same `404`.

        A code that names no pending request counts as a wrong code, in the same count as
        a wrong code on approve. After 5 wrong codes for this resource within one hour, a
        denial by code returns `429 rate_limited` until `Retry-After` has passed. A denial
        by `device_id` is never counted and never limited.

        On `503`, nothing was changed. Wait for `Retry-After`, then send the request again.
      operationId: denyAccessRequest
      security:
        - bearerAuth: [qurl:write]
      responses:
        '204':
          description: Request denied
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyWrongCodes'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/resources/{id}/access-requests/{request_code}/approve:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/AccessRequestCode'
    post:
      tags: [Resources]
      summary: Approve an access request
      description: |
        Approves a pending access request. The requester's passkey can then open this
        resource, and the request leaves the pending list. Both happen together or not at
        all. The approved passkey appears in the resource's `allowed_passkeys`.

        You approve with the 6-digit code that the requester gives you, and with nothing
        else: a `device_id` does not approve. No response of this API returns the code of
        a pending request, so that the person you approve is the person who told you the
        code, and not a name in a list.

        The request has no body. An empty JSON object is accepted too.

        A code that names no pending request of this resource returns `404`: it was never
        issued, the request expired, or it was already approved or denied. A second approval
        of the same code therefore returns `404`; read the resource to see the result.

        Wrong codes are limited, so that a code cannot be found by trying. A resource takes
        at most 5 wrong codes within one hour, counted over approvals and denials by code
        together. After that, every request that names a code for this resource returns
        `429 rate_limited`, a correct code included, until the oldest of those wrong codes
        is one hour old. `Retry-After` gives the seconds to wait. A correct code does not
        clear the count. Do not try codes: ask the requester for the code on their screen.

        A code that is not six digits is not counted. A code sent while the resource has no
        pending request is not counted either. A `404` for a code that was already used
        does count, while another request is pending.

        A resource can hold 256 approved passkeys. When it is full, the request returns
        `400 invalid_input`; remove one with
        `DELETE /v1/resources/{id}/allowed-passkeys/{device_id}` first.

        Approval works for a request that was made before `access_requests` was turned off.

        On `503`, nothing was changed. Wait for `Retry-After`, then send the request again.
      operationId: approveAccessRequest
      security:
        - bearerAuth: [qurl:write]
      responses:
        '200':
          description: The approved passkey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowedPasskeyResponse'
              example:
                data:
                  device_id: "k3wp-x2aq-7mzn-4tby"
                  name: "Ada Lovelace"
                  approved_at: "2026-10-06T16:02:11Z"
                meta:
                  request_id: "req_abc123"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyWrongCodes'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/resources/{id}/allowed-passkeys/{device_id}:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
      - $ref: '#/components/parameters/ResourceId'
      - name: device_id
        in: path
        required: true
        description: The `device_id` of the approved passkey, from the resource's `allowed_passkeys`.
        schema:
          type: string
          maxLength: 64
    delete:
      tags: [Resources]
      summary: Remove an approved passkey
      description: |
        Removes an approved passkey from the resource. That passkey can no longer get a new
        link. A link it already has keeps working until it expires. The person can ask for
        access again if `access_requests` is on.

        A `device_id` that no approved passkey of this resource has returns `404`.

        On `503`, nothing was changed. Wait for `Retry-After`, then send the request again.
      operationId: removeAllowedPasskey
      security:
        - bearerAuth: [qurl:write]
      responses:
        '204':
          description: Passkey removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/access-requests:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    get:
      tags: [Resources]
      summary: List pending access requests for all your resources
      description: |
        Lists the pending access requests of all your resources, oldest first. Each row
        names its resource by `resource_id` and `crid`; use the `crid` to approve or deny
        the request.

        Like the list of one resource, this list does not return the 6-digit codes. You
        approve with the code the requester gives you, and deny by `device_id`.

        The list returns at most 1,000 requests and is not paged.

        `meta.has_more` tells you whether the list is complete. `false` means that it
        holds every pending request you have. `true` means that it may be incomplete:
        either you have more than 1,000 pending requests, or the service stopped reading
        before it had looked at all of your resources. In the second case no request has
        to be missing, so do not read `true` as a count. When it is `true`, a request that
        is not in the list can be older than the ones that are.

        The list of one resource (`GET /v1/resources/{id}/access-requests`) is always
        complete.
      operationId: listAccessRequests
      security:
        - bearerAuth: [qurl:read]
      responses:
        '200':
          description: Pending access requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerAccessRequestListResponse'
              example:
                data:
                  - name: "Ada Lovelace"
                    device_id: "k3wp-x2aq-7mzn-4tby"
                    requested_at: "2026-10-06T15:20:00Z"
                    expires_at: "2026-10-13T15:20:00Z"
                    resource_id: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA"
                    crid: "ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a"
                meta:
                  request_id: "req_abc123"
                  page_size: 1
                  has_more: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/resources/{id}/qurls:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags:
        - Resources
      summary: List qURLs for a resource
      description: |
        Lists the qURLs for the CRID in `{id}`. Use this operation for the complete list;
        resource detail responses contain at most 100 link summaries.

        Pass `meta.next_cursor` as `cursor` until `meta.has_more` is false. A short page
        does not mean the list is complete. Keep all request parameters unchanged while paging.

        Results have no guaranteed order, and active links do not come first. This operation
        has no filters or sort option; apply those in your client. On an unchanged result set,
        each link appears once. Links created or revoked while you page can be missed or move
        between pages; start again when you need a current list.

        Integration-owned uploads (`type=transit`) return `404` here. Their link lists are
        not available through this management operation.
      operationId: listResourceQurls
      security:
        - bearerAuth: [qurl:read]
      parameters:
        - name: limit
          in: query
          description: Maximum number of results to return (1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: |
            Pagination cursor from a previous response's
            `meta.next_cursor`. Omit to fetch the first page.
          schema:
            type: string
      responses:
        '200':
          description: List of qURLs for the resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QurlSummaryListResponse'
              example:
                data:
                  - qurl_id: "q_a1b2c3d4e5f"
                    label: "Alice from Acme"
                    status: "active"
                    one_time_use: false
                    max_sessions: 5
                    session_duration: 3600
                    use_count: 2
                    qurl_site: "https://r-ojpxe33vorsw63tmpeydc.qurl.site"
                    created_at: "2024-01-08T10:30:00Z"
                    expires_at: "2024-01-15T10:30:00Z"
                meta:
                  request_id: "req_abc123"
                  page_size: 1
                  has_more: true
                  next_cursor: "eyJ0b2tlbl9oYXNoIjoiLi4uIn0.sig"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: |
            The resource is closed and this operation is no longer available.
            Use an active resource. The response can include `meta.tombstone` with retained
            resource metadata; clients must also handle its absence.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Resources
      summary: Create a qURL for an existing resource
      description: |
        Creates a new qURL access link for the resource identified by its CRID in `{id}`.
        Use this endpoint when you already have a CRID; use
        `POST /v1/qurls` to create a qURL from a `target_url` directly.

        A request body is required, but every field inside it is
        optional — to mint with the owner's plan defaults, send `{}`.


        Errors:

          - 404 `resource_not_found` if no resource with this ID exists.
          - 403 `access_denied` if the resource exists but belongs to
            another owner.
          - 403 `connector_disabled` if this is a qURL Connector resource
            (`type: tunnel` on the wire) and qURL Connector operations are
            currently unavailable.
          - 400 `revoked` if the resource is revoked.
          - 400 `invalid_input` in two cases. Read `detail` to tell them
            apart. The resource has passed its expiration: set a later
            expiration with `PATCH /v1/qurls/{id}` first. Or a field value is
            malformed or out of range (e.g. a `session_duration` like `5x`).
          - 400 `validation_error` if `target_path` is JSON null or not a
            string.
          - 400 `invalid_target_path` if a string `target_path` is empty,
            longer than 2048 UTF-8 bytes, malformed, or used with a stored
            resource that is not a qURL Connector resource.
          - 400 `invalid_session_duration` if `session_duration` exceeds
            the resource's cap.
      operationId: createQurlForResource
      security:
        - bearerAuth: [qurl:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      # required: true matches wire-level reality — oapi-codegen's strict
      # server binds the request body unconditionally, so a literal empty
      # body returns 400 at the bind step. Accept-all-defaults is still
      # one keystroke: send `{}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQurlForResourceRequest'
            example:
              expires_in: "1h"
              max_sessions: 5
              access_policy:
                ip_allowlist: ["192.168.1.0/24"]
                geo_allowlist: ["US", "CA"]
              label: "Alice from Acme"
      responses:
        '201':
          description: qURL created successfully
          headers:
            Location:
              description: API URL of the protected resource; share the response body's `qurl_link` with recipients
              schema:
                type: string
                format: uri
            Idempotency-Replayed:
              description: Legacy header. Check X-Idempotency-Replayed for the value "true" to identify a replay.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateQurlResponse'
              example:
                data:
                  crid: ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a
                  qurl_link: https://qurl.link/#at_k8xqp9h2sj9lx7r4abcdef
                  qurl_site: https://r-ojpxe33vorsw63tmpeydc.qurl.site
                  expires_at: '2024-01-15T10:30:00Z'
                  qurl_id: q_3a7f2c8e91b
                meta:
                  request_id: req_abc123
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        # Monthly data-transfer refusal can apply to existing-resource minting.
        '403':
          $ref: '#/components/responses/CreateQurlForResourceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: |
            The resource is closed and this operation is no longer available.
            Use an active resource. The response can include `meta.tombstone` with retained
            resource metadata; clients must also handle its absence.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/resources/{id}/qurls/{qurl_id}:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
      - $ref: '#/components/parameters/ResourceId'
      - name: qurl_id
        in: path
        required: true
        description: qURL display ID (q_ + 11 hex chars)
        schema:
          type: string
          pattern: '^q_[0-9a-f]{11}$'
    delete:
      tags:
        - Resources
      summary: Revoke a specific qURL
      description: |
        Revokes a specific qURL token and its live sessions, including sessions
        from consumed or expired links. Repeated revocation succeeds and completes
        any unfinished session cleanup. Other qURLs on the same resource are not affected.
        A 503 means revocation is committed but enforcement is pending. Retry
        the same delete after Retry-After to confirm all active caches were cleared.
      operationId: revokeResourceQurl
      security:
        - bearerAuth: [qurl:write]
      responses:
        '204':
          description: qURL revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: qURL status does not support revocation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags:
        - Resources
      summary: Update a specific qURL
      description: |
        Update expiry, label, access policy, max_sessions, or session_duration on a specific qURL token.
        The qURL must be active: a consumed, revoked, or expired qURL returns `409 revoked`.
        At least one field must be provided.
        Unlinked anonymous devices cannot set expiry more than 24 hours from now.
        An oversized extension returns `400 invalid_request`; an unavailable owner
        quota returns `503 service_unavailable` and can be retried.

        Extending an active qURL keeps the same shared URL. `extend_by` adds to its
        currently enforced expiry; `expires_at` sets an absolute expiry. A concurrent
        expiry or session-policy change returns `409 conflict`; read the current values before retrying.
        Signed qURLs do not evaluate `access_policy`, so changing it returns
        `409 qurl_update_unsupported`; an empty `access_policy` clears a policy stored earlier, and resending the
        stored policy as returned (in any list order) is accepted.
        Changes to `expires_at`, `max_sessions`, and `session_duration` apply to new
        sessions; sessions that are already open keep their original lifetime. To end
        them, terminate them with `DELETE /v1/resources/{id}/sessions` or revoke the qURL.
        If the request fails with a 5xx, the update may already be in effect.
        Read the qURL back to see the enforced values. Repeating `extend_by` adds
        the duration again; retry an ambiguous extension with `expires_at` set to
        the intended target. If the link expires or is consumed first, PATCH
        returns 409 and does not apply new changes; reads still show its enforced
        expiry and limits.
        On a signed qURL link, any update also corrects a stored `expires_at`,
        `max_sessions`, or `session_duration` that differs from the value in effect,
        even if the request omits that field, and reports the corrected value.
      operationId: updateResourceQurl
      security:
        - bearerAuth: [qurl:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQurlTokenRequest'
      responses:
        '200':
          description: qURL updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QurlSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: qURL is not active (`revoked`), its expiry or session policy changed concurrently (`conflict`), or the link cannot accept the change (`qurl_update_unsupported`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/resources/{id}/share:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/AccountResourceOwner'
    post:
      tags:
        - Resources
      summary: "Share a resource by CRID"
      description: |
        Creates a fresh access link for a resource. Put its CRID in `id`.
        This API creates a link for the resource's owner or, for a private resource,
        for a device the publisher allowed. Any other caller gets the same
        `404 resource_not_found` as for a CRID that names nothing.
        A CRID alone grants no access. Every request needs the `qurl:resolve` scope.
        Send `{}` to use the defaults. Set `ttl_seconds` for the link lifetime
        or `session_duration` for the lifetime of each admitted session.
        Link expiry does not end an already-admitted session.

        The response contains the secret link in `qurl`. Share it only with the intended
        recipient. Save `qurl_id` to revoke this link with
        `DELETE /v1/resources/{id}/qurls/{qurl_id}` using the resource CRID and owner credentials.
        The resource owner retains control of the resource and its links.

        Each call creates a new link. This operation does not promise idempotent replay;
        a retry can create another link. Links expire on their own. Request-rate limits
        and the resource owner's enforced monthly data-transfer allowance apply; there is no
        per-resource link quantity cap.

        Requested lifetimes are shortened as needed to fit the 30-day platform maximum
        and the resource's expiration. Unlinked anonymous devices are also capped at 24 hours.
        Check `expires_at` and `expires_in_seconds` for
        the effective lifetime. Later GET requests do not return the secret link.

        A successful response also says who published the resource and when the
        resource was created: `publisher` and `resource_created_at`. The second is the
        age of the resource, not of this link, which was minted just now.
        `publisher.verified` is `true` only when qURL has confirmed who the publisher is.
        Customers cannot apply for verification yet, so most publishers are not verified.
        An unverified publisher's `name` is
        self-declared: the publisher chose it and nobody has confirmed it. Show it as
        unverified, and do not treat it as proof of who published the resource.
        These two fields are reported by the service; verifying a CRID or a link does
        not verify them. Error responses never include them.

        | Status and code | What to do |
        |---|---|
        | `503 service_unavailable` | Temporary access links are unavailable in this environment. |
        | `401 unauthorized` | Send valid credentials. |
        | `403 insufficient_scope` | Use a credential with qurl:resolve scope. |
        | `503 connector_stopped` | Start the Connector before sharing. |
        | `404 resource_not_found` | Check the CRID and the credential. Missing and retired resources return this error, and so does every resource this caller cannot create a link for. |
        | `410` | The resource is closed; use a live resource. |
        | `400 revoked` | The resource is revoked; use a live resource. |
        | `400 invalid_input` | The resource has passed its expiration; its owner can set a later one. |
        | `403 quota_exceeded` | Resolve the monthly data-transfer limit before retrying. |
      operationId: shareResource
      security:
        - bearerAuth: [qurl:resolve]
      # required: true matches the wire-level posture of the sibling
      # POST /v1/resources/{id}/qurls: oapi-codegen's strict server binds
      # the request body unconditionally, so a literal empty body returns
      # 400 at the bind step. Accept-all-defaults is one keystroke: `{}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareResourceRequest'
            example:
              ttl_seconds: 300
      responses:
        '200':
          description: |
            A fresh share link was minted for the resource. The `qurl`
            value is returned once and never retrievable again — capture
            it now, along with the `qurl_id` that revokes it. `publisher`
            and `resource_created_at` describe the resource's publisher and
            when the resource was created (not when this link was minted);
            `publisher.verified: false` means the publisher's name is
            self-declared and has not been confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareResourceResponse'
              example:
                data:
                  qurl_id: "q_a1b2c3d4e5f"
                  qurl: "https://qurl.link/#qv2t1.1.1.1.Y2xhaW1zLWV4YW1wbGU.c2VjcmV0LWV4YW1wbGU.c2lnbmF0dXJlLWV4YW1wbGU"
                  crid: "ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a"
                  type: "url"
                  expires_at: "2026-03-09T15:35:00Z"
                  expires_in_seconds: 300
                  single_use: false
                  resource_created_at: "2026-03-01T09:00:00Z"
                  publisher:
                    name: "Acme Docs"
                    verified: false
                meta:
                  request_id: "req_abc123"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: |
            The resource is closed and this operation is no longer available.
            Use an active resource. No retained resource metadata is disclosed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: |
            Temporary access links cannot be minted now. This response is
            returned with `service_unavailable` when the environment has not
            enabled temporary links, or with `connector_stopped` when the
            addressed qURL Connector is stopped. Clients must use the code to
            distinguish a retryable environment condition from the required
            owner action.
          headers:
            Retry-After:
              description: |
                Advisory delay for `service_unavailable` (seconds).
                `connector_stopped` requires the owner to start the Connector.
              schema:
                type: integer
                example: 60
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/resources/{id}/sessions:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    get:
      tags:
        - Sessions
      operationId: listResourceSessions
      summary: List active sessions for a resource
      description: |
        Returns active access sessions for the specified resource. Use `paged=true` for bounded pages. `user_agent` and
        `last_seen_at` are omitted when they were not recorded for a session, and
        `qurl_id` is omitted when the qURL's record cannot be read.
        Continue with `meta.next_cursor` until `meta.has_more` is false, even when
        a page is empty. A paged request examines at most 100 stored sessions.
        Paging also examines past sessions, so the number of requests depends on
        session history, not just the number of active visitors.
        Without `paged=true` or a cursor, the operation collects every page within
        a 28-second total budget. Failure never reports partial work as full success.
      security:
        - bearerAuth: [qurl:read]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: paged
          in: query
          description: Opt in to bounded pages. Omit for the full legacy response.
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          description: Continuation from the previous successful page. Retry the same cursor after failure.
          schema:
            type: string
            maxLength: 1024
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Sessions
      operationId: terminateAllResourceSessions
      summary: Terminate all active sessions for a resource
      description: |
        Terminates sessions; use `paged=true` to process one bounded page
        and returns how many were terminated. A session opened at the same time can survive;
        revoke the qURL to stop new sessions. Sessions opened through delegated qURLs are managed
        with `DELETE /v1/delegated-qurls/{qurl_id}` instead. This ends current visits; it does not revoke the
        resource's qURLs. A visitor can open a qURL again unless it is single-use, has
        reached its `max_sessions`, or has expired, and terminating a session does not free
        a `max_sessions` slot. To stop future access through a qURL, revoke it with
        `DELETE /v1/resources/{id}/qurls/{qurl_id}`.

        If the request fails with a 5xx, some sessions may already be terminated; the
        request is safe to repeat.

        Termination of sessions opened through signed qURL links also sends a session revocation to NHP. Success confirms
        the configured NHP delivery contract; delivery failures must be retried. A visitor who also has a session open through another
        of this resource's qURLs from the same network address can keep access through
        that session; terminate all sessions or revoke the qURLs to be certain.
        Continue with `meta.next_cursor` until `meta.has_more` is false, even when
        a page is empty. A paged request examines at most 8 stored sessions.
        Paging also examines past sessions, so the number of requests depends on
        session history, not just the number of active visitors.
        Without `paged=true` or a cursor, the operation collects every page within
        a 28-second total budget. Failure never reports partial work as full success. If an unpaged request fails,
        retry with `paged=true` and follow continuations to give each page its own budget.
      security:
        - bearerAuth: [qurl:write]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: paged
          in: query
          description: Opt in to bounded pages. Omit for the full legacy response.
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          description: Continuation from the previous successful page. Retry the same cursor after failure.
          schema:
            type: string
            maxLength: 1024
      responses:
        '200':
          description: Sessions terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTerminateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/resources/{id}/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    delete:
      tags:
        - Sessions
      operationId: terminateResourceSession
      summary: Terminate a specific session
      description: |
        Terminates a specific active session and confirms NHP delivery for signed qURL links. Terminating an already ended
        session succeeds; a session whose record has aged out returns 404. The qURL that opened the session stays active; see
        `DELETE /v1/resources/{id}/sessions` for what a visitor can do next and when the
        termination takes effect.
      security:
        - bearerAuth: [qurl:write]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: session_id
          in: path
          required: true
          description: Session ID to terminate
          schema:
            type: string
      responses:
        '204':
          description: Session terminated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/quota:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    get:
      tags:
        - Quota
      summary: Get quota information
      description: Retrieves usage quota for the authenticated user.
      operationId: getQuota
      security:
        - bearerAuth: [qurl:read]
      responses:
        '200':
          description: Quota information
          headers:
            ETag:
              description: Entity tag for caching
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaResponse'
              example:
                data:
                  plan: "growth"
                  period_start: "2024-01-01T00:00:00Z"
                  period_end: "2024-02-01T00:00:00Z"
                  rate_limits:
                    create_per_minute: 200
                    create_per_hour: 10000
                    list_per_minute: 120
                    resolve_per_minute: 120
                    max_qurls: -1
                    max_active_resources: 1000
                    max_active_qurls: 1000
                    max_tokens_per_qurl: -1
                    max_data_transfer_bytes: -1
                    max_expiry_seconds: 2592000
                  usage:
                    qurls_created: 150
                    active_resources: 45
                    active_resources_percent: 4.5
                    active_qurls: 45
                    active_qurls_percent: 4.5
                    data_transfer_bytes: 4294967296
                    total_accesses: 1250
                meta:
                  request_id: "req_abc123"
        '304':
          description: Not Modified (ETag match)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/me:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    get:
      tags:
        - Identity
      summary: Get the authenticated identity
      description: |
        Echoes who the caller is authenticated as, derived entirely from the
        presented credential — no account, billing, or usage state is
        consulted (see `GET /v1/quota` for plan and usage). Use it to
        validate a credential and discover its identity: the owning
        account, the authentication method, and — for API-key callers —
        the key's identifier, kind, granted scopes, and expiration.

        Any valid credential may ask who it is: the endpoint accepts every
        scope rather than requiring a specific one. One-shot enrollment
        tokens and device credentials are restricted to their enrollment
        and connector operations and cannot call this endpoint.

        A frozen account receives 403 with error code `account_frozen` —
        itself an informative answer about the account's standing.
      operationId: getMe
      security:
        - bearerAuth: [qurl:read]
        - bearerAuth: [qurl:write]
        - bearerAuth: [qurl:resolve]
        - bearerAuth: [qurl:agent]
      responses:
        '200':
          description: The authenticated identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              examples:
                apiKeyCaller:
                  summary: API-key caller
                  value:
                    data:
                      owner_id: "auth0|user123"
                      auth_type: "api_key"
                      api_key:
                        key_id: "key_abc123def456"
                        key_prefix: "lv_live_a3x9"
                        kind: "api_key"
                        scopes: ["qurl:read", "qurl:write"]
                    meta:
                      request_id: "req_abc123"
                jwtCaller:
                  summary: JWT (console) caller
                  value:
                    data:
                      owner_id: "auth0|user123"
                      auth_type: "jwt"
                    meta:
                      request_id: "req_abc123"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # The AccountResourceOwner parameter is deliberate: the account a device is
  # linked to must be able to read and correct that device's publisher name.
  # PATCH (not PUT) is deliberate: it advances the owner's change version, so
  # conditional resource reads never answer 304 with the previous publisher.
  /v1/me/publisher:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    get:
      tags:
        - Publisher
      summary: Get your publisher profile
      description: |
        Returns your publisher profile: the name people see when they request a
        link to one of your resources, and whether qURL has verified you.

        `verified` is `true` only when qURL has confirmed who you are. You cannot
        apply for verification yet, and no request can set it, so expect `false`.
        While `verified` is `false`, `name` is self-declared: you chose it and
        nobody has confirmed it. `name` is omitted when you have not set one.

        A stored name that no longer satisfies the name rules is withheld and
        reads as no name; set it again to see which rule it breaks.

        Any credential for the owner works: an account access token, an account
        API key, or a registered device credential. Every device has its own
        profile, separate from the account it is linked to. To read a linked
        device's profile from the account, sign in with the account and send
        the device owner in `X-QURL-Owner`. A frozen account receives 403 with
        error code `account_frozen`.
      operationId: getPublisher
      security:
        - bearerAuth: [qurl:read]
      responses:
        '200':
          description: Your publisher profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherResponse'
              examples:
                named:
                  summary: A name is set
                  value:
                    data:
                      name: "Acme Docs"
                      verified: false
                    meta:
                      request_id: "req_abc123"
                unnamed:
                  summary: No name is set
                  value:
                    data:
                      verified: false
                    meta:
                      request_id: "req_abc123"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags:
        - Publisher
      summary: Set or remove your publisher name
      description: |
        Sets the name shown as the publisher of every resource you own. Send an
        empty string to remove it. The name appears on share responses and on
        your own resource reads; a change can take a few minutes to appear
        everywhere.

        A name is optional, and none is set by default. Everyone who requests a
        link to any of your resources sees the same name, so setting one lets
        people tell that those resources come from the same publisher. Leave it
        unset if you do not want your resources connected to each other this way.

        The name is self-declared. Setting it does not verify you: `verified`
        does not change, cannot be sent in this request, and a request that
        includes it is rejected with 400. Unless qURL has verified you, everyone
        who sees your name also sees that it is unverified.

        A name must:

        - be 1 to 64 characters, in Unicode NFC form;
        - use only letters, digits, single spaces, and `. , ' & - _ ( ) / + ! @ # :`;
        - contain at least one letter or digit;
        - attach accents and other combining marks to a letter or digit, with no
          more than 3 on any one character;
        - not start or end with a space;
        - not contain emoji, symbols, quotation marks, characters that look like
          quotation marks or apostrophes, superscript letters, or invisible
          characters;
        - not spell a reserved word: `verified`, `LayerV`, or `qURL`. The check
          ignores letter case, accents, spaces and punctuation, so `Veri-fied`,
          `V E R I F I E D`, `Layer V` and `Q-URL` are refused too. Only a
          publisher that qURL has verified may use these words.

        A name that breaks a rule returns 400 with error code `invalid_input`.
        Sending the same name again is safe and returns the same result.
        A stored name that no longer satisfies these rules is withheld and reads
        as no name; set it again to see which rule it breaks.

        Any credential for the owner works: an account access token, an account
        API key, or a registered device credential. Every device has its own
        profile. If a linked device's name is wrong, sign in with the account,
        send the device owner in `X-QURL-Owner`, and set or remove the name.
        A frozen account receives 403 with error code `account_frozen`.
      operationId: updatePublisher
      security:
        - bearerAuth: [qurl:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublisherRequest'
            examples:
              set:
                summary: Set the name
                value:
                  name: "Acme Docs"
              remove:
                summary: Remove the name
                value:
                  name: ""
      responses:
        '200':
          description: |
            Your updated publisher profile. `verified: false` means the name is
            self-declared and has not been confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherResponse'
              example:
                data:
                  name: "Acme Docs"
                  verified: false
                meta:
                  request_id: "req_abc123"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/usage/current-period:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    get:
      tags:
        - Usage
      summary: Get current billing period usage
      description: |
        Returns usage statistics for the current billing period, including
        recorded qURL creations and link mints (including share links), the
        user's tier, period dates, and a cost estimate for usage-based plans
        (Growth tier). Counts update asynchronously.
        Requires an Auth0 access token (JWT).
      operationId: getUsageCurrentPeriod
      security:
        - bearerAuth: [qurl:read]
      responses:
        '200':
          description: Current period usage information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageCurrentPeriodResponse'
              example:
                data:
                  tier: "growth"
                  period_start: "2026-03-01T00:00:00Z"
                  period_end: "2026-04-01T00:00:00Z"
                  qurls_created: 150
                  unit_price_cents: 10
                  active_resources: 45
                  active_qurls: 45
                  data_transfer_bytes: 4294967296
                  cost_estimate:
                    currency: "usd"
                    amount_cents: 1500
                    description: "150 qURLs x $0.10/qURL"
                meta:
                  request_id: "req_abc123"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/usage/daily:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
    get:
      tags:
        - Usage
      summary: Get daily usage breakdown
      description: |
        Returns a daily breakdown of recorded qURL creations and link mints
        (including share links) for the stored Stripe billing period on paid
        Stripe-backed accounts. Free and non-Stripe Enterprise accounts use
        the current UTC calendar month. Periods are half-open: period_start is
        inclusive and period_end is exclusive. Counts update asynchronously.
        Requires JWT authentication
        (dashboard endpoint).
      operationId: getUsageDaily
      security:
        - bearerAuth: [qurl:read]
      responses:
        '200':
          description: Daily usage breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageDailyResponse'
              example:
                data:
                  tier: "growth"
                  period_start: "2026-03-01T00:00:00Z"
                  period_end: "2026-04-01T00:00:00Z"
                  daily:
                    - date: "2026-03-01"
                      qurls_created: 12
                    - date: "2026-03-02"
                      qurls_created: 8
                    - date: "2026-03-03"
                      qurls_created: 15
                meta:
                  request_id: "req_abc123"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/me/signup-attribution:
    put:
      tags:
        - Customer
      summary: Record signup discovery source
      description: |
        Records how the authenticated user discovered qURL. Available on all plans.
        Requires an Auth0 access token with qurl:write; API keys are not supported.
        The first answer is permanent. Every subsequent submission, including an
        identical retry, returns 409 without changing the saved answer. Read it
        from GET /v1/customer. No customer identifier is accepted in the request.
        Frozen accounts cannot submit an answer.
      operationId: setSignupAttribution
      security:
        - bearerAuth: [qurl:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupAttributionRequest'
      responses:
        '204':
          description: Answer saved; no response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/me/preferences:
    get:
      tags:
        - Customer
      summary: Get your preferences
      description: |
        Returns the signed-in user's preferences. Today that is which optional
        email LayerV may send: product updates, and announcements and promotions.
        Account and security notices are always sent and are not a preference.

        `email.updated_at` and `email.source` are null until a choice has been
        saved. Until then both email preferences read as `false`.

        Requires an Auth0 access token with qurl:read; API keys are not
        supported. A frozen account can still read its preferences.
      operationId: getPreferences
      security:
        - bearerAuth: [qurl:read]
      responses:
        '200':
          description: Your preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
              examples:
                saved:
                  summary: A choice has been saved
                  value:
                    data:
                      email:
                        product_updates: true
                        promotions: false
                        updated_at: "2026-10-06T18:00:00Z"
                        source: dashboard
                    meta:
                      request_id: "req_abc123"
                unset:
                  summary: No choice has been saved
                  value:
                    data:
                      email:
                        product_updates: false
                        promotions: false
                        updated_at: null
                        source: null
                    meta:
                      request_id: "req_abc123"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags:
        - Customer
      summary: Change your preferences
      description: |
        Changes only the preferences you send and returns all of them. A
        preference you leave out keeps its stored value.

        `email.source` says where the choice was made and is stored with the
        time of the change. `dashboard` always saves. `signup_survey` saves only
        while no email choice has been saved yet; afterwards it returns 409 and
        changes nothing, so a survey shown again can never undo a later choice.

        Sending the same `dashboard` change again is safe and returns the same
        result. A repeated `signup_survey` change returns 409, including a retry
        of one whose first response was lost: read the stored choice with GET.
        Requires an Auth0 access token with qurl:write; API keys are not supported. No customer identifier is
        accepted in the request. A frozen account can still change its
        preferences, so it can always opt out of email.
      operationId: updatePreferences
      security:
        - bearerAuth: [qurl:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
            example:
              email:
                promotions: false
                source: dashboard
      responses:
        '200':
          description: Your preferences after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
              example:
                data:
                  email:
                    product_updates: true
                    promotions: false
                    updated_at: "2026-10-06T18:00:00Z"
                    source: dashboard
                meta:
                  request_id: "req_abc123"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'


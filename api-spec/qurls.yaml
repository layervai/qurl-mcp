      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionResponse'
              example:
                data:
                  url: "https://checkout.stripe.com/c/pay/cs_test_..."
                meta:
                  request_id: "req_abc123"
        '400':

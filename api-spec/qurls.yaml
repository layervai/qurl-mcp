      properties:
        data:
          $ref: '#/components/schemas/InvoiceListData'
        meta:
          $ref: '#/components/schemas/ListMeta'

    # Custom Domain schemas
    RegisterDomainRequest:
      type: object
      additionalProperties: false
      required:
        - domain
      properties:
        domain:
          type: string
          description: The custom domain name to register
          example: "secure.example.com"

    DomainData:
      type: object
      properties:
        domain:
          type: string
          readOnly: true
          description: The custom domain name
        status:
          type: string
          enum: [pending_verification, verified, provisioning_tls, active, failed]
          readOnly: true
          description: Current domain status
        verification_token:
          type: string
          readOnly: true
          description: TXT record value for DNS verification
        token_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: |
            When the verification token expires. Omitted for domains created
            before token expiry was introduced (those tokens never expire).
            After expiry, use the regenerate-token endpoint to get a new one.
        acme_cname_target:
          type: string
          readOnly: true
          description: CNAME target for ACME certificate provisioning
        created_at:
          type: string
          format: date-time
          readOnly: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        activated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ready_for_qurls:
          type: boolean
          readOnly: true
          description: Whether this domain is ready to be used with qURLs (status is verified, provisioning_tls, or active)
        dns_records:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/DnsRecord'
          description: Required DNS records for domain setup

    DnsRecord:
      type: object
      properties:
        type:
          type: string
          description: DNS record type (TXT, CNAME)
        name:
          type: string
          description: DNS record name
        value:
          type: string
          description: DNS record value
        verified:
          type: boolean
          description: Whether this record has been verified

    DomainResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DomainData'
        meta:
          $ref: '#/components/schemas/Meta'

    DomainListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DomainData'
        meta:
          $ref: '#/components/schemas/ListMeta'

    CheckDetail:
      type: object
      readOnly: true
      required:
        - verified
      properties:
        verified:
          type: boolean
        error:
          type: string
          description: Error message when the check fails (omitted when verified).
        found:
          type: string
          description: The actual value found in DNS (omitted when nothing was found).

    DomainVerifyData:
      type: object
      properties:
        domain:
          type: string
          readOnly: true
        status:
          type: string
          enum: [pending_verification, verified, provisioning_tls, active, failed]
          readOnly: true
        checks:
          type: object
          readOnly: true
          properties:
            txt:
              $ref: '#/components/schemas/CheckDetail'
            acme_cname:
              $ref: '#/components/schemas/CheckDetail'
            traffic_routing:
              $ref: '#/components/schemas/CheckDetail'

    DomainVerifyResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DomainVerifyData'
        meta:
          $ref: '#/components/schemas/Meta'

    Meta:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          description: Unique request identifier for tracing
        found_existing:
          type: boolean
          description: |
            Present only on 201 responses from `POST /v1/resources`.
            `true` means the returned `resource_id` belonged to an
            already-active resource rather than one this call created.

            Both create paths report it. With `find_or_create=true`, it
            reflects reuse of an existing active qURL Connector resource;
            reuse of a slug after its previous resource was revoked
            returns a fresh `resource_id` with `false`. On a plain URL
            create, it reflects the per-owner, per-target idempotency:
            publishing a `target_url` that already has an active resource
            returns that resource and its existing CRID with `true`, while
            a target whose previous resource was revoked or retired gets a
            brand-new resource with `false`.
        tombstone:
          # Spectral's no-$ref-siblings forbids a description
          # alongside $ref. The referenced TombstoneInfo schema
          # carries the full "present-only-on-410, what-it-means"
          # description in its own description field, so the
          # customer-facing docs render the same copy.
          $ref: '#/components/schemas/TombstoneInfo'

    TombstoneInfo:
      type: object
      description: |
        Read-only metadata for a tombstoned resource. Field-level
        documentation below spells out which resource types each
        field surfaces on.

        **Only present on 410 Gone error responses.** Although
        `Meta.tombstone` is structurally declared on every
        envelope's `Meta`, it is always absent from non-410
        responses — do not branch your client on its presence
        for non-error responses.

        Returned in the `meta.tombstone` field of 410 Gone
        responses on `GET /v1/resources/{id}`,
        `POST /v1/resources/{id}/qurls`, and
        `PATCH /v1/resources/{id}` once the resource's lifecycle
        has closed.

        Tombstoned resources are gated against re-mint and
        will be hard-deleted by the API after a retention
        window (default 90 days). Until hard-delete, this
        metadata remains queryable as the read-only record
        of when the lifecycle closed.
      required:
        - tombstoned_at
      properties:
        tombstoned_at:
          type: string
          format: date-time
          description: When the resource's lifecycle closed.
        final_access_count:
          type: integer
          format: int64
          description: |
            Snapshot of total accesses across all qURLs for this
            resource at tombstone time. **Present only on URL and qURL
            Connector resources** (`type=url` and `type=tunnel` on the wire).
            For connector-owned (`type=transit`) rows the count is stripped per
            the redaction contract,
            since the connector installer is not necessarily the
            uploader and learning "was this viewed" exposes
            sensitive viewer-fact-of-presence about uploads the
            installer didn't make. When present, value is >= 1.
            Absent on URL / qURL Connector rows means either no
            accesses occurred before closure OR the snapshot was
            not taken — these two cases are indistinguishable on
            the wire by design, since both collapse to the same
            "absent" representation.
      example:
        tombstoned_at: "2026-01-01T00:00:00Z"
        final_access_count: 42

    ListMeta:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
        page_size:
          type: integer
          description: Number of items returned
        has_more:
          type: boolean
          description: Whether more items exist
        next_cursor:
          type: string
          description: Cursor for next page (empty if no more pages)

    Error:
      type: object
      description: |
        Error response following RFC 7807 Problem Details for HTTP APIs.
        See: https://datatracker.ietf.org/doc/html/rfc7807
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
          description: |
            URI reference that identifies the problem type (RFC 7807).
            When dereferenced, it should provide human-readable documentation.
          example: "https://api.qurl.link/problems/invalid_request"
        title:
          type: string
          description: |
            Short, human-readable summary of the problem type (RFC 7807).
            This should not change from occurrence to occurrence.
          example: "Invalid Request"
        status:
          type: integer
          description: HTTP status code for this occurrence (RFC 7807).
          example: 400
        detail:
          type: string
          description: |
            Human-readable explanation specific to this occurrence (RFC 7807).
          example: "The target_url field must be a valid HTTPS URL"
        instance:
          type: string
          format: uri-reference
          description: |
            URI reference that identifies the specific occurrence (RFC 7807).
            Typically the request path.
          example: "/v1/qurls"
        code:
          type: string
          description: |
            Machine-readable error code (extension field for backward compatibility).
            Maps to the problem type slug.
          example: "invalid_request"

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            invalid_fields:
              type: object
              additionalProperties:
                type: string
              description: Map of field names to validation error messages
              example:
                target_url: "must be a valid HTTPS URL"
                description: "must not exceed 500 characters"

    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'

    ValidationErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ValidationError'
        meta:
          $ref: '#/components/schemas/Meta'


  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
          examples:
            invalidLimit:
              summary: Invalid limit parameter
              value:
                error:
                  type: "https://api.qurl.link/problems/invalid_request"
                  title: "Invalid Request"
                  status: 400
                  detail: "limit must be an integer between 1 and 100"
                  instance: "/v1/qurls"
                  code: "invalid_request"
                meta:
                  request_id: "abc123def456"
            validationError:
              summary: Multiple field validation errors
              value:
                error:
                  type: "https://api.qurl.link/problems/validation_error"
                  title: "Validation Error"
                  status: 400
                  detail: "One or more fields are invalid"
                  instance: "/v1/qurls"
                  code: "validation_error"
                  invalid_fields:
                    target_url: "must be a valid HTTPS URL"
                    expires_in: "must be between 1m and 30d"
                meta:
                  request_id: "abc123def456"

    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              type: "https://api.qurl.link/problems/invalid_token"
              title: "Invalid Token"
              status: 401
              detail: "Token validation failed"
              instance: "/v1/qurls"
              code: "invalid_token"
            meta:
              request_id: "abc123def456"

    Forbidden:
      description: Insufficient permissions or quota exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            insufficientScope:
              summary: Missing required scopes
              value:
                error:
                  type: "https://api.qurl.link/problems/insufficient_scope"
                  title: "Insufficient Scope"
                  status: 403
                  detail: "Missing required permissions: qurl:write"
                  instance: "/v1/qurls"
                  code: "insufficient_scope"
                meta:
                  request_id: "abc123def456"
            quotaExceeded:
              summary: A plan limit was reached
              # This example sits on the SHARED Forbidden component, which many
              # operations $ref. Keep detail and instance GENERIC: the
              # operation-specific wording lives on CreateQurlForbidden,
              # CreateResourceForbidden and CreateQurlForResourceForbidden,
              # and rendering resource-cap advice on an unrelated 403 is worse
              # than rendering none. `instance` is OMITTED for the same reason:
              # any concrete path here is exactly as operation-specific as the
              # detail text this example was generalized to avoid.
              value:
                error:
                  type: "https://api.qurl.link/problems/quota_exceeded"
                  title: "Quota Exceeded"
                  status: 403
                  detail: "A plan limit for this operation was reached"
                  code: "quota_exceeded"
                meta:
                  request_id: "abc123def456"

    CreateQurlForbidden:
      description: Forbidden while creating a qURL; inspect error.code
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            insufficientScope:
              summary: Missing required scopes
              value:
                error:
                  type: "https://api.qurl.link/problems/insufficient_scope"
                  title: "Insufficient Scope"
                  status: 403
                  detail: "Missing required permissions: qurl:write"
                  instance: "/v1/qurls"
                  code: "insufficient_scope"
                meta:
                  request_id: "abc123def456"
            quotaExceeded:
              summary: Quota limit reached
              value:
                error:
                  type: "https://api.qurl.link/problems/quota_exceeded"
                  title: "Quota Exceeded"
                  status: 403
                  detail: "Active protected resource limit reached (10/10)"
                  instance: "/v1/qurls"
                  code: "quota_exceeded"
                meta:
                  request_id: "abc123def456"
            credentialTypeForbidden:
              summary: Credential cannot create the requested resource type
              value:
                error:
                  type: "https://api.qurl.link/problems/forbidden"
                  title: "Forbidden"
                  status: 403
                  detail: "agent device keys can only use POST /v1/qurls for URL resources"
                  instance: "/v1/qurls"
                  code: "forbidden"
                meta:
                  request_id: "abc123def456"
            connectorDisabled:
              summary: qURL Connector operations are disabled
              value:
                error:
                  type: "https://api.qurl.link/problems/connector_disabled"
                  title: "qURL Connector Disabled"
                  status: 403
                  detail: "qURL Connector operations are currently unavailable"
                  instance: "/v1/qurls"
                  code: "connector_disabled"
                meta:
                  request_id: "abc123def456"

    CreateResourceForbidden:
      description: Forbidden while creating a resource; inspect error.code
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            insufficientScope:
              summary: Missing required scopes
              value:
                error:
                  type: "https://api.qurl.link/problems/insufficient_scope"
                  title: "Insufficient Scope"
                  status: 403
                  detail: "Missing required permissions: qurl:write"
                  instance: "/v1/resources"
                  code: "insufficient_scope"
                meta:
                  request_id: "abc123def456"
            credentialTypeForbidden:
              summary: Credential cannot create the requested resource type
              value:
                error:
                  type: "https://api.qurl.link/problems/forbidden"
                  title: "Forbidden"
                  status: 403
                  detail: "agent device keys can only create URL or qURL Connector resources (got type=\"transit\")"
                  instance: "/v1/resources"
                  code: "forbidden"
                meta:
                  request_id: "abc123def456"
            quotaExceeded:
              summary: Protected-resource limit reached
              value:
                error:
                  type: "https://api.qurl.link/problems/quota_exceeded"
                  title: "Quota Exceeded"
                  status: 403
                  detail: "quota exceeded: protected resource limit reached (10/10) — revoke an unused resource or upgrade your plan (qURLs for resources you already have are not affected)"
                  instance: "/v1/resources"
                  code: "quota_exceeded"
                meta:
                  request_id: "abc123def456"
            connectorDisabled:
              summary: qURL Connector operations are disabled
              value:
                error:
                  type: "https://api.qurl.link/problems/connector_disabled"
                  title: "qURL Connector Disabled"
                  status: 403
                  detail: "qURL Connector operations are currently unavailable"
                  instance: "/v1/resources"
                  code: "connector_disabled"
                meta:
                  request_id: "abc123def456"

    CreateQurlForResourceForbidden:
      description: Forbidden while minting a qURL for a resource; inspect error.code
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            insufficientScope:
              summary: Missing required scopes
              value:
                error:
                  type: "https://api.qurl.link/problems/insufficient_scope"
                  title: "Insufficient Scope"
                  status: 403
                  detail: "Missing required permissions: qurl:write"
                  instance: "/v1/resources/MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA/qurls"
                  code: "insufficient_scope"
                meta:
                  request_id: "abc123def456"
            quotaExceeded:
              summary: Quota limit reached
              value:
                error:
                  type: "https://api.qurl.link/problems/quota_exceeded"
                  title: "Quota Exceeded"
                  status: 403
                  detail: "Monthly data-transfer limit reached"
                  instance: "/v1/resources/MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA/qurls"
                  code: "quota_exceeded"
                meta:
                  request_id: "abc123def456"
            accessDenied:
              summary: Resource belongs to another owner
              value:
                error:
                  type: "https://api.qurl.link/problems/access_denied"
                  title: "Access Denied"
                  status: 403
                  detail: "resource is not owned by the authenticated caller"
                  instance: "/v1/resources/MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA/qurls"
                  code: "access_denied"
                meta:
                  request_id: "abc123def456"
            connectorDisabled:
              summary: qURL Connector operations are disabled
              value:
                error:
                  type: "https://api.qurl.link/problems/connector_disabled"
                  title: "qURL Connector Disabled"
                  status: 403
                  detail: "qURL Connector operations are currently unavailable"
                  instance: "/v1/resources/MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA/qurls"
                  code: "connector_disabled"
                meta:
                  request_id: "abc123def456"

    Conflict:
      description: The request conflicts with an existing operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    PayloadTooLarge:
      description: Request body exceeds the endpoint limit
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              type: "https://api.qurl.link/problems/not_found"
              title: "Resource Not Found"
              status: 404
              detail: "qURL not found"
              instance: "/v1/qurls/q_0123456789a"
              code: "not_found"
            meta:
              request_id: "abc123def456"

    Gone:
      description: The resource or access token is no longer available; check error.code
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            tokenConsumed:
              summary: Access token already used
              value:
                error:
                  type: "https://api.qurl.link/problems/token_consumed"
                  title: "Token Consumed"
                  status: 410
                  detail: "Access token has already been used"
                  instance: "/v1/resolve"
                  code: "token_consumed"
                meta:
                  request_id: "abc123def456"
            tokenExpired:
              summary: Access token has expired
              value:
                error:
                  type: "https://api.qurl.link/problems/token_expired"
                  title: "Token Expired"
                  status: 410
                  detail: "Access token has expired"
                  instance: "/v1/resolve"
                  code: "token_expired"
                meta:
                  request_id: "abc123def456"

    BadGateway:
      description: Network access could not be granted
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              type: "https://api.qurl.link/problems/knock_failed"
              title: "Knock Failed"
              status: 502
              detail: "Failed to grant network access. The token may have been consumed."
              instance: "/v1/resolve"
              code: "knock_failed"
            meta:
              request_id: "abc123def456"

    RateLimitExceeded:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
        RateLimit-Limit:
          description: Maximum requests allowed
          schema:
            type: integer
        RateLimit-Remaining:
          description: Requests remaining in window
          schema:
            type: integer
        RateLimit-Reset:
          description: Seconds until the rate-limit window resets (RFC 9333)
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              type: "https://api.qurl.link/problems/rate_limit_exceeded"
              title: "Rate Limit Exceeded"
              status: 429
              detail: "Too many requests. Please try again later."
              instance: "/v1/qurls"
              code: "rate_limit_exceeded"
            meta:
              request_id: "abc123def456"

    TooManyWrongCodes:
      description: |
        Too many wrong codes were tried for this resource (`rate_limited`). No code is
        accepted for it, a correct one included, until `Retry-After` has passed.

        The rate limit of your plan also answers `429`, with the code `rate_limit_exceeded`.
      headers:
        Retry-After:
          description: Seconds until a code is accepted for this resource again
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              type: "https://api.qurl.link/problems/rate_limited"
              title: "Rate Limited"
              status: 429
              detail: "Too many wrong codes were tried for this resource, so no code is accepted for it right now. Ask the person who asked for access for the code on their screen, and try again after the time in Retry-After."
              instance: "/v1/resources/MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA/access-requests/[REDACTED]/approve"
              code: "rate_limited"
            meta:
              request_id: "abc123def456"

    ServiceUnavailable:
      description: Upstream service temporarily unavailable (e.g. Stripe rate limit)
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              type: "https://api.qurl.link/problems/service_unavailable"
              title: "Service Unavailable"
              status: 503
              detail: "Billing service temporarily unavailable, please retry"
              instance: "/v1/billing/checkout"
              code: "rate_limited"
            meta:
              request_id: "abc123def456"

    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              type: "https://api.qurl.link/problems/internal_error"
              title: "Internal Server Error"
              status: 500
              detail: "An unexpected error occurred. Please try again later."
              instance: "/v1/quota"
              code: "internal_error"
            meta:
              request_id: "abc123def456"

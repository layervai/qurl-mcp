  /v1/resources/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags:
        - Resources
      summary: Get resource details
      description: |
        Returns resource details and a preview of up to 100 qURLs. Use its CRID as `id`.
        Each qURL has its own label, expiration, access rules, and session limits.
        Use `GET /v1/resources/{id}/qurls` to retrieve all links with pagination.
      operationId: getResource
      security:
        - bearerAuth: [qurl:read]
      responses:
        '200':
          description: Resource details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: |
            The resource is closed. You can no longer create links for it.
            The response includes retained resource metadata in `meta.tombstone`.
            This metadata remains available until the retention period ends.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Resources
      summary: Update resource metadata
      description: |
        Updates resource metadata. Use its CRID as `id`.
        Omit `alias` to keep it, send a string to set it, or send `null` to clear it.
        An alias already used by another of your resources returns `409 alias_in_use`.
        If any change fails, none of the changes in the request are applied.
        One case is different: a request that sets a new `custom_domain` and also
        changes `tags`, `description` or `preserve_host`. The custom domain is saved
        first. If the other changes then fail, the request returns an error and the
        custom domain stays set.

        Change `custom_domain` and `alias` in separate PATCH requests. Combining them
        returns `400 mutually_exclusive_fields`.
        Change `custom_domain` and `allowed_device_keys` in separate PATCH requests.
        Combining them returns `400 invalid_input`. The same holds for
        `allowed_device_keys_add` and `allowed_device_keys_remove`.

        To change which devices can create links for a private resource, either replace
        the complete list with `allowed_device_keys`, or change single keys with
        `allowed_device_keys_add` and `allowed_device_keys_remove`. The two forms cannot
        be combined in one request (`400 invalid_input`). Adding and removing single
        keys is safe next to other requests that do the same: each request changes only
        the keys it names. Adding a key that is already listed, and removing a key that
        is not listed, change nothing and are not errors. The response always carries
        the complete resulting list.

        A `503` means that nothing was changed and that the request can be sent again
        after the time in `Retry-After`. A request with `allowed_device_keys_add` or
        `allowed_device_keys_remove` gets it when other activity on the same resource,
        of any kind, kept its change from being saved.

        A resource that is not active, for example a revoked one, cannot be updated:
        the request returns `400` with the code `invalid_input` or `revoked`, and
        changes nothing. Read `error.code`. The text of `error.detail` is for people
        and can change.
      operationId: updateResource
      security:
        - bearerAuth: [qurl:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceRequest'
      responses:
        '200':
          description: Resource updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Alias already in use by another resource. The entire PATCH
            is rolled back — all fields sent in the same request are
            NOT persisted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: |
            The resource is closed and this operation is no longer available.
            Use an active resource. The response can include `meta.tombstone` with retained
            resource metadata; clients must also handle its absence.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - Resources
      summary: Revoke resource and all its qURLs
      description: |
        Revokes a resource and blocks access through all its qURLs. Use the resource's CRID.
        To revoke one link, use `DELETE /v1/resources/{id}/qurls/{qurl_id}` instead.
        Repeating this request does not emit another revoke webhook.

        On `503`, revocation is saved but enforcement is still pending. Wait for
        `Retry-After`, then retry the same DELETE to confirm enforcement.
      operationId: deleteResource
      security:
        - bearerAuth: [qurl:write]
      responses:
        '204':
          description: Resource revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/resources/{id}/sharing:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Resources]
      summary: Get qURL Connector sharing status
      description: |
        Returns durable start/stop intent and the current observed connection
        state for an owned qURL Connector resource. `serving` requires at least
        one authenticated Connector connection that is ready to carry traffic
        for the current lifecycle.

        The response also carries the resource's `created_at` and your
        `publisher` profile, as people who request a link will see them.
        `publisher.verified: false` means the publisher name is self-declared
        and has not been confirmed.
      operationId: getResourceSharing
      security:
        - bearerAuth: [qurl:read]
      responses:
        '200':
          description: Connector sharing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSharingResponse'
              example:
                data:
                  resource_id: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA"
                  crid: "ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a"
                  desired_state: "on"
                  serving_epoch: 3
                  connection_state: "serving"
                  created_at: "2026-03-01T09:00:00Z"
                  publisher:
                    name: "Acme Docs"
                    verified: false
                meta:
                  request_id: "req_abc123"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [Resources]
      summary: Start or stop qURL Connector sharing
      description: |
        Sets durable desired sharing state. Repeating the same state is
        idempotent and preserves `serving_epoch`; changing state rotates the
        epoch so connections from the previous lifecycle stop serving
        immediately. A response that rotates the epoch reports
        `connection_state=connecting` conservatively; use GET to observe the
        later transition to `serving`. An unchanged `on` request performs the
        same fail-closed observation as GET and can return 503 when the current
        connection state cannot be determined unambiguously.
      operationId: updateResourceSharing
      security:
        - bearerAuth: [qurl:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceSharingRequest'
      responses:
        '200':
          description: Updated Connector sharing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSharingResponse'
              example:
                data:
                  resource_id: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA"
                  crid: "ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a"
                  desired_state: "on"
                  serving_epoch: 4
                  connection_state: "connecting"
                  created_at: "2026-03-01T09:00:00Z"
                  publisher:
                    name: "Acme Docs"
                    verified: false
                meta:
                  request_id: "req_abc123"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/resources/{id}/sharing/restart:
    parameters:
      - $ref: '#/components/parameters/AccountResourceOwner'
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Resources]
      summary: Restart qURL Connector sharing
      description: |
        Sets desired sharing state to `on` and always rotates `serving_epoch`,
        including when the Connector was stopped. Existing connections stop
        serving immediately and the Connector reconnects automatically. The
        mutation response reports `connection_state=connecting`
        conservatively; use GET to observe the later transition to `serving`.
      operationId: restartResourceSharing
      security:
        - bearerAuth: [qurl:write]
      responses:
        '200':
          description: Restarted Connector sharing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSharingResponse'
              example:
                data:
                  resource_id: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2cTVv5_3eeYCcLLq5ROYCqcmY50HiKZ9ATglIkPnCji1E_S63UMtXba1moR8-Q6EV7oM6zwwh9_j2CDujzXvLA"
                  crid: "ahpviqz46qwcvx56glfatm3p3ooccwfcf2it4sdgjervwdkapykw3o3qdq2a"
                  desired_state: "on"
                  serving_epoch: 5
                  connection_state: "connecting"
                  created_at: "2026-03-01T09:00:00Z"
                  publisher:
                    name: "Acme Docs"
                    verified: false
                meta:
                  request_id: "req_abc123"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/resources/{id}/invitations:
